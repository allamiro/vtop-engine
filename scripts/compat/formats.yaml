    fixtures: [crates/vtop-core/tests/fixtures/manifests/release-b-receipt-signed.json]
    fuzz: [manifest_parse]

  - id: 3
    name: Object key layout
    class: A
    marker: "none: the key's shape"
    status: partition path stable, file-name scheme evolving
    at_1_0: stable

  - id: 4
    name: Ledger digest (`ledger-digest-*.jsonl`)
