# The format registry (#743): every persisted and wire format VTOP owns, its
# class and status under docs/reference/compatibility.md, and the source
# constants that define it.
#
# scripts/check-format-registry.py keeps it true. It fails when the sources
# hold a magic or a VERSION, SCHEMA, MAGIC, PROTOCOL or FEATURE_LEVEL constant
# that no entry (and no not_formats row) names, when a listed constant's value
# or a tag set's highest tag differs from what is written here, or when the
# inventory table on the page differs from what this file generates
# (`scripts/check-format-registry.py --write`). So a version bump, a new
# magic, a new feature level or a new command kind is always an edit to this
# reviewed file.
#
# Per entry:
#   id, name, class (A archive, B node-local, C wire, D operator interface),
#   marker, status, at_1_0      the inventory row on the page;
#   constants                   {file, name, value}: value as written in Rust;
#   magics                      {file, magic}: a magic not held in a constant;
#   tag_sets                    {file, prefix, max}: the highest tag in use;
#   fixtures, fuzz              paths and fuzz targets that exist today;
#   one_way                     one-way steps taken so far, with the operator
#                               action that takes each.

formats:
  - id: 1
    name: Manifest
    class: A
    marker: "`version` `0.1` to `0.4`; writes `0.3`, `0.4` opt-in"
    status: stable reader, evolving writer
    at_1_0: reads `0.1` to `0.4` forever, writes `0.4`
    constants:
      - {file: crates/vtop-core/src/manifest.rs, name: VTOP_VERSION, value: '"0.3"'}
      - {file: crates/vtop-core/src/manifest.rs, name: VTOP_VERSION_04, value: '"0.4"'}
      - {file: crates/vtop-core/src/manifest.rs, name: MAX_READABLE_VERSION, value: '"0.4"'}
      - {file: crates/vtop-core/src/manifest.rs, name: VTOP_PROTOCOL, value: '"VTOP"'}
    fixtures: [crates/vtop-core/tests/fixtures/manifests]
    fuzz: [manifest_parse]
    one_way:
      - "manifest.write_version: \"0.4\" (operator setting, v0.10.0): readers before v0.8.0 report a 0.4 manifest as tampered"

  - id: 2
