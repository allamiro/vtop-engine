# Constants whose names look like format markers but are not.
not_formats:
  - {file: crates/vtop-state/src/sqlite_store.rs, name: SCHEMA, why: "the SQLite DDL; the ledger's version marker is SQLITE_SCHEMA_VERSION (format 5)"}
  - {file: crates/vtop-meta/src/command.rs, name: MAX_TIER_VERSION_ID_BYTES, why: "a length bound on an object version id"}
  - {file: crates/vtop-meta/src/transport/wire.rs, name: MAX_CLUSTER_VERSION_NODES, why: "a count bound on a node-versions reply"}
  - {file: crates/vtop-meta/src/transport/maybe_tls.rs, name: FRAME_MAGIC_FIRST, why: "the first byte the VTPW and VTPM magics share, used to tell plaintext from TLS"}
  - {file: crates/vtop-kafka/src/records.rs, name: MAGIC_V2, why: "the Kafka record batch's magic byte: Kafka's format, not VTOP's"}
  - {file: crates/vtop-observe/src/otel/settings.rs, name: PROTOCOL, why: "the OTLP export protocol name"}
