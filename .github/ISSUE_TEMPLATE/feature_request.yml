name: Feature request
description: Propose a change in behaviour, a new capability, or a new config key.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution. Title it `area: what you need`, for example `file source: archive files that are renamed into the watched directory`.

        Check [docs/ROADMAP.md](https://github.com/allamiro/vtop-engine/blob/main/docs/ROADMAP.md) and the README's *Known limitations* first; the change may already be planned. Write in your own words and keep it short (see CONTRIBUTING.md).

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and the roadmap, and this isn't covered.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - "Archive engine (vtopctl run: batching, recovery, replay)"
        - "Source: Kafka"
        - "Source: file"
        - "Source: syslog spool"
        - Upload and verification (object store backends)
        - "State store: SQLite or PostgreSQL"
        - "Cluster plane (vtop-node: metadata Raft, replication, promotion)"
        - Kafka gateway
        - CLI
        - Helm chart
        - Observability (metrics, logs)
        - Build, release or packaging
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you can't do today, who it affects, and what it costs you. Concrete numbers or a real deployment beat a general case.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd change. Name the config keys, CLI flags, metrics or behaviour you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other designs, workarounds with today's release, and doing nothing. Why they fall short.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and upgrade impact
      description: |
        Which of these the change touches, and how an upgrade and a rollback get through it:

        - durable formats: the manifest schema, the segment log, the ledger schema (SQLite and PostgreSQL), the metadata Raft log;
        - wire: vtop-protocol frames, what Kafka clients see from the gateway;
        - config keys: new, renamed or with a new default, and whether an older binary ignores, refuses or misreads the key;
        - mixed versions: a cluster or a fleet mid-way through a rolling upgrade.

        "None" is a fine answer if you say why.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and security
      description: Could it let a source commit before its batch is VERIFIED, weaken verification, change who may lead, or widen what an attacker reaches (see docs/SECURITY_MODEL.md)? Say so even if the answer is no.

  - type: textarea
    id: testing
    attributes:
      label: How it would be tested
      description: The test that would fail today and pass with the change. For failover, crash or durability behaviour, the fault scenario (crash sweep, kill -9, partition, full disk). For a performance claim, the measurement and its baseline.
    validations:
      required: true
