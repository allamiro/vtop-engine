# The long nemesis campaign over the cluster plane (#728, criterion A4 of
# #714): the live-chaos scenarios that hold a nemesis (kill, pause, partition,
# clock skew, disk full), run one after another with fresh seeds for many
# hours, each judged by its own assertions and by the history checkers.
#
# DISPATCH ONLY. It never runs on a pull request or a schedule: a 24-hour
# campaign is the maintainer's to start. The pull-request cost of the history
# checkers stays inside ci.yml's live-chaos job (their unit tests, and the
# scenarios that record histories).
#
# A GitHub-hosted job stops at 6 hours, so the campaign is split into legs
# that run side by side: `hours` is the total, each leg runs hours/legs, and
# each leg's job timeout is its campaign time plus 30 minutes. The plan job
# (scripts/live-chaos/plan_legs.py) refuses a split whose legs would pass 5.5
# hours on a GitHub-hosted runner, which is any `ubuntu-*`, `windows-*` or
# `macos-*` label; on any other label (a self-hosted runner) a leg may run up
# to 5 days.
#
# With `reintroduce` set, it runs no campaign: it re-introduces that fixed
# data-safety bug into a scratch build and shows the checkers catch it
# (scripts/live-chaos/history/reintroduce/run.sh), one bug per job (`all`
# runs the four side by side). `mode: sweep` (the default) judges the client
# histories the deterministic tests write on the patched build: the promotion
# crash sweep and the loopback test of a returning deposed leader. `mode:
# live` runs the live scenarios against it instead, which reach the bugs'
# shapes only by luck of timing. Each patched build compiles the tests from
# scratch and runs the full sweeps, so it is evidence for a release, not a
# gate; ci.yml checks on every pull request that the patches still apply and
# that the histories of the fixed build are valid.
name: chaos campaign

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Total campaign hours, split across the legs"
        default: "24"
        required: true
      legs:
        description: "Legs run side by side; each runs hours/legs"
        default: "6"
        required: true
      scenarios:
        description: "Scenario numbers to cycle through"
        default: "04 05 06 07 09 14 23"
        required: true
      runner:
        description: "runs-on label for the legs (a label that does not start with ubuntu-, windows- or macos- is a self-hosted runner and lifts the 5.5-hour leg limit to 5 days)"
        default: "ubuntu-latest"
        required: true
      reintroduce:
        description: "Instead of a campaign, re-introduce a fixed bug (or all four, one job each) and show the checkers catch it"
        type: choice
        default: "none"
        options: ["none", "611", "641", "261", "640", "all"]
      mode:
        description: "Re-introduction mode: sweep (the deterministic tests' histories) or live (the live scenarios)"
        type: choice
        default: "sweep"
        options: ["sweep", "live"]
      reintroduce_runs:
        description: "Runs for a live re-introduction (sweep mode ignores it)"
        default: "3"
        required: true

permissions:
  contents: read

# One queue per kind of run, so dispatching the re-introductions one bug at
# a time does not cancel the one still waiting.
concurrency:
  group: chaos-campaign-${{ inputs.reintroduce }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan the legs
    if: inputs.reintroduce == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
      hours_per_leg: ${{ steps.plan.outputs.hours_per_leg }}
      timeout_minutes: ${{ steps.plan.outputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        env:
          HOURS: ${{ inputs.hours }}
          LEGS: ${{ inputs.legs }}
          RUNNER: ${{ inputs.runner }}
        run: python3 scripts/live-chaos/plan_legs.py >> "$GITHUB_OUTPUT"

  campaign:
    name: campaign leg ${{ matrix.leg }}
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_minutes) }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # The live-chaos job's cache, read and written under its own key: this
      # workflow adds no cache entry of its own.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-chaos-${{ hashFiles('**/Cargo.lock') }}

      - name: Enable and verify unprivileged namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "note: sysctl unavailable on this image; relying on the probe"
          unshare -rm bash -c 'mount -t tmpfs -o size=1m tmpfs /mnt && echo "mount namespaces OK"'

      - name: Build harness binaries
        run: |
          cargo build -p vtop-node --bin vtop-node
          cargo build -p vtop-cli --no-default-features --bin vtopctl

      - name: Test the history checkers
        run: python3 -m unittest discover -s scripts/live-chaos/history -p 'test_*.py'

      - name: Run the campaign
        env:
          CHAOS_PROFILE: debug
          CAMPAIGN_HOURS: ${{ needs.plan.outputs.hours_per_leg }}
          CAMPAIGN_SCENARIOS: ${{ inputs.scenarios }}
          CAMPAIGN_OUT: ${{ runner.temp }}/campaign
        run: scripts/live-chaos/history/campaign.sh

      - name: Keep the runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: campaign-leg-${{ matrix.leg }}
          path: ${{ runner.temp }}/campaign/
          if-no-files-found: warn
          retention-days: 14

  report:
    name: campaign report
    needs: campaign
    if: always() && needs.campaign.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: campaign-leg-*
          path: legs
      - name: Sum the legs
        run: |
          python3 - << 'PY'
          import glob, json, os
          from collections import Counter
          runs = []
          for path in sorted(glob.glob("legs/*/runs.jsonl")):
              runs += [json.loads(l) for l in open(path) if l.strip()]
          verdicts = Counter(r["verdict"] for r in runs)
          hours = sum(r["seconds"] for r in runs) / 3600
          violated = [r for r in runs if "VIOLATED" in (r["data_history"], r["control_history"])]
          lines = [
              "## Chaos campaign",
              "",
              f"{len(runs)} runs over {hours:.1f} hours of scenario time: "
              + ", ".join(f"{k} {v}" for k, v in sorted(verdicts.items())),
              "",
              f"History violations: {len(violated)}",
          ]
          lines += [f"- run {r['run']} {r['scenario']} seed {r['seed']}: {r['violations']}" for r in violated]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if not runs or verdicts.get("FAIL") or violated:
              raise SystemExit(1)
          PY

  reintroduce:
    name: re-introduce #${{ matrix.bug }} (${{ inputs.mode }})
    if: inputs.reintroduce != 'none'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        bug: ${{ fromJSON(inputs.reintroduce == 'all' && '["611","641","261","640"]' || format('["{0}"]', inputs.reintroduce)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Re-introduce the bug, run it, judge the histories
        env:
          REINTRODUCE_OUT: ${{ runner.temp }}/reintroduce
          BUG: ${{ matrix.bug }}
          MODE: ${{ inputs.mode }}
          RUNS: ${{ inputs.reintroduce_runs }}
        run: |
          if [[ "$MODE" == sweep ]]; then
            scripts/live-chaos/history/reintroduce/run.sh --sweep "$BUG"
          else
            scripts/live-chaos/history/reintroduce/run.sh "$BUG" "$RUNS"
          fi
      - name: Keep the runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reintroduce-${{ matrix.bug }}-${{ inputs.mode }}
          path: |
            ${{ runner.temp }}/reintroduce/summary.jsonl
            ${{ runner.temp }}/reintroduce/build.log
            ${{ runner.temp }}/reintroduce/tests.log
            ${{ runner.temp }}/reintroduce/histories/
            ${{ runner.temp }}/reintroduce/run-*
          if-no-files-found: warn
          retention-days: 14
