name: link comparison (VTOP, aws-cli, rclone, s5cmd)

# The link comparison's harness (#747) on a GitHub-hosted runner.
#
# WHAT RUNS. `smoke` (the default, and the nightly): the unshaped `lan`
# profile, four small files, all four tools through the middlebox, the
# harness's read-back. It proves the lab end to end and records nothing
# rankable. `hosted`: `smoke`, then objects committed of 48 on the policed
# link (wan100-policed) at each tool's documented defaults: the one cell a
# hosted runner is valid for (#744 section 4.4), and only where the recorded
# bottleneck is the link. Everything else (drain-style goodput, equal
# connections, the tuned grid, the neighbour) needs the dedicated Linux host:
# benchmarks/link_compare/README.md.
#
# A shaped plan needs ifb and the qdiscs the middlebox installs, so for
# `hosted` the first step after the input check proves the kernel has them,
# as competitor-pair.yml does, before anything is built.
#
# NOTHING IS COMMITTED. The run directory is uploaded as an artifact; a
# measured result is committed by hand from that artifact in a data PR.
on:
  workflow_dispatch:
    inputs:
      plan:
        description: "smoke (minutes, unshaped) or hosted (about 90 minutes, needs ifb)"
        required: false
        default: "smoke"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: link-compare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: link comparison (${{ inputs.plan || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PLAN: ${{ inputs.plan || 'smoke' }}
    steps:
      - name: The plan input names a plan this workflow runs
        run: |
          case "${PLAN}" in
            smoke|hosted) echo "plan: ${PLAN}" ;;
            *) echo "::error::plan must be smoke or hosted, got '${PLAN}'"; exit 1 ;;
          esac

      - name: The kernel provides ifb and the qdiscs the middlebox installs
        if: env.PLAN == 'hosted'
        run: |
          set -euo pipefail
          mods=(ifb sch_netem sch_tbf sch_ingress cls_u32 act_mirred act_police)
          uname -r
          if ! sudo modprobe -a "${mods[@]}"; then
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe -a "${mods[@]}"
          fi
          sudo ip netns add ifbprobe
          sudo ip -n ifbprobe link add ifb0 type ifb
          sudo ip -n ifbprobe link set ifb0 up
          sudo ip netns del ifbprobe
          echo "ifb: created and brought up inside a network namespace"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Name the engine image by what it is built from
        id: tree
        working-directory: benchmarks
        run: echo "tag=vtop-compare:$(python3 -c 'from compare_common import lab; print(lab.engine_tree())')" >> "$GITHUB_OUTPUT"

      # Read-only use of the image job's cache entry: no cache of this
      # workflow's own is written.
      - name: Build the engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ steps.tree.outputs.tag }}
          load: true
          cache-from: type=gha,scope=ci-image

      - name: Build the lab's MinIO image
        run: docker build -t vtop-minio:RELEASE.2025-09-07T16-13-09Z docker/minio

      - name: Run the plan
        id: run
        run: python3 benchmarks/link_compare/run.py --plan "${PLAN}" --host-class hosted --run-id "link-gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Check the run directory
        if: always() && steps.run.outcome != 'skipped'
        run: |
          dir="benchmarks/link_compare/results/link-gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -d "$dir" ]; then
            { echo '```'; python3 benchmarks/link_compare/run.py --check "$dir" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the run directory
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-compare-${{ env.PLAN }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmarks/link_compare/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear the lab down
        if: always()
        run: docker compose -p vtop-link -f benchmarks/link_compare/compose.yml --profile tools down --volumes --remove-orphans --timeout 30 || true
