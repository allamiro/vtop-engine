name: postgres matrix

# The state store on every PostgreSQL major docs/POSTGRES_DEPLOYMENT.md
# declares supported ("Supported PostgreSQL versions") (#723): the battery,
# `vtopctl migrate` twice, a ledger restore into a migrated schema and the
# engine's recovery, each against a real server of that major.
#
# Who runs which majors:
# - ci.yml calls this workflow on a pull request (and on a push to main) with
#   the oldest and newest major, 14 and 18, when its `postgres` path filter
#   matches. Catalog and dump-format differences show at the ends of the
#   range; two legs keep the per-PR cost near the one job it was before.
# - Nightly (00:47 UTC) and on dispatch it runs all five, over whatever main
#   holds, so a change outside the PR filter is still tested on every major
#   within a day.
# - A pull request that changes this file (a pin refreshed, a step changed)
#   runs all five on its own head: the schedule and dispatch run only from
#   main, so this is the one way a new pin is proven before it merges. ci.yml's
#   filter leaves this file out, so such a pull request does not also run 14
#   and 18 a second time through the call.
#
# The restore drill (#734) runs from the same images, on the same schedule: the
# nightly, a dispatch and a pull request that changes this file run it on every
# major asked for; a call from ci.yml does not (it is the heavier job, and the
# state store's own change is already judged by the battery above).
#
# The images are pinned once, below, so a pull request and the nightly can
# never test different builds of the same major. A major is added here first
# and then to the docs list, and dropped from both together.

on:
  workflow_call:
    inputs:
      majors:
        description: 'JSON list of PostgreSQL majors to test, e.g. ["14","18"]; each must be pinned below'
        required: true
        type: string
  schedule:
    # 00:47 UTC: off the hour, and clear of the other nightlies.
    - cron: "47 0 * * *"
  pull_request:
    paths:
      - '.github/workflows/postgres-matrix.yml'
  workflow_dispatch:
    inputs:
      majors:
        description: 'JSON list of PostgreSQL majors to test; empty runs all five'
        required: false
        type: string
        default: ''

# Two nightlies queue rather than cancel each other. A call from ci.yml or a
# dispatch gets a group of its own: inside a called workflow `github.workflow`
# is the caller's name, so a shared name could deadlock against ci.yml's group.
concurrency:
  group: postgres-matrix-${{ github.event_name == 'schedule' && 'nightly' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  majors:
    name: which majors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Pick the pinned images for the requested majors
        id: pick
        env:
          REQUESTED: ${{ inputs.majors }}
          # One line per major: the major, then the multi-arch index of the
          # official `postgres:<major>` tag, pinned by digest and read from
          # Docker Hub (hub.docker.com/v2/repositories/library/postgres/tags/<major>)
          # on 2026-11-14, with the minor it resolved to in the comment above
          # it; its amd64 and arm64 images are those of the `<major>.<minor>`
          # tag. Dependabot does not read these, so they are refreshed by hand,
          # as the lab images are (vtop-ci-supply-chain, "Workflow and image
          # pins"): re-read the tag's digest and update the minor beside it.
          PINNED_IMAGES: |
            # 14.25. Upstream support ended 2026-11-12; dropped at the next minor release (docs/POSTGRES_DEPLOYMENT.md).
            14 postgres:14@sha256:980b7cb415aa0f812f65bdec8f6f599be408d8ed9c83ffcaa12650eac397b264
            # 15.20, supported upstream until 2027-11-11.
            15 postgres:15@sha256:5a407822929c3789ff5154d3d35bd7e2090318149344c8a3d4ca942b035822ed
            # 16.16, supported upstream until 2028-11-09.
            16 postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
            # 17.12, supported upstream until 2029-11-08.
            17 postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
            # 18.7, supported upstream until 2030-11-14.
            18 postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        run: |
          set -euo pipefail
          pinned=$(printf '%s\n' "$PINNED_IMAGES" | grep -Ev '^[[:space:]]*(#|$)')
          if [ -z "$REQUESTED" ]; then
            # The nightly, a pull request that changes this file, or a
            # dispatch that left the input empty: all of them.
            requested=$(printf '%s\n' "$pinned" | awk '{print $1}' | jq -R . | jq -cs .)
          else
            requested=$(printf '%s' "$REQUESTED" | jq -c 'if type == "array" then [.[] | tostring] else error("not a list") end') \
              || { echo "::error::majors must be a JSON list such as [\"14\",\"18\"]; got: $REQUESTED"; exit 1; }
          fi
          if [ "$(printf '%s' "$requested" | jq length)" -eq 0 ]; then
            echo "::error::majors is an empty list; name at least one major"
            exit 1
          fi
          include=$(printf '%s\n' "$pinned" \
            | jq -R 'split(" ") | map(select(. != "")) | {pg: .[0], image: .[1]}' \
            | jq -cs --argjson want "$requested" '[.[] | select(.pg as $p | $want | index($p))]')
          # A major nobody pinned would otherwise be dropped from the matrix
          # without a word, and its absence read as a pass.
          unknown=$(jq -cn --argjson want "$requested" --argjson have "$include" '$want - [$have[].pg]')
          if [ "$unknown" != "[]" ]; then
            echo "::error::no image is pinned for PostgreSQL $unknown; pinned majors: $(printf '%s\n' "$pinned" | awk '{print $1}' | paste -sd, -)"
            exit 1
          fi
          echo "testing PostgreSQL majors: $(printf '%s' "$include" | jq -r '[.[].pg] | join(", ")')"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  # The Postgres backend (Phase 3) must pass the SAME behavioural battery as
  # SQLite, and its DB-level invariant trigger must reject a bypass.
  postgres:
    name: postgres backend (battery) (pg ${{ matrix.pg }})
    needs: majors
    runs-on: ubuntu-latest
    # vtop-cli is built for the migrate, restore and recovery tests.
    timeout-minutes: 30
    strategy:
      # One major failing must not hide the result of another.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.majors.outputs.include) }}
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: vtop
          POSTGRES_PASSWORD: vtop
          POSTGRES_DB: vtop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      VTOP_TEST_POSTGRES: postgres://vtop:vtop@localhost:5432/vtop
      VTOP_TEST_POSTGRES_RUNTIME: postgres://vtop_runtime_test:vtop-runtime-test@localhost:5432/vtop
    steps:
      # A leg whose service ran some other major would pass under this one's
      # name. Asked over the URL the tests use.
      - name: The service runs PostgreSQL ${{ matrix.pg }}
        env:
          SERVICE: ${{ job.services.postgres.id }}
          PG_MAJOR: ${{ matrix.pg }}
        run: |
          version="$(docker exec "$SERVICE" psql --no-psqlrc -tA -d "$VTOP_TEST_POSTGRES" -c 'SHOW server_version')"
          echo "server_version: $version"
          case "$version" in
            "$PG_MAJOR".*) ;;
            *)
              echo "::error::This leg is PostgreSQL $PG_MAJOR, but its service reports server_version '$version'. Check the image pinned for it in .github/workflows/postgres-matrix.yml."
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pg-${{ hashFiles('**/Cargo.lock') }}
      # vtop-state depends only on vtop-core (no librdkafka), so no system deps.
      - name: Run the Postgres StateStore battery
        run: cargo test -p vtop-state --features postgres,test-support --test pg_battery
      # No database involved: a socket that accepts and never answers must fail
      # the connect within its bound instead of hanging startup (#556).
      - name: Postgres connect is bounded
        run: cargo test -p vtop-state --features postgres --test connect_deadline
      # `vtopctl migrate` twice on an empty database, and a ledger restored
      # into a migrated schema (#723). The dump and restore tools are the
      # service's own, so they match the server's major. Without kafka, so no
      # librdkafka.
      - name: vtopctl migrate twice, and a restore into a migrated schema
        env:
          VTOP_TEST_PG_EXEC: docker exec -i ${{ job.services.postgres.id }}
        run: cargo test -p vtop-cli --no-default-features --features postgres --test postgres_migrate_restore
      # The engine's recovery over a PostgreSQL ledger (#664's matrix), which
      # skips without a database and so never ran in CI before #723. The
      # count is checked: a renamed test must not pass as zero tests run.
      - name: Engine recovery on PostgreSQL
        run: |
          set -o pipefail
          cargo test -p vtop-cli --no-default-features --features postgres \
            --test integration_state_recovery -- --exact \
            on_postgres_a_recovered_commit_is_counted_by_its_stored_class 2>&1 | tee recovery.log
          grep -q 'test result: ok. 1 passed' recovery.log

  # The ledger's backup and restore, drilled (#734): scripts/restore-drill.sh
  # starts a server from the leg's pinned image, runs an engine against it,
  # backs the ledger up while it runs (`pg_dump`; then a base backup with WAL
  # archiving), destroys it, restores it as docs/operate/backup-and-recovery.md
  # says, and checks that the engine resumed with no hole (`audit-coverage
  # --check-storage`, `scrub --sample`) and that the measured RPO and RTO are
  # inside the bounds the page documents. The tests above use the `services`
  # container; this job needs a server it can configure for archiving, stop and
  # destroy, so the script starts its own from the same digest.
  restore-drill:
    name: restore drill (pg ${{ matrix.pg }})
    needs: majors
    # Nightly, dispatch, and a pull request that changes this file (inputs.majors
    # is empty there; a call from ci.yml always names its majors).
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && inputs.majors == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.majors.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pg-${{ hashFiles('**/Cargo.lock') }}
      - name: Build vtopctl
        run: cargo build -p vtop-cli --no-default-features --features postgres --bin vtopctl
      - name: Pull the pinned image
        run: docker pull "${{ matrix.image }}"
      # Each mode's measurements go to the run's summary and, with its logs, to
      # an artifact; the script fails when RPO or RTO is past the documented
      # bound or the engine did not resume cleanly.
      - name: Dump and restore
        env:
          RESTORE_DRILL_PG_IMAGE: ${{ matrix.image }}
          RESTORE_DRILL_PG_MAJOR: ${{ matrix.pg }}
          RESTORE_DRILL_WORKDIR: ${{ runner.temp }}/restore-drill-dump
        run: scripts/restore-drill.sh postgres-dump target/debug/vtopctl
      - name: Base backup, WAL archive and point-in-time restore
        env:
          RESTORE_DRILL_PG_IMAGE: ${{ matrix.image }}
          RESTORE_DRILL_PG_MAJOR: ${{ matrix.pg }}
          RESTORE_DRILL_WORKDIR: ${{ runner.temp }}/restore-drill-pitr
        run: scripts/restore-drill.sh postgres-pitr target/debug/vtopctl
      - name: Keep the measurements and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-pg${{ matrix.pg }}
          path: |
            ${{ runner.temp }}/restore-drill-dump/result.json
            ${{ runner.temp }}/restore-drill-dump/logs
            ${{ runner.temp }}/restore-drill-pitr/result.json
            ${{ runner.temp }}/restore-drill-pitr/logs
          if-no-files-found: ignore
          retention-days: 30
