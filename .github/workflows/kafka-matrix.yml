name: kafka matrix

# The live-broker Kafka tests (tests/integration_kafka_to_minio.rs, the
# stale-commit tests of #614 and the stall-recovery tests of #623 among them)
# against every Apache Kafka release docs/install/kafka.md declares supported
# (#721). The oldest is 3.7, the first release the official apache/kafka
# image exists for and a KRaft-only setup; ZooKeeper-era brokers are
# documented as expected to work and untested.
#
# Who runs which brokers:
# - ci.yml calls this workflow on a pull request (and on a push to main) with
#   the oldest release, 3.7.2, when its `kafka` path filter matches. The
#   newest line is already the kafka-integration job in ci.yml, so one leg is
#   the per-PR cost.
# - Nightly (03:17 UTC) and on dispatch it runs all of them, over whatever
#   main holds, so a change outside the PR filter is still tested on every
#   release within a day.
# - A pull request that changes this file or the broker script runs all of
#   them on its own head: the schedule and dispatch run only from main, so
#   this is the one way a new pin is proven before it merges. ci.yml's `kafka`
#   filter leaves both files out, so such a pull request does not also run
#   3.7.2 a second time through the call.
#
# The test binary is built once and each leg runs it against its own broker,
# so a leg needs no Rust toolchain and the matrix costs one build. The build
# only restores the cache the kafka-integration job saves on main (the same
# test binary); this workflow saves no cache of its own.
#
# The images are pinned once, below, so a pull request and the nightly can
# never test different builds of the same release. A release is added here
# first and then to docs/install/kafka.md, and dropped from both together.

on:
  workflow_call:
    inputs:
      brokers:
        description: 'JSON list of Kafka releases to test, e.g. ["3.7.2"]; each must be pinned below'
        required: true
        type: string
  schedule:
    # 03:17 UTC: off the hour, and clear of the other nightlies.
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - '.github/workflows/kafka-matrix.yml'
      - 'scripts/kafka-broker.sh'
  workflow_dispatch:
    inputs:
      brokers:
        description: 'JSON list of Kafka releases to test; empty runs all of them'
        required: false
        type: string
        default: ''

# Two nightlies queue rather than cancel each other. A call from ci.yml or a
# dispatch gets a group of its own: inside a called workflow `github.workflow`
# is the caller's name, so a shared name could deadlock against ci.yml's group.
concurrency:
  group: kafka-matrix-${{ github.event_name == 'schedule' && 'nightly' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  brokers:
    name: which brokers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Pick the pinned images for the requested releases
        id: pick
        env:
          REQUESTED: ${{ inputs.brokers }}
          # One line per release: the version, then the multi-arch index of
          # the official `apache/kafka:<version>` tag (amd64 and arm64),
          # pinned by digest and read with `docker buildx imagetools inspect`
          # on 2026-11-16. Each is the newest patch of its minor on that day.
          # Dependabot does not read these, so they are refreshed by hand, as
          # the lab images are (vtop-ci-supply-chain, "Workflow and image
          # pins"): re-read the tag's digest, and change the version and the
          # docs table together.
          PINNED_IMAGES: |
            3.7.2 apache/kafka:3.7.2@sha256:8bd63e1bd445e5e19427a4bdbcc3d23bf6efd774b058a41b36ba87fda7623e34
            3.8.1 apache/kafka:3.8.1@sha256:22c4bea38875408e8f9fe52aca8e3a6ee67f9aa0090db59af99a2f6647558db5
            3.9.2 apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
            4.0.2 apache/kafka:4.0.2@sha256:836cafdad9f4825880d7cf1d5a21202915ae2527bd0ef1c3600c526ed7814d1f
            4.1.2 apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
            4.2.2 apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
            4.3.2 apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
            4.4.0 apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
        run: |
          set -euo pipefail
          pinned=$(printf '%s\n' "$PINNED_IMAGES" | grep -Ev '^[[:space:]]*(#|$)')
          if [ -z "$REQUESTED" ]; then
            # The nightly, a pull request that changes this file, or a
            # dispatch that left the input empty: all of them.
            requested=$(printf '%s\n' "$pinned" | awk '{print $1}' | jq -R . | jq -cs .)
          else
            requested=$(printf '%s' "$REQUESTED" | jq -c 'if type == "array" then [.[] | tostring] else error("not a list") end') \
              || { echo "::error::brokers must be a JSON list such as [\"3.7.2\",\"4.4.0\"]; got: $REQUESTED"; exit 1; }
          fi
          if [ "$(printf '%s' "$requested" | jq length)" -eq 0 ]; then
            echo "::error::brokers is an empty list; name at least one release"
            exit 1
          fi
          include=$(printf '%s\n' "$pinned" \
            | jq -R 'split(" ") | map(select(. != "")) | {kafka: .[0], image: .[1]}' \
            | jq -cs --argjson want "$requested" '[.[] | select(.kafka as $k | $want | index($k))]')
          # A release nobody pinned would otherwise be dropped from the matrix
          # without a word, and its absence read as a pass.
          unknown=$(jq -cn --argjson want "$requested" --argjson have "$include" '$want - [$have[].kafka]')
          if [ "$unknown" != "[]" ]; then
            echo "::error::no image is pinned for Kafka $unknown; pinned releases: $(printf '%s\n' "$pinned" | awk '{print $1}' | paste -sd, -)"
            exit 1
          fi
          echo "testing Kafka releases: $(printf '%s' "$include" | jq -r '[.[].kafka] | join(", ")')"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: build the kafka test binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Restore only: the kafka-integration job in ci.yml saves this key on
      # main for the same test binary. A miss builds from scratch, which is
      # slower and still correct.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-kafka-it-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-kafka-it-
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      # cargo names the executable it built; a glob over target/debug/deps
      # could pick up a stale one from the restored cache.
      - name: Build the test binary
        run: |
          set -euo pipefail
          exe=$(cargo test -p vtop-cli --test integration_kafka_to_minio --no-run --locked --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "integration_kafka_to_minio" and .executable != null) | .executable')
          if [ -z "$exe" ] || [ ! -x "$exe" ]; then
            echo "::error::cargo reported no executable for the integration_kafka_to_minio test (got '$exe')"
            exit 1
          fi
          mkdir -p dist
          # Without its debug info the binary is about 80 MB instead of 460
          # (measured on aarch64), which every leg downloads. A panic still
          # names its file and line; only a backtrace loses its line numbers.
          strip --strip-debug -o dist/integration_kafka_to_minio "$exe"
          ls -l dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kafka-it-test-binary
          path: dist/integration_kafka_to_minio
          retention-days: 1
          if-no-files-found: error

  kafka:
    name: kafka integration (${{ matrix.kafka }})
    needs: [brokers, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One release failing must not hide the result of another.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.brokers.outputs.include) }}
    env:
      KAFKA_BROKER_NAME: vtop-kafka-broker
      KAFKA_ADVERTISED_HOST: localhost
      VTOP_TEST_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kafka-it-test-binary
          path: dist
      - name: Start Kafka ${{ matrix.kafka }}
        env:
          IMAGE: ${{ matrix.image }}
        run: bash scripts/kafka-broker.sh up "$IMAGE"
      # A leg whose broker ran some other release would pass under this one's
      # name.
      - name: The broker runs Kafka ${{ matrix.kafka }}
        env:
          KAFKA_VERSION: ${{ matrix.kafka }}
        run: |
          version="$(bash scripts/kafka-broker.sh version)"
          echo "broker version: $version"
          if [ "$version" != "$KAFKA_VERSION" ]; then
            echo "::error::This leg is Kafka $KAFKA_VERSION, but its broker reports '$version'. Check the image pinned for it in .github/workflows/kafka-matrix.yml."
            exit 1
          fi
      - name: Seed the it_events topic
        run: bash scripts/kafka-broker.sh seed
      # Every ignored test in the binary is a live-broker test. The count is
      # checked against the binary's own list, so a run that filtered out or
      # skipped tests cannot pass as a smaller green run.
      - name: Run the live-broker integration tests
        run: |
          set -euo pipefail
          chmod +x dist/integration_kafka_to_minio
          expected=$(dist/integration_kafka_to_minio --ignored --list | grep -c ': test$' || true)
          if [ "$expected" -eq 0 ]; then
            echo "::error::the test binary lists no ignored (live-broker) tests"
            exit 1
          fi
          dist/integration_kafka_to_minio --ignored 2>&1 | tee "$RUNNER_TEMP/kafka-it.log"
          if ! grep -q "^test result: ok. $expected passed; 0 failed" "$RUNNER_TEMP/kafka-it.log"; then
            echo "::error::expected all $expected live-broker tests to pass; the summary was: $(grep '^test result:' "$RUNNER_TEMP/kafka-it.log" || echo none)"
            exit 1
          fi
      - name: Broker log
        if: failure()
        run: bash scripts/kafka-broker.sh logs 2>&1 | tail -n 300
      - name: Stop the broker
        if: always()
        run: bash scripts/kafka-broker.sh down
