name: spool comparison (VTOP, Vector, Fluent Bit)

# The spool comparison (#748): files and a syslog spool to object storage,
# correctness cells only, on a GitHub-hosted runner.
#
# WHAT IT RUNS. `benchmarks/spool_compare/run.py --plan <plan>` with one of the
# plans in benchmarks/spool_compare/plans.json that a hosted runner is valid for:
# `smoke` (the default, and the nightly run: every tool, tiny data, the
# generator's rotations, the checker and one rotation kill end to end),
# `hosted-crash` (crash-K1..K3, 9 kills per kind per tool) or `hosted-rotation`
# (crash-K4-rotation and down-while-rotating in both rotation styles). Each tool
# gets 1 CPU, as #748 asks of a hosted run.
#
# WHAT IT IS NOT. A hosted runner is valid for correctness metrics only (gaps,
# duplicates, torn and orphan objects): the schema refuses a performance row
# from a hosted host (#744 section 4.4), so the drain and live cells never run
# here. Two hosted runs on different CPU models are separate runs.
#
# A RESULT IS COMMITTED BY HAND. The run directory is uploaded as an artifact;
# `gh run download <run> -n spool-compare-<plan>-<run>` gives the directory to
# commit under benchmarks/spool_compare/results/ in a data PR. Nothing here
# commits.
on:
  workflow_dispatch:
    inputs:
      plan:
        description: "smoke, hosted-crash or hosted-rotation"
        required: false
        default: "smoke"
  schedule:
    # Nightly smoke, so a broken harness or a moved image shows up within a day.
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: spool-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spool:
    name: spool comparison (${{ inputs.plan || 'smoke' }})
    runs-on: ubuntu-latest
    # hosted-rotation is projected at about 2.6 hours, plus the engine image build.
    timeout-minutes: 330
    env:
      PLAN: ${{ inputs.plan || 'smoke' }}
    steps:
      - name: The plan input is one a hosted runner is valid for
        run: |
          case "${PLAN}" in
            smoke|hosted-crash|hosted-rotation) ;;
            *) echo "::error::plan must be smoke, hosted-crash or hosted-rotation, got '${PLAN}'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Before anything long: the plan is one the kind can run and fits the job.
      - name: Plan
        working-directory: benchmarks
        run: python3 -m compare_common.plan spool_compare/plans.json "${PLAN}" --max-hours 5

      - name: Run the plan
        run: |
          set -o pipefail
          python3 benchmarks/spool_compare/run.py --plan "${PLAN}" --host-class hosted --tool-cpus 1 \
            --no-disk-probe --run-id "spool-${PLAN}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --max-hours 5 \
            2>&1 | tee "${RUNNER_TEMP}/spool-run.log"

      - name: Upload the run directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spool-compare-${{ inputs.plan || 'smoke' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/spool_compare/results/
            ${{ runner.temp }}/spool-run.log
          if-no-files-found: warn
          retention-days: 30

      - name: Leave no lab behind
        if: always()
        run: |
          for project in $(docker compose ls -a --format json | python3 -c 'import json,sys; print(" ".join(p["Name"] for p in json.load(sys.stdin) if p["Name"].startswith("vtop748-")))'); do
            docker compose -p "${project}" down -v --remove-orphans || true
          done
