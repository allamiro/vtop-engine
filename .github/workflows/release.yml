# Release pipeline: cut binaries, a multi-arch container image, an SBOM, and a
# GitHub Release from a `v*` tag.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# CI (ci.yml) only runs on pushes/PRs to `main`, NOT on tags, so this workflow
# re-runs fmt/clippy/test itself as a gate before publishing anything.
#
# Scope note: a plain vX.Y.Z tag, 0.x included, publishes as a full GitHub
# release; only a version with a pre-release suffix (-rc.1) publishes as a
# pre-release (the "Derive version + release channel" step says why). VTOP is
# a prototype; see docs/PRODUCTION_HA.md §19 (Known limitations) before
# depending on it.
name: Release

# Least privilege by default; the docker, image-manifest and release jobs
# elevate exactly what they need (packages/id-token, attestations and contents)
# per-job.
permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (dry-run; no release is published)"
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The archive ships BOTH binaries: `vtop-node` (the metadata/data-plane node
  # a deployment actually runs) and `vtopctl` (the operator CLI). A release
  # with only the CLI would be a steering wheel without the car.
  BUNDLE_NAME: vtop-engine
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-published release

jobs:
  # ---------------------------------------------------------------------------
  # Gate: nothing is published unless the workspace is clean and green.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      # librdkafka (cmake-build feature) compiles from source: it needs cmake +
      # a C toolchain, SSL + SASL, zlib, and libcurl (SASL OAUTHBEARER/OIDC
      # #includes <curl/curl.h>).
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      - run: cargo fmt --all --check
      # --locked matters most here: a release must ship the dependency versions
      # that were actually tested, not whatever resolves at build time.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      - name: Derive version + release channel
        id: meta
        # The tag / dispatch input is attacker-influenced text. Pass it through the
        # environment instead of interpolating `${{ }}` straight into the script,
        # which would let a crafted tag name inject shell commands (the Cargo
        # version cross-check below happens too late to prevent that).
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="${INPUT_TAG:-$REF_NAME}"
          version="${ref#v}"
          # Cross-check the tag against the workspace version so a mistagged
          # release fails loudly instead of shipping mislabeled artifacts.
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag version ($version) != workspace Cargo.toml version ($cargo_version)"
            exit 1
          fi
          # A pre-release SUFFIX (-alpha, -rc.1, ...) publishes as a GitHub
          # pre-release. A 0.x major does NOT.
          #
          # The two mean different things and conflating them cost us the
          # release sidebar. Semver's 0.x says "the API may break"; GitHub's
          # pre-release flag says "this is a preview, not the release you
          # want". v0.1.0 is tagged, signed, SBOM'd and shipped as the
          # recommended version — it is the second thing's opposite.
          #
          # The practical cost of getting this wrong: GitHub's `releases/latest`
          # endpoint only ever resolves to a non-pre-release, so a repo with
          # only pre-releases has NO latest release. The sidebar then degrades
          # from a version card to a bare "N tags" link, and `gh release
          # download` with no tag fails.
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # `latest` (the image tag, and GitHub's "Latest release") names the
          # NEWEST final release, not the one tagged most recently: a 0.9.1
          # fix cut after 0.10.0 must not pull `latest` back to the older
          # line. Compare against every final v* tag on the remote (this tag
          # included); only a version no other final tag outranks is latest.
          latest=false
          if [ "$prerelease" = false ]; then
            newest="$(git ls-remote --tags --refs origin 'v*' \
              | sed 's|.*refs/tags/v||' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | { cat; echo "$version"; } \
              | sort -V | tail -n1)"
            if [ "$newest" = "$version" ]; then
              latest=true
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease=$prerelease, latest=$latest)"

  # ---------------------------------------------------------------------------
  # Binaries. Each target builds on its native runner: librdkafka is compiled
  # from source via cmake, so cross-compiling is unreliable. Windows is
  # deliberately NOT built (rdkafka + cmake there is not validated) — shipping
  # nothing beats shipping a broken binary.
  # ---------------------------------------------------------------------------
  binaries:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-14 was retired by GitHub ("The configuration 'macos-14-arm64-us-default'
          # is not supported", v0.7.0 release run); macos-15 is the arm64 runner.
          - os: macos-15
            target: aarch64-apple-darwin
          # macos-13 was retired by GitHub; macos-15-intel is the current x86_64 runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        # Since #677, rdkafka builds OpenSSL from source (`ssl-vendored`) and
        # leaves Cyrus SASL out (Kerberos is the opt-in `kafka-gssapi`
        # feature). The macOS legs need only cmake, plus the perl and make
        # the runner image already has, and no Homebrew library ends up
        # linked into the binaries.
        env:
          # Deterministic release builds: install exactly what is asked for,
          # without a mid-release formula update ride-along.
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # The runner image ships third-party taps (aws/tap) pre-tapped, and
          # Homebrew's tap-trust model warns on every invocation while an
          # untrusted tap is present. Nothing here uses them — REMOVE rather
          # than trust: a tap delivers arbitrary code, and trusting one this
          # build never reads would be pure attack surface.
          brew untap aws/tap 2>/dev/null || true
          brew install cmake
          # The oldest macOS the binaries support. .cargo/config.toml sets the
          # same value; it is set here as well so the workflow log shows it.
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build
        if: runner.os == 'macOS'
        run: cargo build --release --bin vtop-node --bin vtopctl --target ${{ matrix.target }} --locked

      # A Linux binary needs at least the glibc it was linked against: the C
      # dependencies (librdkafka, zstd, sqlite, ...) pick up the newest symbol
      # versions of the build host's headers. Built on the runner's Ubuntu
      # 24.04 (glibc 2.39), v0.10.0's vtopctl needed GLIBC_2.39 and did not
      # start on Debian 12, Ubuntu 22.04 or RHEL 8/9 (#808). Building inside
      # AlmaLinux 8 (glibc 2.28) sets the floor at 2.28. Still native on both
      # runners: librdkafka's cmake build does not cross-compile reliably.
      # `docker run` rather than a job `container:`, so the JavaScript actions
      # keep running on the host and not against an old glibc. The toolchain
      # is the one the step above installed (mounted, not installed again), so
      # the pin stays in one place.
      - name: Build (Linux, inside AlmaLinux 8 for a glibc 2.28 floor)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          # almalinux:8, a multi-arch index; Docker picks the runner's arch.
          BUILD_IMAGE: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
        run: |
          set -euo pipefail
          docker run --rm \
            -e TARGET -e CARGO_TERM_COLOR -e RUST_BACKTRACE -e CARGO_INCREMENTAL \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/cargo -e RUSTUP_HOME=/rustup \
            -v "${CARGO_HOME:-$HOME/.cargo}:/cargo" \
            -v "${RUSTUP_HOME:-$HOME/.rustup}:/rustup" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            "$BUILD_IMAGE" bash -c '
              set -euo pipefail
              # gcc 8 and cmake from the distribution. OpenSSL is built from
              # source (ssl-vendored, which needs perl); the -devel packages
              # are what librdkafka probes for, and the floor check below
              # fails if one of them ends up linked.
              # Retried: the only step that needs the distribution mirrors,
              # and one hiccup would otherwise fail a 10 to 20 minute leg.
              for i in 1 2 3; do
                dnf -y -q install gcc gcc-c++ make cmake perl \
                  openssl-devel cyrus-sasl-devel libcurl-devel zlib-devel && break
                [ "$i" = 3 ] && { echo "dnf install failed 3 times" >&2; exit 1; }
                sleep 15
              done
              # Hand the root-owned outputs back to the runner user.
              trap "chown -R \"\$HOST_UID:\$HOST_GID\" /src/target /cargo/registry /cargo/git 2>/dev/null || true" EXIT
              export PATH="/cargo/bin:$PATH"
              echo "$(getconf GNU_LIBC_VERSION), gcc $(gcc -dumpfullversion)"
              cargo --version
              cargo build --release --bin vtop-node --bin vtopctl --target "$TARGET" --locked
            '

      - name: Check macOS binaries load only system libraries (#677)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # A dylib outside /usr/lib or /System (a Homebrew keg, say) is a
          # library users must install, at a path that differs between arm64
          # (/opt/homebrew) and x86_64 (/usr/local). Fail the release instead
          # of shipping a binary that stops at launch.
          bad=0
          for bin in vtop-node vtopctl; do
            f="target/${{ matrix.target }}/release/$bin"
            otool -L "$f"
            if otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/)'; then
              echo "::error::$bin links a non-system library (listed above)"
              bad=1
            fi
            # The minimum macOS version recorded in the binary.
            otool -l "$f" | grep -A3 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | grep -E 'minos|version' | head -2
          done
          exit "$bad"

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          name="${BUNDLE_NAME}-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/vtop-node" "dist/$name/"
          cp "target/${{ matrix.target }}/release/vtopctl" "dist/$name/"
          # THE DOCUMENT SET CLOSES OVER ITS OWN LINKS. The README links
          # LICENSE-EE and COMMERCIAL.md; COMMERCIAL.md and LICENSE-EE both
          # send a reader to CONTRIBUTING.md for the contribution terms. Ship
          # any subset and the archive carries dead references — and the moment
          # an EE-backed binary ships, a recipient would not receive the terms
          # governing it (review). The rule is simply that whatever the bundled
          # docs link to, the bundle carries.
          #
          # `2>/dev/null || true` is kept for the reason it was here before, but
          # it hides every possible absence, so the files that must never be
          # missing are asserted explicitly below.
          cp README.md LICENSE LICENSE-EE COMMERCIAL.md CONTRIBUTING.md \
            "dist/$name/" 2>/dev/null || true
          # CONTRIBUTING.md sends a reader to docs/SECURITY_MODEL.md, which
          # itself links the protocol draft and its neighbours — the closure
          # rule is transitive, and chasing it link by link is a game this
          # step loses every time a doc gains a reference (review). The
          # WHOLE docs tree ships instead: markdown weighs nothing next to
          # the binaries, and a closed set stays closed by construction.
          mkdir -p "dist/$name/docs"
          cp -r docs/. "dist/$name/docs/" 2>/dev/null || true
          # The docs tree's own links reach OUTSIDE it (review, round two):
          # grep '\.\./' docs/*.md enumerates the full out-of-tree target
          # set — ../README.md (already at the bundle root), the benchmarks
          # README, the audit-exception file SECURITY_MODEL cites, and this
          # workflow itself. Copied preserving layout so every relative
          # link in the shipped tree resolves; the grep is the maintenance
          # tool when a doc gains a new escape.
          mkdir -p "dist/$name/benchmarks" "dist/$name/.cargo" "dist/$name/.github/workflows"
          cp benchmarks/README.md "dist/$name/benchmarks/" 2>/dev/null || true
          cp .cargo/audit.toml "dist/$name/.cargo/" 2>/dev/null || true
          cp .github/workflows/release.yml "dist/$name/.github/workflows/" 2>/dev/null || true
          # Every file the closure DEPENDS on is asserted (review): the
          # licenses the archive must never ship without, the security model
          # as the sentinel for the docs tree having copied, and the three
          # out-of-tree escapes — whose `|| true` copies would otherwise
          # no-op silently the day one of them moves.
          for required in LICENSE LICENSE-EE docs/SECURITY_MODEL.md \
            benchmarks/README.md .cargo/audit.toml .github/workflows/release.yml; do
            [ -f "dist/$name/$required" ] \
              || { echo "::error::$required is missing from the release bundle"; exit 1; }
          done
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      # The checks below read the binaries back out of the archive, so they
      # judge exactly what ships. Inline, not a script: a workflow_dispatch
      # dry-run builds an older tag's tree, which would not have a new script.
      - name: Check the Linux archive's library floor (#808)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCHIVE: ${{ steps.pkg.outputs.artifact }}
        run: |
          set -euo pipefail
          command -v objdump >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils; }
          x="$RUNNER_TEMP/archive"
          rm -rf "$x" && mkdir -p "$x"
          tar -xzf "$ARCHIVE" -C "$x"
          dir="$x/$(basename "$ARCHIVE" .tar.gz)"
          # The highest symbol version each library may be asked for: what
          # AlmaLinux / RHEL 8, the oldest supported distribution, ships
          # (glibc 2.28, libgcc_s and libstdc++ from gcc 8).
          declare -A floor=([GLIBC]=2.28 [GCC]=7.0.0 [GLIBCXX]=3.4.25 [CXXABI]=1.3.11)
          # Libraries every supported distribution's base install carries.
          # Anything else (libssl, libsasl2, libcurl, ...) is a package the
          # user would have to install, which docs/install/binaries.md says
          # they do not.
          allowed='^(libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|libgcc_s\.so\.1|libstdc\+\+\.so\.6|libz\.so\.1|ld-linux-(x86-64|aarch64)\.so\.[12])$'
          bad=0
          for bin in vtop-node vtopctl; do
            f="$dir/$bin"
            syms="$(objdump -T "$f")"
            for lib in GLIBC GCC GLIBCXX CXXABI; do
              max="$(grep -oE "\b${lib}_[0-9]+(\.[0-9]+)*\b" <<<"$syms" | sed "s/^${lib}_//" | sort -uV | tail -n1 || true)"
              [ -n "$max" ] || continue
              echo "$bin: highest ${lib}_ symbol version $max (floor ${floor[$lib]})"
              if [ "$(printf '%s\n%s\n' "$max" "${floor[$lib]}" | sort -V | tail -n1)" != "${floor[$lib]}" ]; then
                echo "::error::$bin needs ${lib}_$max, newer than the supported floor ${lib}_${floor[$lib]}:"
                grep -E "\b${lib}_${max//./\\.}\b" <<<"$syms" || true
                bad=1
              fi
            done
            while read -r needed; do
              echo "$bin: NEEDED $needed"
              if ! grep -qE "$allowed" <<<"$needed"; then
                echo "::error::$bin links $needed, which is not part of a base install"
                bad=1
              fi
            done < <(objdump -p "$f" | awk '$1 == "NEEDED" { print $2 }')
          done
          exit "$bad"

      # Run what ships on the oldest distribution of each family the docs
      # name, with nothing installed: the version check, then an archive-only
      # round trip (file source to a local directory, then the coverage audit
      # and a scrub that reads every object back). No network, no Kafka.
      - name: Smoke the Linux archive on Debian 12, Ubuntu 22.04 and AlmaLinux 8 (#808)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCHIVE: ${{ steps.pkg.outputs.artifact }}
          # Not VERSION: /etc/os-release, sourced below, sets that.
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Its own extraction, so this step does not depend on the floor
          # check above having run.
          x="$RUNNER_TEMP/smoke-archive"
          rm -rf "$x" && mkdir -p "$x"
          tar -xzf "$ARCHIVE" -C "$x"
          dir="$x/$(basename "$ARCHIVE" .tar.gz)"
          smoke="$RUNNER_TEMP/smoke.sh"
          cat >"$smoke" <<'SMOKE'
          set -euo pipefail
          umask 077
          . /etc/os-release
          echo "== $PRETTY_NAME, $(getconf GNU_LIBC_VERSION)"
          v="$(/a/vtopctl --version)"; echo "$v"
          [ "$v" = "vtopctl $EXPECTED_VERSION" ] || { echo "expected vtopctl $EXPECTED_VERSION"; exit 1; }
          v="$(/a/vtop-node --version 2>/dev/null)"; echo "$v"
          [ "$v" = "vtop-node $EXPECTED_VERSION" ] || { echo "expected vtop-node $EXPECTED_VERSION"; exit 1; }
          w="$(mktemp -d)"
          mkdir -p "$w/in" "$w/out" "$w/work"
          i=1
          while [ "$i" -le 200 ]; do
            printf 'CEF:0|VTOP|smoke|1.0|100|event %d|3|src=10.0.0.1 cnt=%d\n' "$i" "$i"
            i=$((i + 1))
          done >"$w/in/a.cef"
          cat >"$w/config.yaml" <<CONFIG
          engine:
            name: smoke
            tenant: default
            state_store: "sqlite://$w/state.db"
            work_dir: $w/work
            log_level: warn
          batching:
            max_records: 1000
            max_bytes: 1048576
            max_batch_age_seconds: 1
          compression:
            type: gzip
            level: 6
          checksum:
            algorithm: sha256
          sources:
            file:
              enabled: true
              paths: ["$w/in/*.cef"]
          upload:
            backend: localfs
            local_path: $w/out
            bucket: smoke
            prefix: ""
          CONFIG
          /a/vtopctl validate --config "$w/config.yaml"
          /a/vtopctl process-once --source file --config "$w/config.yaml"
          /a/vtopctl audit-coverage --check-storage --config "$w/config.yaml"
          /a/vtopctl scrub --config "$w/config.yaml"
          # One batch holds all 200 records, so the archived object, unpacked,
          # is the input file byte for byte.
          objects="$(find "$w/out" -name '*.cef.gz')"
          [ "$(find "$w/out" -name '*.cef.gz' | wc -l)" -eq 1 ] || { echo "expected one archived object, found: ${objects:-none}"; exit 1; }
          [ "$(gzip -dc "$objects" | cksum)" = "$(cksum <"$w/in/a.cef")" ] \
            || { echo "the archived object does not match the input file"; exit 1; }
          echo "archived object matches the 200-record input"
          SMOKE
          for image in \
            debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8 \
            ubuntu:22.04@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c \
            almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b; do
            docker run --rm -e EXPECTED_VERSION -v "$dir:/a:ro" -v "$smoke:/smoke.sh:ro" "$image" bash /smoke.sh
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUNDLE_NAME }}-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.artifact }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Multi-arch container image -> GHCR, with build-time SBOM + provenance
  # attestations, then keyless-signed with cosign.
  # ---------------------------------------------------------------------------
  # Each architecture builds NATIVELY on its own runner and pushes by digest;
  # a separate job below merges the digests into one multi-arch manifest. The
  # previous single-job form built linux/arm64 under QEMU emulation, which
  # compiles the whole Rust workspace 5-20x slower — 30+ minutes of the
  # release wall-clock for what native arm runners do in a few.
  docker:
    name: image (${{ matrix.platform }})
    # Depends on binaries + sbom, not just verify: a GHCR push is effectively
    # irreversible, so nothing image-shaped is published until every other
    # release artifact has succeeded. (Digest-only pushes below are untagged
    # and invisible to `docker pull` until the manifest job tags them, but the
    # ordering is kept for the same consistency argument.)
    needs: [verify, binaries, sbom]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    env:
      # Don't upload the `*.dockerbuild` build record: it is not a release
      # artifact and must not end up in the published release (see the release
      # job's artifact pattern).
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Digest-only push: untagged, invisible to `docker pull` until the
          # manifest job below stitches both architectures into the real tags.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'workflow_dispatch' }}
          sbom: true
          provenance: mode=max
          # Per-arch cache scopes so the two builds stop evicting each other.
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error

  # Merge the per-arch digests into one multi-arch manifest, tag it, sign it.
  # Seconds of work; the expensive compilation happened natively above.
  docker-manifest:
    name: image manifest (multi-arch tags)
    needs: [verify, docker]
    if: github.event_name != 'workflow_dispatch' # dispatch = dry-run build only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing and the provenance attestation
      attestations: write # the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # metadata-action emits each annotation ALREADY PREFIXED with its
          # level — `getJSON` builds `${level}:${label}`, defaulting to
          # `manifest`. The artifact we annotate here is the index, so ask for
          # index-level strings and pass them through untouched. Adding an
          # `index:` prefix ourselves would double it up into
          # `index:manifest:org.opencontainers...`, which buildx accepts as an
          # annotation key nothing ever reads.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_NAME }}
          # `latest` follows the newest final release, which includes 0.x
          # (see the prerelease classification above). A pre-release SUFFIX
          # withholds it (an -rc must never become what a bare `docker pull`
          # resolves to), and so does a fix for an older line (the verify
          # job's `latest` output).
          # metadata-action's default `flavor: latest=auto` adds `latest` to
          # every semver entry on its own, which would bypass the gate below;
          # turn it off so the raw entry is the only source of `latest`.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.latest == 'true' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # Annotations go on the INDEX, not just the per-arch images.
          #
          # `docker/metadata-action` labels each architecture's image config,
          # which is what a single-shot buildx multi-platform build used to
          # publish. Splitting the build (#246) made the tagged artifact a
          # manifest list stitched by `imagetools create`, and that list carries
          # no annotations unless they are passed here. GitHub reads
          # `org.opencontainers.image.source` off the artifact it can see to
          # link a GHCR package to its repository, so without this the image
          # publishes perfectly and is simply never associated with the repo —
          # which is why no Packages section appears in the sidebar.
          #
          # Built as an array, not by word-splitting a jq string: annotation
          # VALUES contain spaces (the description) and quotes do not survive
          # re-splitting a command substitution.
          #
          # Annotations are passed VERBATIM. metadata-action has already
          # prefixed each one with its level (see the env above), so prefixing
          # again here would produce `index:manifest:<key>=<value>` — an
          # annotation key nothing reads.
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && args+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$IMAGE_NAME@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:${{ needs.verify.outputs.version }}"

      - name: Assert the index is linked to this repository
        run: |
          set -euo pipefail
          # A silent regression here costs a whole release cycle to notice,
          # because the image works perfectly and only the association is gone.
          source_annotation="$(docker buildx imagetools inspect \
            "$IMAGE_NAME:${{ needs.verify.outputs.version }}" --raw \
            | jq -r '.annotations["org.opencontainers.image.source"] // ""')"
          expected="https://github.com/${{ github.repository }}"
          if [ "$source_annotation" != "$expected" ]; then
            echo "::error::multi-arch index is missing org.opencontainers.image.source=$expected (got '$source_annotation'). GHCR will publish the image but GitHub will not link it to this repository."
            exit 1
          fi
          echo "index annotated with source=$source_annotation"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign manifest (keyless)
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:${{ needs.verify.outputs.version }}" --format '{{ .Manifest.Digest }}')"
          cosign sign --yes "${IMAGE_NAME}@${digest}"

      # Build provenance for the image (#731): a SLSA attestation naming this
      # workflow, this tag and this commit, stored with GitHub's attestations
      # and in the registry beside the image. It describes the multi-arch
      # index the tags point at. This job is skipped for workflow_dispatch, so
      # a dry-run attests nothing.
      - name: Resolve the manifest digest
        id: manifest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:${{ needs.verify.outputs.version }}" --format '{{ .Manifest.Digest }}')"
          case "$digest" in sha256:*) ;; *) echo "::error::unexpected manifest digest '$digest'"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # What users run (docs/RELEASE_VERIFICATION.md), run here before the
      # release job can publish: a release whose image attestation does not
      # verify is not published. The signer workflow and the tag are pinned,
      # as the docs tell users to.
      - name: Verify the image's attestation
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          # Retried: the attestation was written seconds ago, and the lookup
          # can briefly lag the write.
          for i in 1 2 3; do
            gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners && exit 0
            [ "$i" = 3 ] || sleep 15
          done
          echo "::error::the image's attestation did not verify"
          exit 1

      - name: latest names the newest release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IS_NEWEST: ${{ needs.verify.outputs.latest }}
        run: |
          set -euo pipefail
          # The registry, not the tag list we asked for, is what `docker pull
          # :latest` resolves. When this release is the newest, `latest` must
          # be its digest; when it is not (an -rc, or an older line's fix),
          # `latest` must not have moved to it.
          this="$(docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" --format '{{ .Manifest.Digest }}')"
          latest="$(docker buildx imagetools inspect "$IMAGE_NAME:latest" --format '{{ .Manifest.Digest }}' 2>/dev/null || true)"
          if [ "$IS_NEWEST" = true ] && [ "$latest" != "$this" ]; then
            echo "::error::$IMAGE_NAME:latest is ${latest:-missing}, but $VERSION ($this) is the newest release"
            exit 1
          fi
          if [ "$IS_NEWEST" != true ] && [ "$latest" = "$this" ]; then
            echo "::error::$IMAGE_NAME:latest moved to $VERSION, which is not the newest final release"
            exit 1
          fi
          echo "$IMAGE_NAME:latest = ${latest:-missing}; $VERSION = $this (newest: $IS_NEWEST)"

  # ---------------------------------------------------------------------------
  # Source SBOM (SPDX) attached to the release.
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom (spdx)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: vtop-engine-sbom.spdx.json
          output-file: vtop-engine-sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: vtop-engine-sbom.spdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: collect artifacts, keyless-sign binaries, checksum everything,
  # and create the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: [verify, binaries, docker-manifest, sbom]
    if: github.event_name != 'workflow_dispatch' # dispatch = dry-run build only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # keyless cosign signing and provenance for binary archives
      attestations: write # build provenance for binary archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}
          # FULL history, not the default shallow clone. The changelog is
          # computed from `git log <previous-tag>..<tag>`, and a depth-1
          # checkout has no commits in that range — v0.2.0 published with a
          # single entry (its own release commit) instead of the twelve pull
          # requests it actually contained.
          fetch-depth: 0

      # Only pull the artifacts we intend to publish. build-push-action uploads a
      # `*.dockerbuild` build record by default, and an unfiltered download would
      # sweep it into artifacts/ where it would be checksummed and attached to the
      # release. (Belt-and-braces: the docker job also disables that upload.)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{vtop-engine-*,sbom}"
          path: artifacts
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign binary archives (keyless)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(artifacts/vtop-engine-*.tar.gz)
          if (( ${#archives[@]} == 0 )); then
            echo "::error::no binary archives found to sign"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            bundle="${archive}.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$archive"
            test -s "$bundle"
          done

      # Build provenance for the archives (#731), in addition to the Sigstore
      # bundles above: a SLSA attestation stored with GitHub's attestations,
      # which `gh attestation verify` checks. Like the rest of this job it is
      # skipped for workflow_dispatch, so a dry-run attests nothing. SHA256SUMS
      # is written after this and is not itself attested.
      - name: Attest the archives' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/vtop-engine-*.tar.gz

      # What users run (docs/RELEASE_VERIFICATION.md), run here before anything
      # is published: every archive must verify against this workflow at this
      # tag, from a GitHub-hosted runner, or the release is not published.
      - name: Verify the archives' attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(artifacts/vtop-engine-*.tar.gz)
          if (( ${#archives[@]} == 0 )); then
            echo "::error::no binary archives found to verify"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            ok=false
            # Retried: the attestation was written seconds ago, and the lookup
            # can briefly lag the write.
            for i in 1 2 3; do
              if gh attestation verify "$archive" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners; then
                ok=true
                break
              fi
              [ "$i" = 3 ] || sleep 15
            done
            if [ "$ok" != true ]; then
              echo "::error::$archive's attestation did not verify"
              exit 1
            fi
          done

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          sha256sum -- ./* > SHA256SUMS
          cat SHA256SUMS

      # The changelog is generated here rather than by `generate_release_notes`
      # because that option loses to an explicit `body`, which is why v0.1.0
      # shipped install instructions and no list of what changed at all.
      - name: Build changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tags are needed to find the previous release; actions/checkout
          # does not fetch them by default even at fetch-depth 0 for a tag
          # build. The depth itself is set on the checkout above — fetching
          # tags alone retrieves the refs but none of the history between
          # them, which is what made the first attempt emit an empty range.
          git fetch --tags --force --quiet
          {
            echo 'notes<<CHANGELOG_EOF'
            ./scripts/release-notes.sh "${GITHUB_REF_NAME}"
            echo 'CHANGELOG_EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: v${{ needs.verify.outputs.version }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          # GitHub's "Latest release" badge follows the same rule as the
          # image's `latest` tag: the newest final release, never an older
          # line's fix.
          make_latest: ${{ needs.verify.outputs.latest == 'true' }}
          files: artifacts/*
          # PROSE PARAGRAPHS MUST BE ONE LINE EACH.
          #
          # GitHub renders release bodies with GFM `breaks: true`, so every
          # single newline becomes a literal <br> — unlike a README, where soft
          # wraps join into a paragraph. Hard-wrapping this block at 80 columns
          # therefore puts a visible line break at every wrap point and the text
          # stops short of the page width. Let the browser wrap it.
          #
          # Code fences are exempt: their newlines are real.
          body: |
            ## VTOP Engine v${{ needs.verify.outputs.version }}

            > **Maturity:** VTOP is a **prototype / reference implementation**. Each release is signed, attested and published as a full release, not a GitHub pre-release; the 0.x series means a minor version may still break compatibility, and the release notes say where. Read [Known limitations](https://github.com/${{ github.repository }}/blob/main/docs/PRODUCTION_HA.md#19-known-limitations-current-code) (§19) before depending on this in production.

            ${{ steps.changelog.outputs.notes }}

            ### Install

            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}
            ```

            Binaries for `linux` (x86_64, aarch64) and `macOS` (arm64, x86_64) are attached below, each containing `vtop-node` and `vtopctl`. Windows is not built.

            Every artifact is signed (keyless Sigstore), the archives and the image carry a build provenance attestation, and an SPDX SBOM is attached. **[How to verify a release](https://github.com/${{ github.repository }}/blob/main/docs/RELEASE_VERIFICATION.md)** — cosign and `gh attestation verify` commands for the image and the archives, and what `SHA256SUMS` does and does not tell you.
