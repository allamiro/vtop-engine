# Release pipeline: cut binaries, a multi-arch container image, an SBOM, and a
# GitHub Release from a `v*` tag.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# CI (ci.yml) only runs on pushes/PRs to `main`, NOT on tags, so this workflow
# re-runs fmt/clippy/test itself as a gate before publishing anything.
#
# Scope note: 0.x tags publish as GitHub **pre-releases**. VTOP is a prototype;
# see docs/PRODUCTION_HA_PLAN.md §21 (Known limitations) before depending on it.
name: Release

# Least privilege by default; the docker and release jobs elevate exactly what
# they need (packages/id-token and contents respectively) per-job.
permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (dry-run; no release is published)"
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The archive ships BOTH binaries: `vtop-node` (the metadata/data-plane node
  # a deployment actually runs) and `vtopctl` (the operator CLI). A release
  # with only the CLI would be a steering wheel without the car.
  BUNDLE_NAME: vtop-engine
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-published release

jobs:
  # ---------------------------------------------------------------------------
  # Gate: nothing is published unless the workspace is clean and green.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      # librdkafka (cmake-build feature) compiles from source: it needs cmake +
      # a C toolchain, SSL + SASL, zlib, and libcurl (SASL OAUTHBEARER/OIDC
      # #includes <curl/curl.h>).
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      - run: cargo fmt --all --check
      # --locked matters most here: a release must ship the dependency versions
      # that were actually tested, not whatever resolves at build time.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      - name: Derive version + release channel
        id: meta
        # The tag / dispatch input is attacker-influenced text. Pass it through the
        # environment instead of interpolating `${{ }}` straight into the script,
        # which would let a crafted tag name inject shell commands (the Cargo
        # version cross-check below happens too late to prevent that).
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="${INPUT_TAG:-$REF_NAME}"
          version="${ref#v}"
          # Cross-check the tag against the workspace version so a mistagged
          # release fails loudly instead of shipping mislabeled artifacts.
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag version ($version) != workspace Cargo.toml version ($cargo_version)"
            exit 1
          fi
          # A pre-release SUFFIX (-alpha, -rc.1, ...) publishes as a GitHub
          # pre-release. A 0.x major does NOT.
          #
          # The two mean different things and conflating them cost us the
          # release sidebar. Semver's 0.x says "the API may break"; GitHub's
          # pre-release flag says "this is a preview, not the release you
          # want". v0.1.0 is tagged, signed, SBOM'd and shipped as the
          # recommended version — it is the second thing's opposite.
          #
          # The practical cost of getting this wrong: GitHub's `releases/latest`
          # endpoint only ever resolves to a non-pre-release, so a repo with
          # only pre-releases has NO latest release. The sidebar then degrades
          # from a version card to a bare "N tags" link, and `gh release
          # download` with no tag fails.
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease=$prerelease)"

  # ---------------------------------------------------------------------------
  # Binaries. Each target builds on its native runner: librdkafka is compiled
  # from source via cmake, so cross-compiling is unreliable. Windows is
  # deliberately NOT built (rdkafka + cmake there is not validated) — shipping
  # nothing beats shipping a broken binary.
  # ---------------------------------------------------------------------------
  binaries:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # macos-13 was retired by GitHub; macos-15-intel is the current x86_64 runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        # rdkafka is built with features ["cmake-build", "ssl", "sasl"], so
        # librdkafka needs BOTH OpenSSL and Cyrus SASL headers here, mirroring
        # libssl-dev + libsasl2-dev on the Linux legs. Without cyrus-sasl the
        # librdkafka cmake configure step can fail and block the release.
        env:
          # Deterministic release builds: install exactly what is asked for,
          # without a mid-release formula update ride-along.
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # The runner image ships third-party taps (aws/tap) pre-tapped, and
          # Homebrew's tap-trust model warns on every invocation while an
          # untrusted tap is present. Nothing here uses them — REMOVE rather
          # than trust: a tap delivers arbitrary code, and trusting one this
          # build never reads would be pure attack surface. (Setting
          # HOMEBREW_NO_REQUIRE_TAP_TRUST is the discouraged escape hatch and
          # is slated for removal upstream.)
          brew untap aws/tap 2>/dev/null || true
          brew install cmake openssl@3 cyrus-sasl
          # Homebrew prefix differs by arch (/opt/homebrew on arm64,
          # /usr/local on x86_64), so resolve it rather than hardcoding.
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          # cyrus-sasl is keg-only: expose it to pkg-config/cmake explicitly.
          echo "PKG_CONFIG_PATH=$(brew --prefix cyrus-sasl)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --bin vtop-node --bin vtopctl --target ${{ matrix.target }} --locked

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          name="${BUNDLE_NAME}-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/vtop-node" "dist/$name/"
          cp "target/${{ matrix.target }}/release/vtopctl" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          echo "artifact=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUNDLE_NAME }}-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.artifact }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Multi-arch container image -> GHCR, with build-time SBOM + provenance
  # attestations, then keyless-signed with cosign.
  # ---------------------------------------------------------------------------
  # Each architecture builds NATIVELY on its own runner and pushes by digest;
  # a separate job below merges the digests into one multi-arch manifest. The
  # previous single-job form built linux/arm64 under QEMU emulation, which
  # compiles the whole Rust workspace 5-20x slower — 30+ minutes of the
  # release wall-clock for what native arm runners do in a few.
  docker:
    name: image (${{ matrix.platform }})
    # Depends on binaries + sbom, not just verify: a GHCR push is effectively
    # irreversible, so nothing image-shaped is published until every other
    # release artifact has succeeded. (Digest-only pushes below are untagged
    # and invisible to `docker pull` until the manifest job tags them, but the
    # ordering is kept for the same consistency argument.)
    needs: [verify, binaries, sbom]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    env:
      # Don't upload the `*.dockerbuild` build record: it is not a release
      # artifact and must not end up in the published release (see the release
      # job's artifact pattern).
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Digest-only push: untagged, invisible to `docker pull` until the
          # manifest job below stitches both architectures into the real tags.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'workflow_dispatch' }}
          sbom: true
          provenance: mode=max
          # Per-arch cache scopes so the two builds stop evicting each other.
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}

      - name: Export digest
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error

  # Merge the per-arch digests into one multi-arch manifest, tag it, sign it.
  # Seconds of work; the expensive compilation happened natively above.
  docker-manifest:
    name: image manifest (multi-arch tags)
    needs: [verify, docker]
    if: github.event_name != 'workflow_dispatch' # dispatch = dry-run build only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # metadata-action emits each annotation ALREADY PREFIXED with its
          # level — `getJSON` builds `${level}:${label}`, defaulting to
          # `manifest`. The artifact we annotate here is the index, so ask for
          # index-level strings and pass them through untouched. Adding an
          # `index:` prefix ourselves would double it up into
          # `index:manifest:org.opencontainers...`, which buildx accepts as an
          # annotation key nothing ever reads.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_NAME }}
          # `latest` follows the current recommended release, which now
          # includes 0.x (see the prerelease classification above). Only a
          # pre-release SUFFIX withholds it: an -rc must never become what a
          # bare `docker pull` resolves to.
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # Annotations go on the INDEX, not just the per-arch images.
          #
          # `docker/metadata-action` labels each architecture's image config,
          # which is what a single-shot buildx multi-platform build used to
          # publish. Splitting the build (#246) made the tagged artifact a
          # manifest list stitched by `imagetools create`, and that list carries
          # no annotations unless they are passed here. GitHub reads
          # `org.opencontainers.image.source` off the artifact it can see to
          # link a GHCR package to its repository, so without this the image
          # publishes perfectly and is simply never associated with the repo —
          # which is why no Packages section appears in the sidebar.
          #
          # Built as an array, not by word-splitting a jq string: annotation
          # VALUES contain spaces (the description) and quotes do not survive
          # re-splitting a command substitution.
          #
          # Annotations are passed VERBATIM. metadata-action has already
          # prefixed each one with its level (see the env above), so prefixing
          # again here would produce `index:manifest:<key>=<value>` — an
          # annotation key nothing reads.
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && args+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$IMAGE_NAME@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:${{ needs.verify.outputs.version }}"

      - name: Assert the index is linked to this repository
        run: |
          set -euo pipefail
          # A silent regression here costs a whole release cycle to notice,
          # because the image works perfectly and only the association is gone.
          source_annotation="$(docker buildx imagetools inspect \
            "$IMAGE_NAME:${{ needs.verify.outputs.version }}" --raw \
            | jq -r '.annotations["org.opencontainers.image.source"] // ""')"
          expected="https://github.com/${{ github.repository }}"
          if [ "$source_annotation" != "$expected" ]; then
            echo "::error::multi-arch index is missing org.opencontainers.image.source=$expected (got '$source_annotation'). GHCR will publish the image but GitHub will not link it to this repository."
            exit 1
          fi
          echo "index annotated with source=$source_annotation"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifest (keyless)
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:${{ needs.verify.outputs.version }}" --format '{{ .Manifest.Digest }}')"
          cosign sign --yes "${IMAGE_NAME}@${digest}"

  # ---------------------------------------------------------------------------
  # Source SBOM (SPDX) attached to the release.
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom (spdx)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: vtop-engine-sbom.spdx.json
          output-file: vtop-engine-sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: vtop-engine-sbom.spdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: collect artifacts, keyless-sign binaries, checksum everything,
  # and create the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: [verify, binaries, docker-manifest, sbom]
    if: github.event_name != 'workflow_dispatch' # dispatch = dry-run build only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # keyless cosign signing for binary archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # On workflow_dispatch, build the requested tag rather than the
          # default branch, so a dry-run validates the real release ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Only pull the artifacts we intend to publish. build-push-action uploads a
      # `*.dockerbuild` build record by default, and an unfiltered download would
      # sweep it into artifacts/ where it would be checksummed and attached to the
      # release. (Belt-and-braces: the docker job also disables that upload.)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{vtop-engine-*,sbom}"
          path: artifacts
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binary archives (keyless)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(artifacts/vtop-engine-*.tar.gz)
          if (( ${#archives[@]} == 0 )); then
            echo "::error::no binary archives found to sign"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            bundle="${archive}.sigstore.json"
            cosign sign-blob --yes --bundle "$bundle" "$archive"
            test -s "$bundle"
          done

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          sha256sum -- ./* > SHA256SUMS
          cat SHA256SUMS

      # The changelog is generated here rather than by `generate_release_notes`
      # because that option loses to an explicit `body`, which is why v0.1.0
      # shipped install instructions and no list of what changed at all.
      - name: Build changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tags are needed to find the previous release; actions/checkout does
          # not fetch them by default even at fetch-depth 0 for a tag build.
          git fetch --tags --force --quiet
          {
            echo 'notes<<CHANGELOG_EOF'
            ./scripts/release-notes.sh "${GITHUB_REF_NAME}"
            echo 'CHANGELOG_EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: v${{ needs.verify.outputs.version }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: artifacts/*
          # PROSE PARAGRAPHS MUST BE ONE LINE EACH.
          #
          # GitHub renders release bodies with GFM `breaks: true`, so every
          # single newline becomes a literal <br> — unlike a README, where soft
          # wraps join into a paragraph. Hard-wrapping this block at 80 columns
          # therefore puts a visible line break at every wrap point and the text
          # stops short of the page width. Let the browser wrap it.
          #
          # Code fences are exempt: their newlines are real.
          body: |
            ## VTOP Engine v${{ needs.verify.outputs.version }}

            > **Maturity:** VTOP is a **prototype / reference implementation**. The 0.x series signals that the API may still change, not that a tag is a preview — each release is signed, attested, and intended for use. Read [Known limitations](https://github.com/${{ github.repository }}/blob/main/docs/PRODUCTION_HA_PLAN.md) (§21) before depending on this in production.

            ${{ steps.changelog.outputs.notes }}

            ### Install

            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}
            ```

            Binaries for `linux` (x86_64, aarch64) and `macOS` (arm64, x86_64) are attached below, each containing `vtop-node` and `vtopctl`. Windows is not built.

            Every artifact is signed (keyless Sigstore) and an SPDX SBOM is attached. **[How to verify a release](https://github.com/${{ github.repository }}/blob/main/docs/RELEASE_VERIFICATION.md)** — cosign commands for the image and the archives, and what `SHA256SUMS` does and does not tell you.
