name: s3-compat-results

# Refreshes the committed S3 compatibility results (#722, D6) from the newest
# successful CI run on `main`, regenerates the page and the README line, and
# opens a pull request with the change. Results reach `main` only through
# that reviewed pull request, never by hand and never by a direct push.
#
# It needs `contents: write` (to push its branch) and `pull-requests: write`
# (to open the pull request), and only this job holds them. Opening a pull
# request from a workflow also needs the repository setting "Allow GitHub
# Actions to create and approve pull requests"; without it the last step
# fails and says so, and the branch is left for the maintainer to open.
on:
  schedule:
    # Tuesdays 04:41 UTC: off the hour, as traffic.yml is, and after the
    # weekly s3-pins check.
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: s3-compat-results
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: refresh the committed S3 compatibility results
    if: github.repository == 'allamiro/vtop-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the report's one dependency
        run: pip install --disable-pip-version-check pyyaml==6.0.3

      # The newest successful run of ci.yml on main that ran the matrix (a
      # run whose path filter skipped it uploaded no results), and the newest
      # run of the opt-in s3-aws workflow that uploaded any (it skips, and
      # uploads nothing, until the maintainer configures it).
      - name: Download the newest results from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          newest() {
            local workflow=$1 dest=$2 run
            for run in $(gh run list --workflow "$workflow" --branch main --limit 30 \
                --json databaseId,conclusion --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | .databaseId'); do
              if gh run download "$run" --pattern 's3-compat-results-*' --dir "$dest" 2>/dev/null; then
                echo "$run"
                return 0
              fi
            done
            return 1
          }
          if run=$(newest ci.yml "$RUNNER_TEMP/results/ci"); then
            echo "RUN_ID=$run" >> "$GITHUB_ENV"
            echo "Matrix results from run $run"
          fi
          if aws=$(newest s3-aws.yml "$RUNNER_TEMP/results/aws"); then
            echo "AWS results from run $aws"
            echo "RUN_ID=${run:-$aws}" >> "$GITHUB_ENV"
          fi
          if [ ! -d "$RUNNER_TEMP/results/ci" ] && [ ! -d "$RUNNER_TEMP/results/aws" ]; then
            echo "No run on main in the last 30 of either workflow uploaded S3 compatibility results; nothing to refresh." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Regenerate from them
        if: env.RUN_ID != ''
        run: python3 scripts/s3_compat_report.py --ingest "$RUNNER_TEMP/results"

      - name: Open a pull request with the change
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- tests/s3-compat/results docs/reference/s3-compatibility.md README.md)" ]; then
            echo "The committed results already match run $RUN_ID." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="s3-compat/results-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tests/s3-compat/results docs/reference/s3-compatibility.md README.md
          git commit -m "tests: S3 compatibility results from CI run $RUN_ID (#722)"
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" \
              --title "tests: S3 compatibility results from CI run $RUN_ID" \
              --body "Results of the s3-compat matrix from https://github.com/${{ github.repository }}/actions/runs/$RUN_ID, regenerated by scripts/s3_compat_report.py. Refs #722"; then
            echo "::error::Could not open the pull request (is 'Allow GitHub Actions to create and approve pull requests' off?). The branch $branch is pushed; open it by hand."
            exit 1
          fi
