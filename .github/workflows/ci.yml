name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting `main`. This project stacks
  # PRs — each slice bases on the one below it — and a `branches: [main]`
  # filter here meant a stacked PR ran NO CI at all: it was reviewed, approved,
  # and merged on the strength of a bot comment, with the first real signal
  # arriving only once its parent merged and it retargeted. A base change fires
  # `edited`, which is not in the default event set, so even that retarget did
  # not reliably re-trigger anything.
  #
  # The path filters already scope the work per PR, so the added cost is the
  # jobs a stacked slice actually needs — which is the cost of knowing whether
  # it works.
  pull_request:

# Least privilege by default; no CI job needs write access to the repo.
# pull-requests: read is required by dorny/paths-filter in the `changes` job —
# it lists a PR's changed files via the pulls API, and an unspecified scope
# under an explicit permissions block is `none`, which would fail detection
# and silently skip every downstream job.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what actually changed so heavy Rust jobs don't run for a docs- or
  # dashboard-only PR. Each downstream job gates on these outputs. This job is
  # seconds; the jobs it can skip are tens of minutes.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dashboards: ${{ steps.filter.outputs.dashboards }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
      scripts: ${{ steps.filter.outputs.scripts }}
      shell: ${{ steps.filter.outputs.shell }}
      kafka: ${{ steps.filter.outputs.kafka }}
      postgres: ${{ steps.filter.outputs.postgres }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      chaos: ${{ steps.filter.outputs.chaos }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # Pinned to a full commit SHA (v3), not the mutable tag, so an upstream
      # tag move cannot change CI behaviour without a reviewed commit here.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'fuzz/**'
              - 'docker/**'
              - '.dockerignore'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            # Narrow filters for the jobs that spin up external services or a
            # nightly toolchain. Each lists the crates its command actually
            # compiles, taken from `cargo tree`, rather than all of `crates/**`.
            #
            # Listing crates explicitly is safe here BECAUSE a crate can only
            # gain a dependency by editing its own Cargo.toml — which is inside
            # its own path pattern. So a closure that grows re-triggers the job
            # that cares, and these lists cannot silently go stale. Verify one
            # with `cargo tree -p <crate> -e normal`.
            #
            # Each filter also carries `.cargo/**` and `rust-toolchain*`: those
            # change the flags, target, and linker every one of these commands
            # compiles with, so a job that ignored them could pass on a build
            # configuration it never used.

            # `cargo test -p vtop-cli --test integration_kafka_to_minio`,
            # plus the seeding step that runs `docker/seed-events.sh` — the
            # generator whose output the test then asserts is non-empty.
            #
            # vtop-cli depends on every workspace crate EXCEPT vtop-node, so
            # this is "everything but the cluster-node binary" — which is where
            # a lot of #215/#224 work lands. vtop-broker and vtop-protocol are
            # listed because PR #229 makes vtop-cli depend on them for
            # `vtopctl node status`; they are a superset until it lands.
            kafka:
              - 'crates/vtop-adapters/**'
              - 'crates/vtop-broker/**'
              - 'crates/vtop-cli/**'
              - 'crates/vtop-core/**'
              - 'crates/vtop-log/**'
              - 'crates/vtop-meta/**'
              - 'crates/vtop-observe/**'
              - 'crates/vtop-protocol/**'
              - 'crates/vtop-state/**'
              - 'crates/vtop-upload/**'
              - 'tests/**'
              # Executed by the job's seeding step, and its output is what the
              # test asserts on.
              - 'docker/seed-events.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            # `cargo test -p vtop-state --features postgres,test-support
            #  --test pg_battery`. Closure is vtop-state + vtop-core.
            postgres:
              - 'crates/vtop-state/**'
              - 'crates/vtop-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            # The fuzz targets (detect_batch, detect_record, manifest_parse)
            # exercise vtop-core only, and need a pinned nightly toolchain.
            fuzz:
              - 'fuzz/**'
              - 'crates/vtop-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            dashboards:
              - 'observability/**'
            benchmarks:
              - 'benchmarks/**'
            scripts:
              - 'scripts/**'
              - 'docker-compose*.yml'
              - 'docker/**'
              - '.dockerignore'
              - 'examples/**'
            # The chart is a released artifact with two contracts worth gating:
            # it must RENDER valid manifests, and it must REFUSE to render
            # without identities. The second is the security property — #81
            # exists because a lab compose shipped default credentials — and a
            # refusal that quietly stopped refusing would look exactly like
            # success.
            #
            # The workflow file rides along because the job's own steps are
            # part of the contract they enforce.
            helm:
              - 'helm/**'
              - '.github/workflows/ci.yml'
            shell:
              - 'docker/*.sh'
              - 'docker/tests/**'
              # The live-chaos harness is executable shell that gates every
              # distributed-systems claim this project makes, and it was
              # unlinted: a change to lib.sh — sourced by every scenario —
              # triggered nothing. That is how a scenario stayed red on main
              # without anyone noticing.
              - 'scripts/live-chaos/**'
              # The release-notes generator only ever runs during a tag build,
              # where a failure means a published release with a broken body and
              # no second chance to get it right before people see it. Lint it
              # on the pull request instead.
              - 'scripts/release-notes.sh'
              - '.github/workflows/**'

            # `scripts/live-chaos/run-all.sh`. The harness drives real
            # processes over real TLS: metadata Raft, replication, fencing,
            # and failover.
            #
            # `crates/**`, not a hand-listed subset. The two binaries this job
            # runs pull in every workspace crate — verified, not assumed:
            #
            #   cargo tree -p vtop-node --edges normal
            #     → broker, log, meta, observe, protocol
            #   cargo tree -p vtop-cli --no-default-features --edges normal
            #     → adapters, broker, core, log, meta, observe, protocol,
            #       state, upload
            #
            # An earlier version of this filter named four crates and claimed
            # nothing else could change a scenario's outcome. That was wrong in
            # both directions that matter: vtop-log owns the segment format the
            # durability and recovery scenarios assert on, and vtop-protocol
            # owns the produce/fetch wire these scenarios speak. Either could
            # have broken the suite with this job never running.
            #
            # This does mean the suite runs on most Rust changes. That is the
            # honest cost of it being the only thing that validates replication
            # and fencing against real processes; the alternative is a gate
            # with a hole in it, which is what the four-crate list was.
            chaos:
              - 'scripts/live-chaos/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
  build-and-test:
    name: fmt + clippy + test + build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # librdkafka (cmake-build feature) builds from source. It needs cmake + a
      # C toolchain, SSL + SASL, zlib, and libcurl (the SASL OAUTHBEARER/OIDC
      # path #includes <curl/curl.h> even when WITH_CURL=0).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        # --locked: a Cargo.lock that does not match Cargo.toml must FAIL
        # rather than be silently regenerated. Without it a dependency can be
        # added with no lockfile entry and builds then resolve versions that were
        # never tested - which had already happened before this guard existed.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --bin vtopctl --locked

  docker:
    name: docker image build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build engine image
        run: docker build -f docker/Dockerfile -t vtop-engine:ci .

      # The build succeeding says nothing about what is INSIDE. The image
      # shipped for two releases containing only vtopctl, so the Helm chart —
      # which runs `vtop-node node` — could not start a single pod against it,
      # and nothing noticed because no check ever looked.
      - name: The image contains the binaries a deployment needs
        run: |
          set -euo pipefail
          for binary in vtop-node vtopctl; do
            docker run --rm --entrypoint "$binary" vtop-engine:ci --version \
              || { echo "::error::$binary is missing from the image or will not run"; exit 1; }
          done

  audit:
    name: supply-chain (cargo audit)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Prebuilt cargo-audit binary (fast; no compile).
      - name: Install cargo-audit
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-audit
      # Reads .cargo/audit.toml: fails on any advisory NOT documented there,
      # so new/actionable vulnerabilities block the build while known
      # unfixable transitive ones (tracked in docs/SECURITY_MODEL.md) are
      # still printed in the log as "ignored".
      - name: Audit dependencies
        run: cargo audit

  # The lab shell scripts have already produced real defects (broken pick()
  # array indexing, a port off-by-one, and PARTITIONS=0 passing validation only
  # to fail Kafka topic creation silently), so they are linted and tested like
  # any other code.
  helm-deploy:
    name: helm (deploy to kind)
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.3

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: vtop-ci

      - name: Build the engine image
        run: docker build -f docker/Dockerfile -t vtop-engine:local .

      # Taken OUT of the image rather than compiled again. The image already
      # contains both binaries — that is the property #281 was about — so
      # extracting them proves the SHIPPED artifact is the one under test, and
      # skips a second full Rust build.
      - name: Take vtopctl and vtop-node out of the image under test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          container="$(docker create vtop-engine:local)"
          for binary in vtopctl vtop-node; do
            docker cp "$container:/usr/local/bin/$binary" "$RUNNER_TEMP/bin/$binary"
          done
          docker rm "$container" >/dev/null
          chmod +x "$RUNNER_TEMP/bin"/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Load the image into kind
        run: kind load docker-image vtop-engine:local --name vtop-ci

      # The half the static checks cannot reach: pods Ready, Raft bootstrapped,
      # records streamed and counted, and every record surviving a killed pod.
      - name: Deploy the chart and verify it works
        run: scripts/k8s-smoke.sh vtop-ci vtop

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n vtop-ci get pods -o wide || true
          kubectl -n vtop-ci describe pods || true
          kubectl -n vtop-ci logs -l app.kubernetes.io/instance=vtop --tail=60 --all-containers || true

  helm:
    name: helm (lint + render + refusals)
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint helm/vtop -f helm/vtop/ci/default-values.yaml

      - name: Render the documented happy path
        run: |
          set -euo pipefail
          helm template vtop helm/vtop -f helm/vtop/ci/default-values.yaml > /tmp/rendered.yaml
          # A chart that renders NOTHING also exits zero, so count the output
          # rather than trusting the status code.
          manifests=$(grep -c '^kind:' /tmp/rendered.yaml)
          echo "rendered $manifests manifests"
          test "$manifests" -ge 5

      # Stdlib only, deliberately. A YAML library would have to be installed,
      # and an install step that quietly fails leaves a check that no longer
      # checks anything while still reporting success. Helm's output is
      # predictable enough that scanning it is honest.
      - name: Every manifest carries a kind and an apiVersion
        run: |
          python3 - "/tmp/rendered.yaml" <<'PYEOF'
          import re, sys
          docs = [d for d in open(sys.argv[1]).read().split('\n---\n') if d.strip()]
          for doc in docs:
              kind = re.search(r'^kind: (\S+)', doc, re.M)
              api = re.search(r'^apiVersion: (\S+)', doc, re.M)
              assert kind, f'manifest without a kind:\n{doc[:200]}'
              assert api, f'{kind.group(1)} without an apiVersion'
          print(f'{len(docs)} manifests carry kind and apiVersion')
          PYEOF

      # THE SECURITY CONTRACT. The chart never defaults an identity or a
      # credential; #81 exists because a lab compose shipped defaults. A
      # refusal that stopped refusing would render a cluster whose nodes all
      # share whatever the chart invented, and it would look like success.
      - name: Identities are still never defaulted
        run: |
          set -euo pipefail
          refuses() {
            what="$1"; shift
            if helm template vtop helm/vtop "$@" >/dev/null 2>&1; then
              echo "::error::the chart rendered without $what; identities must never be defaulted"
              exit 1
            fi
            echo "refused without $what"
          }
          refuses "any identities"
          # Every other identity supplied, so rendering REACHES the TLS check
          # instead of aborting earlier. The first version of this step set only
          # cluster.id and stopped at the nodeUuids length check — helm exits
          # non-zero either way, so the step passed while never once exercising
          # the contract it names. A regression that silently stopped refusing
          # TLS would have sailed through it.
          refuses "TLS secret names" \
            --set cluster.id=11111111-2222-3333-4444-555555555555 \
            --set 'cluster.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2,aaaaaaaa-0000-0000-0000-0000000000a3}' \
            --set data.range.topic=telemetry \
            --set data.range.rangeId=aaaaaaaa-0000-0000-0000-0000000000c1 \
            --set data.segmentId=aaaaaaaa-0000-0000-0000-0000000000d1 \
            --set data.principalId=aaaaaaaa-0000-0000-0000-0000000000ce
          refuses "a matching nodeUuids count" -f helm/vtop/ci/default-values.yaml --set replicaCount=5
          refuses "distinct broker UUIDs" \
            -f helm/vtop/ci/default-values.yaml \
            --set 'cluster.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a3}'

      # Long names are where DNS limits and collisions appear, and both were
      # real: the headless Service used to truncate to the same string as the
      # client Service, so a long release name rendered two Services with one
      # name.
      - name: Names stay distinct and inside DNS limits
        run: |
          set -euo pipefail
          long=$(printf 'a%.0s' $(seq 1 53))
          helm template "$long" helm/vtop -f helm/vtop/ci/default-values.yaml > /tmp/long.yaml
          python3 - "/tmp/long.yaml" <<'PYEOF'
          import re, sys
          docs = [d for d in open(sys.argv[1]).read().split('\n---\n') if d.strip()]
          services, checked = [], 0
          for doc in docs:
              kind = re.search(r'^kind: (\S+)', doc, re.M)
              name = re.search(r'^  name: (\S+)', doc, re.M)
              if not (kind and name):
                  continue
              kind, name = kind.group(1), name.group(1)
              checked += 1
              assert len(name) <= 63, f'{kind} name is {len(name)} chars: {name}'
              if kind == 'Service':
                  services.append(name)
              if kind == 'StatefulSet':
                  # Pods append "-<ordinal>", and the pod-name label is capped
                  # at 63 as well.
                  assert len(name) + 4 <= 63, f'pod names would exceed 63: {name}'
          assert checked, 'no named manifests found; the scan matched nothing'
          assert len(services) == len(set(services)), f'Service names collide: {services}'
          print(f'{checked} named manifests, {len(services)} Services, all distinct and in limits')
          PYEOF

      - name: helm package
        run: helm package helm/vtop --destination /tmp/chart

  shell:
    name: shellcheck + bats
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Pinned to reviewed versions rather than the mutable `stable`/`latest`
      # tags, so a tool update cannot change CI results without a commit.
      # Dependabot's docker ecosystem does not scan workflow `docker run` lines,
      # so these are bumped deliberately.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 docker/*.sh scripts/release-notes.sh

      # `-P scripts/live-chaos/scenarios` resolves the scenarios' dynamic
      # `source "$(dirname …)/../lib.sh"`. Without it every scenario reports
      # SC1091 plus spurious "may not be assigned" warnings for variables
      # lib.sh does define — noise that would train people to ignore this job.
      - name: shellcheck (live-chaos harness)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 -x -P scripts/live-chaos/scenarios \
            scripts/live-chaos/lib.sh \
            scripts/live-chaos/run-all.sh \
            scripts/live-chaos/gen-certs.sh \
            scripts/live-chaos/scenarios/*.sh

      - name: bats
        run: |
          docker run --rm -v "$PWD:/code" -w /code \
            bats/bats:1.13.0 docker/tests/

  # Kafka was entirely untested in CI, which is how a P0 shipped: every read
  # returned zero records (a subscribe() per read forced a rebalance that
  # reseeked to earliest and ate the poll window), so no batch ever sealed - and
  # CI stayed green because nothing here talked to a broker.
  #
  # The broker advertises localhost so the host-run test connects over the mapped
  # port without an /etc/hosts entry.
  kafka-integration:
    name: kafka integration (live broker)
    needs: changes
    if: needs.changes.outputs.kafka == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-kafka-it-${{ hashFiles('**/Cargo.lock') }}

      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      # Seed a topic with real records. The tests assert a NON-EMPTY read, so an
      # empty topic would make them fail rather than pass vacuously.
      - name: Seed the it_events topic
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "ancestor=apache/kafka:4.3.1" --format '{{.ID}}' | head -1)
          docker exec "$cid" /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic it_events --partitions 1 --replication-factor 1
          bash docker/seed-events.sh cef 40 \
            | docker exec -i "$cid" /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server localhost:9092 --topic it_events
          docker exec "$cid" /opt/kafka/bin/kafka-get-offsets.sh \
            --bootstrap-server localhost:9092 --topic it_events

          # Warm up the group coordinator before the tests run. The adapter
          # assigns Offset::Stored, which asks the broker for the consumer
          # group's committed offsets; that needs the group coordinator and the
          # __consumer_offsets topic, which a FRESH broker creates only lazily on
          # the first group operation. Until it exists, consumers get
          # "NotCoordinator" and every read fails. Consuming once under a
          # throwaway group forces it into existence.
          #
          # This is why the job failed on its first run but passed locally: a
          # long-lived local broker already had __consumer_offsets.
          docker exec "$cid" /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic it_events \
            --group ci-warmup --from-beginning --max-messages 1 --timeout-ms 30000
          docker exec "$cid" /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --list

      - name: Run live-broker integration tests
        env:
          VTOP_TEST_KAFKA: localhost:9092
        run: cargo test -p vtop-cli --test integration_kafka_to_minio -- --ignored
  # cargo-deny covers what cargo-audit does not: license compliance, dependency
  # bans, and source provenance. Advisory decisions are mirrored from
  # .cargo/audit.toml (the single source of truth) so the two cannot disagree.
  deny:
    name: supply-chain (cargo deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The live-chaos harness drives real processes over real TLS — metadata Raft,
  # replication, fencing, promotion, failover — and until now it ran only when
  # someone ran it by hand. That is how scenario 09 sat red on main since #236,
  # how scenario 10 sat red since #237, and how a data node spent three issues
  # presenting the wrong certificate to the admin endpoint: nothing looked.
  #
  # Scoped, not blanket. It runs only when the harness or one of the four
  # crates whose binaries it executes changes — a docs or workflow edit does
  # not pay for a cluster. Debug binaries, because these scenarios assert
  # correctness rather than throughput, and a release build costs more than the
  # runs it feeds.
  live-chaos:
    name: live chaos (real processes)
    needs: changes
    if: needs.changes.outputs.chaos == 'true'
    runs-on: ubuntu-latest
    # The suite is ~13 scenarios, several of which sit through election and
    # lease timeouts by design. Generous, but bounded: a hang must fail rather
    # than occupy a runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-chaos-${{ hashFiles('**/Cargo.lock') }}

      # Fault injection needs unprivileged user and mount namespaces (05, 05b,
      # 06). Ubuntu 24.04 — which `ubuntu-latest` now is — ships an AppArmor
      # restriction on unprivileged userns that blocks them by default, so the
      # runner needs it lifted. The sysctl is best-effort: if a future image
      # drops the knob, the probe below is what decides, not the setting.
      #
      # The probe does NOT skip on failure. These scenarios self-check and fail
      # with a remediation message, so a runner without namespaces turns this
      # job red honestly rather than reporting success for three scenarios that
      # never ran — which is precisely the kind of silent gap this job exists
      # to close.
      - name: Enable and verify unprivileged namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "note: sysctl unavailable on this image; relying on the probe"
          unshare -rm bash -c 'mount -t tmpfs -o size=1m tmpfs /mnt && echo "mount namespaces OK"'

      - name: Build harness binaries
        run: |
          cargo build -p vtop-node --bin vtop-node
          cargo build -p vtop-cli --no-default-features --bin vtopctl

      # CHAOS_WORKDIR is what makes the logs survive to be uploaded. Scenarios
      # delete workdirs they generated themselves, so an artifact pointed at
      # the default `/tmp/vtop-chaos.*` collects nothing and the upload passes
      # empty — a diagnostic that appears to exist and is absent exactly when
      # it is needed. Supplying the directory also sets WORKDIR_GENERATED=0,
      # which suppresses that cleanup, so the tree is still there afterwards.
      - name: Run the live chaos suite
        id: chaos
        run: CHAOS_PROFILE=debug CHAOS_WORKDIR="$RUNNER_TEMP/chaos" scripts/live-chaos/run-all.sh

      # A failing scenario names a log file; without this the reason dies with
      # the runner. `error` on empty, not `ignore`: an empty artifact means the
      # wiring above broke, and that must be visible rather than silent.
      #
      # Gated on THIS step's outcome, not the job's. `failure()` is also true
      # when the namespace probe or the build failed — cases where the suite
      # never reached a scenario, so no logs exist and `error` would stack a
      # spurious "no files found" on top of the real cause. The empty-artifact
      # signal only means something once the run itself has been attempted.
      - name: Upload scenario logs
        if: steps.chaos.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-chaos-logs
          path: ${{ runner.temp }}/chaos/**/logs/
          if-no-files-found: error
          retention-days: 7

  # The MSRV is a tested promise, not a number in a file: this builds on exactly
  # the declared toolchain. The floor is set by sqlx 0.9 (rust-version 1.94.0),
  # which raised the aws-sdk crates' previous 1.91.1 floor; lowering it means
  # pinning sqlx back to 0.8.
  msrv:
    name: msrv (build on declared rust-version)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      - run: cargo check --workspace --all-targets

  # Coverage is reported, NOT gated: a threshold invites tests written to move a
  # number. The summary makes gaps visible on each PR so they can be judged.
  coverage:
    name: coverage (report only)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      # Run the instrumented suite ONCE and reuse its output. Calling
      # cargo llvm-cov again just to format the summary would recompile and
      # re-run every workspace test for no new information.
      - name: Collect coverage
        run: |
          cargo llvm-cov --workspace --summary-only \
            --ignore-filename-regex '(tests?/|benchmarks/)' | tee /tmp/coverage.txt
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            tail -25 /tmp/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # The benchmark harness had zero tests while accumulating real defects
  # (double-counted input bytes, silently dropped child runs, unescaped Markdown
  # tables, a write-after-close race, a large-binary OOM, swallowed YAML errors).
  # Only manual review was protecting it.
  benchmarks:
    name: benchmarks (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: pip install --disable-pip-version-check pytest pyyaml ruff

      - name: ruff
        run: ruff check .

      - name: pytest
        run: python -m pytest

      # The harness must keep working where PyYAML is absent - that fallback is
      # the whole reason load_scenario() has two code paths - so prove the suite
      # passes without it too, rather than assuming. The PyYAML-specific tests
      # live in their own module and skip themselves; everything else must still
      # run and pass.
      - name: pytest without PyYAML (fallback parser path)
        run: |
          pip uninstall -y pyyaml
          python -m pytest

  # The whole stack, assembled and asserted end to end. Unit and integration
  # tests never run the real compose lab, which is exactly how the Kafka
  # ingestion P0 shipped with CI fully green. Verified this job catches it:
  # re-introducing that bug fails "no committed batch for source type: kafka"
  # while file/syslog still pass - the precise signature of the original defect.
  e2e-smoke:
    name: e2e smoke (full compose lab)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Build the engine image once, up front: the script's `compose up` would
      # otherwise build it inside the timed wait loop and could time out on a
      # cold cache rather than on a real failure.
      - name: Build the engine image
        run: docker compose build vtop-engine

      - name: Run the end-to-end smoke test
        env:
          TIMEOUT: "300"
        run: bash scripts/e2e-smoke.sh

      # The script itself dumps engine logs on failure BEFORE its exit trap tears
      # the stack down, so the real diagnostics are already in the job output
      # above. This is a best-effort fallback; the container is usually gone by
      # now, which is expected.
      - name: Engine logs on failure (best effort)
        if: failure()
        run: docker compose logs --tail=100 vtop-engine 2>/dev/null || echo "stack already torn down; see the smoke output above"

  # Fuzzing (issue #25): detect.rs and manifest deserialization both parse
  # UNTRUSTED bytes, so they must never panic. This is a bounded SMOKE run - a
  # short campaign from the committed seed corpus that fails the build if any
  # target crashes. It is not a substitute for long out-of-band fuzzing, but it
  # catches regressions on every PR. cargo-fuzz needs nightly + libFuzzer.
  fuzz:
    name: fuzz smoke (detect + manifest)
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # Pinned: the floating "nightly" channel broke on 2026-07-24 with an
          # ICE compiling tokio under ASAN (rustc 89c61a754). Pin the last
          # known-good nightly; bump deliberately when a newer one is verified.
          toolchain: nightly-2026-07-22
          # ASAN (which libFuzzer builds with) is incompatible with a statically
          # linked libc, so the fuzz build must target the GNU (dynamic-libc)
          # triple explicitly - otherwise a musl default fails with
          # "sanitizer is incompatible with statically linked libc".
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
      - name: Smoke-fuzz each target (fails on any crash)
        run: |
          for t in detect_record detect_batch manifest_parse; do
            echo "::group::fuzz $t"
            cargo +nightly-2026-07-22 fuzz run "$t" --target x86_64-unknown-linux-gnu -- \
              -max_total_time=60 -print_final_stats=1
            echo "::endgroup::"
          done

  # Mutation testing (issue #25): measure whether the suite actually catches
  # injected faults. REPORT ONLY - never gates the build (continue-on-error) -
  # and scoped to the highest-value modules so a run finishes in CI time.
  mutants:
    name: mutation testing (report only)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-mutants
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      - name: Run cargo-mutants on the core logic
        run: |
          cargo mutants --package vtop-core \
            --file 'crates/vtop-core/src/detect.rs' \
            --file 'crates/vtop-core/src/state_machine.rs' \
            --file 'crates/vtop-core/src/batch.rs' \
            --timeout 120 --no-shuffle | tee /tmp/mutants.txt || true
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Mutation testing (report only)'
            echo '```'
            tail -40 /tmp/mutants.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The fast path for observability changes: dashboards are generated Python +
  # JSON, not engine code, so they don't need the Rust workspace, Docker, Kafka,
  # or the e2e lab. This job lints the generators, re-runs them and fails if the
  # committed JSON is stale (the exact drift that shipped once), and checks the
  # JSON parses. Seconds, not tens of minutes.
  dashboards:
    name: dashboards (generators + no drift)
    needs: changes
    if: needs.changes.outputs.dashboards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Syntax-check the dashboard generators
        run: python -m compileall -q observability/*.py
      # Catches the class of bug drift detection structurally cannot: a panel
      # that matches its generator exactly and still renders blank (stat panel
      # missing pluginVersion, duplicate/missing panel id, no targets).
      - name: Validate dashboard structure
        run: python3 observability/validate-dashboards.py
      - name: Regenerate dashboards and fail on drift
        run: |
          python3 observability/build-dashboards.py
          # --porcelain reports MODIFIED and UNTRACKED files, so a newly added
          # dashboard whose JSON was never committed also fails - `git diff`
          # alone would ignore the untracked output and pass.
          drift="$(git status --porcelain -- observability/grafana/dashboards/)"
          if [ -n "$drift" ]; then
            echo "::error::Committed dashboard JSON is out of date or missing. Run 'python3 observability/build-dashboards.py' and commit the result."
            echo "$drift"
            exit 1
          fi
      - name: Validate every dashboard JSON parses
        run: |
          set -e
          for f in observability/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          echo "all dashboard JSON valid"

  # The Postgres backend (Phase 3) must pass the SAME behavioural battery as
  # SQLite, and its DB-level invariant trigger must reject a bypass. Runs against
  # a real Postgres service. Gated on rust changes like the other Rust jobs.
  postgres:
    name: postgres backend (battery)
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vtop
          POSTGRES_PASSWORD: vtop
          POSTGRES_DB: vtop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pg-${{ hashFiles('**/Cargo.lock') }}
      # vtop-state depends only on vtop-core (no librdkafka), so no system deps.
      - name: Run the Postgres StateStore battery
        env:
          VTOP_TEST_POSTGRES: postgres://vtop:vtop@localhost:5432/vtop
          VTOP_TEST_POSTGRES_RUNTIME: postgres://vtop_runtime_test:vtop-runtime-test@localhost:5432/vtop
        run: cargo test -p vtop-state --features postgres,test-support --test pg_battery
