name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting `main`. This project stacks
  # PRs — each slice bases on the one below it — and a `branches: [main]`
  # filter here meant a stacked PR ran NO CI at all: it was reviewed, approved,
  # and merged on the strength of a bot comment, with the first real signal
  # arriving only once its parent merged and it retargeted. A base change fires
  # `edited`, which is not in the default event set, so even that retarget did
  # not reliably re-trigger anything.
  #
  # The path filters already scope the work per PR, so the added cost is the
  # jobs a stacked slice actually needs — which is the cost of knowing whether
  # it works.
  pull_request:

# Least privilege by default; no CI job needs write access to the repo.
# pull-requests: read is required by dorny/paths-filter in the `changes` job —
# it lists a PR's changed files via the pulls API, and an unspecified scope
# under an explicit permissions block is `none`, which would fail detection
# and silently skip every downstream job.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # promtool for the alert rules (#720), used by the prometheus-rules and helm
  # jobs. Pinned by digest, resolved with `docker manifest inspect
  # prom/prometheus:v3.15.1` (the multi-arch index; quay.io/prometheus/
  # prometheus:v3.15.1 serves the same digest), not by the mutable tag. The
  # tag is in the trailing comment and PROMETHEUS_VERSION; the prometheus-rules
  # job fails when the comment, the variable and what the image reports
  # disagree, so a retag or a half-done bump is caught. Bump all three.
  PROMETHEUS_IMAGE: prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 # v3.15.1
  PROMETHEUS_VERSION: "3.15.1"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what actually changed so heavy Rust jobs don't run for a docs- or
  # dashboard-only PR. Each downstream job gates on these outputs. This job is
  # seconds; the jobs it can skip are tens of minutes.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dashboards: ${{ steps.filter.outputs.dashboards }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
      benchmark_charts: ${{ steps.filter.outputs.benchmark_charts }}
      scripts: ${{ steps.filter.outputs.scripts }}
      shell: ${{ steps.filter.outputs.shell }}
      kafka: ${{ steps.filter.outputs.kafka }}
      minio: ${{ steps.filter.outputs.minio }}
      postgres: ${{ steps.filter.outputs.postgres }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      mutants_gate: ${{ steps.filter.outputs.mutants_gate }}
      chaos: ${{ steps.filter.outputs.chaos }}
      upgrade: ${{ steps.filter.outputs.upgrade }}
      restore_drill: ${{ steps.filter.outputs.restore_drill }}
      helm: ${{ steps.filter.outputs.helm }}
      file_source: ${{ steps.filter.outputs.file_source }}
      prometheus_rules: ${{ steps.filter.outputs.prometheus_rules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned to a full commit SHA (v3), not the mutable tag, so an upstream
      # tag move cannot change CI behaviour without a reviewed commit here.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              # Read by the surface snapshot tests (#719).
              - 'docs/surface/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'fuzz/**'
              - 'docker/**'
              - '.dockerignore'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            # Narrow filters for the jobs that spin up external services or a
            # nightly toolchain. Each lists the crates its command actually
            # compiles, taken from `cargo tree`, rather than all of `crates/**`.
            #
            # Listing crates explicitly is safe here BECAUSE a crate can only
            # gain a dependency by editing its own Cargo.toml — which is inside
            # its own path pattern. So a closure that grows re-triggers the job
            # that cares, and these lists cannot silently go stale. Verify one
            # with `cargo tree -p <crate> -e normal`.
            #
            # Each filter also carries `.cargo/**` and `rust-toolchain*`: those
            # change the flags, target, and linker every one of these commands
            # compiles with, so a job that ignored them could pass on a build
            # configuration it never used.

            # `cargo test -p vtop-cli --test integration_kafka_to_minio`,
            # plus the seeding step that runs `docker/seed-events.sh` — the
            # generator whose output the test then asserts is non-empty.
            #
            # vtop-cli depends on every workspace crate EXCEPT vtop-node, so
            # this is "everything but the cluster-node binary" — which is where
            # a lot of #215/#224 work lands. vtop-broker and vtop-protocol are
            # listed because PR #229 makes vtop-cli depend on them for
            # `vtopctl node status`; they are a superset until it lands.
            kafka:
              - 'crates/vtop-adapters/**'
              - 'crates/vtop-broker/**'
              - 'crates/vtop-cli/**'
              - 'crates/vtop-core/**'
              - 'crates/vtop-log/**'
              - 'crates/vtop-meta/**'
              - 'crates/vtop-observe/**'
              - 'crates/vtop-protocol/**'
              - 'crates/vtop-state/**'
              - 'crates/vtop-surface/**'
              - 'crates/vtop-upload/**'
              # A dev-dependency of vtop-cli's tests (#722).
              - 'crates/vtop-s3-testkit/**'
              - 'tests/**'
              # Executed by the job's seeding step, and its output is what the
              # test asserts on.
              - 'docker/seed-events.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            # `cargo test -p vtop-upload --test live_s3_*` and
            # `--test transport_conformance` against the lab's MinIO, and
            # `cargo test -p vtop-cli --test live_s3_object_lock_engine` (#684),
            # the engine end to end. vtop-cli depends on every workspace crate
            # except vtop-node (as the kafka filter says), plus the MinIO build
            # (docker/minio/**) and the compose file that runs it and creates
            # the buckets.
            minio:
              - 'crates/vtop-adapters/**'
              - 'crates/vtop-broker/**'
              - 'crates/vtop-cli/**'
              - 'crates/vtop-core/**'
              - 'crates/vtop-log/**'
              - 'crates/vtop-meta/**'
              - 'crates/vtop-observe/**'
              - 'crates/vtop-protocol/**'
              - 'crates/vtop-state/**'
              - 'crates/vtop-surface/**'
              - 'crates/vtop-upload/**'
              - 'crates/vtop-s3-testkit/**'
              - 'tests/s3-compat/**'
              - 'docker/minio/**'
              - 'docker-compose.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            # The PostgreSQL legs (postgres-matrix.yml, #723): the battery
            # (vtop-state + vtop-core), `vtopctl migrate` (implemented in
            # vtop-state; vtop-cli only calls it), a restore and the engine's
            # recovery on PostgreSQL. vtop-cli has no code behind its
            # `postgres` feature (it only turns on vtop-state's), so its
            # Cargo.toml and the two test files are what it adds here. Not
            # vtop-cli's whole closure: that put the legs, each building
            # vtopctl, on nearly every Rust PR. A change elsewhere in the
            # closure is tested on every major by the nightly run of
            # postgres-matrix.yml. That file is not listed: a change to it
            # runs all five majors through its own pull_request trigger.
            postgres:
              - 'crates/vtop-state/**'
              - 'crates/vtop-core/**'
              - 'crates/vtop-surface/**'
              - 'crates/vtop-cli/Cargo.toml'
              - 'crates/vtop-cli/tests/postgres_migrate_restore.rs'
              - 'tests/integration_state_recovery.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            # The fuzz crate's closure (`cargo tree --manifest-path
            # fuzz/Cargo.toml -e normal`): every decoder of untrusted bytes
            # it fuzzes (#729) lives in one of these, and vtop-cli (built
            # without its kafka feature) pulls in the rest. Only vtop-node is
            # outside it. It needs a pinned nightly toolchain.
            fuzz:
              - 'fuzz/**'
              - 'crates/vtop-adapters/**'
              - 'crates/vtop-broker/**'
              - 'crates/vtop-cli/**'
              - 'crates/vtop-core/**'
              - 'crates/vtop-kafka/**'
              - 'crates/vtop-log/**'
              - 'crates/vtop-meta/**'
              - 'crates/vtop-observe/**'
              - 'crates/vtop-protocol/**'
              - 'crates/vtop-state/**'
              - 'crates/vtop-surface/**'
              - 'crates/vtop-upload/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            # The gate script and its test: the gated mutation job runs the
            # test first, so a change to either must run it even when no
            # Rust changed.
            mutants_gate:
              - 'scripts/mutants-gate.py'
              - 'scripts/tests/test_mutants_gate.py'
              - '.github/workflows/ci.yml'

            dashboards:
              - 'observability/**'
            # The engine's alert rules (#720): the rules and their promtool
            # tests, the chart's copy (which must equal them), the runbook page
            # every runbook_url points into, and the checker with its tests.
            prometheus_rules:
              - 'observability/prometheus/**'
              - 'helm/vtop/files/**'
              - 'docs/operate/runbooks.md'
              - 'scripts/check-alert-runbooks.py'
              - 'scripts/tests/test_check_alert_runbooks.py'
              - 'scripts/tests/fixtures/alert-runbooks/**'
              - '.github/workflows/ci.yml'
            benchmarks:
              - 'benchmarks/**'
            # The Kafka-comparison charts and reports: their generators, the
            # committed runs they are drawn from, the pinned plotting stack,
            # and the output itself (a hand edit to a generated file is drift).
            benchmark_charts:
              - 'benchmarks/kafka_compare/**'
              # The cross-product comparisons (#744): shared code, every
              # <kind>_compare package and its committed runs, and their tests.
              - 'benchmarks/compare_common/**'
              - 'benchmarks/*_compare/**'
              - 'benchmarks/tests/test_compare_*.py'
              - 'benchmarks/tests/test_*_compare.py'
              - 'docs/benchmarks/**'
              # The README's evidence charts: their generator and test, the
              # measurements they are drawn from, the output, and the README
              # whose prose quotes the same figures.
              - 'benchmarks/readme_charts.py'
              # The tests this job runs: a change to a test alone must run
              # it (tests/test_benchmark_charts_job.py checks the list).
              - 'benchmarks/tests/test_readme_charts.py'
              - 'benchmarks/tests/test_kafka_compare_*.py'
              - 'benchmarks/tests/test_benchmark_charts_job.py'
              # The hand-written page that links the generated reports.
              - 'docs/COMPARISON.md'
              - 'benchmarks/measurements/483-tcp-baseline/**'
              - 'benchmarks/measurements/663-policed-uplink/**'
              - 'docs/assets/readme/**'
              - 'README.md'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'docker-compose*.yml'
              - 'docker/**'
              - '.dockerignore'
              - 'examples/**'
            # The chart is a released artifact with two contracts worth gating:
            # it must RENDER valid manifests, and it must REFUSE to render
            # without identities. The second is the security property — #81
            # exists because a lab compose shipped default credentials — and a
            # refusal that quietly stopped refusing would look exactly like
            # success.
            #
            # The workflow file rides along because the job's own steps are
            # part of the contract they enforce.
            helm:
              - 'helm/**'
              # The smoke script IS the kind job's test (#416): a change to it
              # that did not run it would be judged by shellcheck alone.
              - 'scripts/k8s-smoke.sh'
              # Its port-forward helpers, sourced by it (#786).
              - 'scripts/k8s-forward.sh'
              - '.github/workflows/ci.yml'
              # The chart's appVersion has to track the workspace version, and
              # the workspace version can only change HERE. Without this the
              # helm job is skipped by exactly the PR that bumps it — the one
              # case the check exists for.
              - 'Cargo.toml'
            shell:
              - 'docker/*.sh'
              - 'docker/tests/**'
              # Executable CI test code (#291), linted like the rest.
              - 'scripts/upgrade-compat.sh'
              - 'scripts/manifest-compat.sh'
              # The compatibility matrix's release fetcher and cell runner
              # (#743); scripts/tests/fetch-release.bats proves each check
              # can fail.
              - 'scripts/compat/*.sh'
              - 'scripts/compat/cells/*.sh'
              - 'scripts/ledger-compat.sh'
              - 'scripts/restore-drill.sh'
              # The disaster-recovery drills (#735): executable shell that
              # gates the runbooks' claims, and the Python their checks run.
              - 'scripts/dr-drill/**'
              # The live-chaos harness is executable shell that gates every
              # distributed-systems claim this project makes, and it was
              # unlinted: a change to lib.sh — sourced by every scenario —
              # triggered nothing. That is how a scenario stayed red on main
              # without anyone noticing.
              - 'scripts/live-chaos/**'
              # The two smoke scripts that gate the DEPLOYMENT paths. Listed
              # here as well as under `scripts` because the two filters drive
              # different jobs: `scripts` gates the e2e/compose work, `shell`
              # gates the lint. Adding them to the shellcheck step without
              # adding them here meant a PR touching only a smoke script skipped
              # the shellcheck job entirely — so the lint would never once run
              # against the files it was added for, which is the same
              # unlinted-shell hole the live-chaos entry below exists to close.
              - 'scripts/k8s-smoke.sh'
              - 'scripts/k8s-forward.sh'
              - 'scripts/e2e-smoke.sh'
              # The traffic collector, for the same reason and by the same
              # mistake: it was added to the shellcheck step without being
              # added here, so a PR touching only the collector would have
              # skipped the lint it was added for (review).
              - 'scripts/traffic-snapshot.sh'
              # The naming/substantiation checkers and their bats suite
              # (#490) — the third time this exact hole was found in review,
              # now with its own precedent paragraph above to point at: a
              # checker-only PR must run the lint and the tests that prove
              # the checker can fail. The term list rides along because the
              # bats suite reads it.
              - 'scripts/check-naming.sh'
              - 'scripts/check-egress-claims.sh'
              - 'scripts/naming-denylist.txt'
              # The check that no shipped build carries the failpoints
              # feature (#725), listed here and in the shellcheck step.
              - 'scripts/check-failpoints-absent.sh'
              - 'scripts/update-surface-snapshots.sh'
              - 'scripts/tests/**'
              # The test-progress runner: developer tooling, but shell that people
              # will paste and rely on, so it is linted like the rest — listed here
              # AND in the shellcheck step, for the reason the comment above gives.
              - 'scripts/test-progress.sh'
              # The Kafka broker helper the kafka matrix (#721) starts every
              # broker with. Its own workflow runs on a change to it; this
              # entry is the lint.
              - 'scripts/kafka-broker.sh'
              # The three-broker cluster helper (kafka-cluster.yml), the same.
              - 'scripts/kafka-cluster.sh'
              # The release-notes generator only ever runs during a tag build,
              # where a failure means a published release with a broken body and
              # no second chance to get it right before people see it. Lint it
              # on the pull request instead.
              - 'scripts/release-notes.sh'
              - '.github/workflows/**'

            # `scripts/live-chaos/run-all.sh`. The harness drives real
            # processes over real TLS: metadata Raft, replication, fencing,
            # and failover.
            #
            # `crates/**`, not a hand-listed subset. The two binaries this job
            # runs pull in every workspace crate — verified, not assumed:
            #
            #   cargo tree -p vtop-node --edges normal
            #     → broker, log, meta, observe, protocol
            #   cargo tree -p vtop-cli --no-default-features --edges normal
            #     → adapters, broker, core, log, meta, observe, protocol,
            #       state, upload
            #
            # An earlier version of this filter named four crates and claimed
            # nothing else could change a scenario's outcome. That was wrong in
            # both directions that matter: vtop-log owns the segment format the
            # durability and recovery scenarios assert on, and vtop-protocol
            # owns the produce/fetch wire these scenarios speak. Either could
            # have broken the suite with this job never running.
            #
            # This does mean the suite runs on most Rust changes. That is the
            # honest cost of it being the only thing that validates replication
            # and fencing against real processes; the alternative is a gate
            # with a hole in it, which is what the four-crate list was.
            chaos:
              - 'scripts/live-chaos/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            upgrade:
              # The on-disk format contract (#291): any crate change can move
              # the format, the toolchain/cargo config changes the HEAD binary
              # that opens the fixtures, and the script itself is executable
              # test code.
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'scripts/upgrade-compat.sh'
              - 'scripts/live-chaos/gen-certs.sh'
              # The metadata rolling upgrade (#554) runs the chaos harness.
              - 'scripts/live-chaos/lib.sh'
              - 'scripts/live-chaos/scenarios/22-meta-rolling-upgrade.sh'
              - '.github/workflows/ci.yml'
            # `cargo clippy -p vtop-adapters` and `cargo test -p vtop-adapters
            # --lib` on macOS (#619). The closure is vtop-adapters + vtop-core
            # with the default features (no `kafka`, so no librdkafka).
            file_source:
              - 'crates/vtop-adapters/**'
              - 'crates/vtop-core/**'
              - 'crates/vtop-surface/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            # The SQLite ledger's backup and restore drill (#734): an engine,
            # the ledger it writes, and the audit and scrub that read the
            # result. The crates are the ones that change what the drill
            # observes (the ledger, the state machine and recovery, the file
            # source, the CLI that runs them), not every crate.
            restore_drill:
              - 'crates/vtop-state/**'
              - 'crates/vtop-core/**'
              - 'crates/vtop-adapters/**'
              - 'crates/vtop-upload/**'
              - 'crates/vtop-cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'scripts/restore-drill.sh'
              - 'docs/operate/backup-and-recovery.md'
              - '.github/workflows/ci.yml'
  build-and-test:
    name: fmt + clippy + test + build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # librdkafka (cmake-build feature) builds from source. It needs cmake + a
      # C toolchain, SSL + SASL, zlib, and libcurl (the SASL OAUTHBEARER/OIDC
      # path #includes <curl/curl.h> even when WITH_CURL=0).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        # --locked: a Cargo.lock that does not match Cargo.toml must FAIL
        # rather than be silently regenerated. Without it a dependency can be
        # added with no lockfile entry and builds then resolve versions that were
        # never tested - which had already happened before this guard existed.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --bin vtopctl --locked

      # The engine crash sweep's failpoints (#725) kill the process on
      # request; a release build must not contain them. The sweep's own
      # build is the positive control (engine-crash-sweep.yml).
      - name: Release build carries no failpoint
        run: bash scripts/check-failpoints-absent.sh --binary target/release/vtopctl

  docker:
    name: docker image build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # THE ONLY JOB THAT WRITES THE CACHE. Three jobs build this image and they
      # run in parallel, so having each export would mean three concurrent
      # writers to one scope for identical layers. This one exports; the Helm
      # and compose jobs import. They therefore warm from the PREVIOUS run
      # rather than from this one, which is what makes the saving repeatable
      # instead of dependent on job ordering.
      - name: Build engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: vtop-engine:ci
          load: true
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

      # The build succeeding says nothing about what is INSIDE. The image
      # shipped for two releases containing only vtopctl, so the Helm chart —
      # which runs `vtop-node node` — could not start a single pod against it,
      # and nothing noticed because no check ever looked.
      - name: The image contains the binaries a deployment needs
        run: |
          set -euo pipefail
          for binary in vtop-node vtopctl; do
            docker run --rm --entrypoint "$binary" vtop-engine:ci --version \
              || { echo "::error::$binary is missing from the image or will not run"; exit 1; }
          done

      # The TOOLS, not only the binaries. `vtop-node` itself went missing from
      # this image and shipped in a release (#281) because nothing asserted its
      # presence; the troubleshooting tools are one Dockerfile edit away from
      # going the same way, and their absence is only discovered mid-incident.
      #
      # `curl` earns its place because /metrics, /healthz and /readyz are plain
      # HTTP and nothing else in the image can read them — `vtopctl` speaks VTPM
      # and the replica plane over mTLS. `getent` is the DNS check (same
      # nsswitch path the engine resolves peers through) and comes from libc.
      - name: The image contains the tools an operator needs to debug it
        run: |
          set -euo pipefail
          for tool in curl nc getent openssl; do
            docker run --rm --entrypoint sh vtop-engine:ci -c "command -v $tool >/dev/null" \
              || { echo "::error::$tool is missing from the image; an operator cannot diagnose a node without it (see #295)"; exit 1; }
          done
          # Present is not the same as working: a curl that cannot execute is
          # exactly as useful as no curl, and only running it proves the
          # difference.
          docker run --rm --entrypoint curl vtop-engine:ci --version \
            || { echo "::error::curl is present but will not run"; exit 1; }
          echo "image carries curl, nc, getent and openssl"

  audit:
    name: supply-chain (cargo audit)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Prebuilt cargo-audit binary (fast; no compile).
      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit
      # Reads .cargo/audit.toml: fails on any advisory NOT documented there,
      # so new/actionable vulnerabilities block the build while known
      # unfixable transitive ones (tracked in docs/SECURITY_MODEL.md) are
      # still printed in the log as "ignored".
      - name: Audit dependencies
        run: cargo audit

  # The lab shell scripts have already produced real defects (broken pick()
  # array indexing, a port off-by-one, and PARTITIONS=0 passing validation only
  # to fail Kafka topic creation silently), so they are linted and tested like
  # any other code.
  helm-deploy:
    name: helm (deploy to kind)
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.3

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: vtop-ci

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Imports only — see the note on the image job. `load: true` is required
      # because the next step pulls the binaries back OUT of this image and
      # `kind load` needs it in the daemon, neither of which can read a build
      # that only exists in the buildx cache.
      - name: Build the engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: vtop-engine:local
          load: true
          cache-from: type=gha,scope=ci-image

      # Taken OUT of the image rather than compiled again. The image already
      # contains both binaries — that is the property #281 was about — so
      # extracting them proves the SHIPPED artifact is the one under test, and
      # skips a second full Rust build.
      - name: Take vtopctl and vtop-node out of the image under test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          container="$(docker create vtop-engine:local)"
          for binary in vtopctl vtop-node; do
            docker cp "$container:/usr/local/bin/$binary" "$RUNNER_TEMP/bin/$binary"
          done
          docker rm "$container" >/dev/null
          chmod +x "$RUNNER_TEMP/bin"/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Load the image into kind
        run: kind load docker-image vtop-engine:local --name vtop-ci

      # The half the static checks cannot reach: pods Ready, Raft bootstrapped,
      # records streamed and counted, and every record surviving a killed pod.
      - name: Deploy the chart and verify it works
        run: scripts/k8s-smoke.sh vtop-ci vtop

      # EVERY namespace the smoke test uses, and the node itself.
      #
      # This dumped only `vtop-ci` while the test had grown two more namespaces,
      # so a failure in the replicated shape captured the state of a namespace
      # that was fine. Node capacity is here because the failure it hid was a
      # Pending pod: the chart requests 500m CPU each and a two-vCPU runner
      # cannot host seven, which surfaces as a DNS error three layers away from
      # its cause.
      - name: Cluster state on failure
        if: failure()
        run: |
          echo "=== node capacity and allocation ==="
          kubectl describe node | sed -n '/Allocated resources/,/^Events/p' || true
          kubectl get pods -A -o wide || true
          for ns in vtop-ci vtop-ci-neighbour vtop-ci-replicated vtop-ci-separated; do
            echo "=== $ns ==="
            kubectl -n "$ns" get pods -o wide || true
            # Pending pods have no logs and no events of their own worth
            # printing; the scheduler's refusal is on the pod, so describe first.
            kubectl -n "$ns" describe pods || true
            kubectl -n "$ns" logs -l app.kubernetes.io/instance=vtop --tail=60 --all-containers || true
          done

  helm:
    name: helm (lint + render + refusals)
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.3

      # THE DEFAULT INSTALL PULLS `appVersion`. `statefulset.yaml` defaults the
      # image tag to `.Chart.AppVersion`, so a chart whose appVersion lags the
      # workspace ships users an older image than the release they downloaded —
      # and it drifted silently for two releases before anything noticed. The
      # failure is nasty because the chart installs cleanly and the pods run the
      # wrong binaries.
      - name: The chart's appVersion tracks the workspace version
        run: |
          set -euo pipefail
          workspace="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          chart="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' helm/vtop/Chart.yaml)"
          # BOTH must be found. If a reformat breaks either anchor, both go
          # empty and `"" != ""` is false — the check would pass by extracting
          # nothing, which is the failure mode it exists to prevent.
          if [ -z "$workspace" ] || [ -z "$chart" ]; then
            echo "::error::could not read the versions to compare (workspace='$workspace', chart='$chart'). One of the anchors in Cargo.toml or helm/vtop/Chart.yaml has moved; fix this check rather than removing it."
            exit 1
          fi
          if [ "$workspace" != "$chart" ]; then
            echo "::error::helm/vtop/Chart.yaml appVersion ($chart) != workspace version ($workspace). A default chart install resolves its image tag from appVersion, so it would deploy $chart while the release says $workspace."
            exit 1
          fi
          echo "appVersion $chart matches the workspace"

      - name: helm lint
        run: |
          helm lint helm/vtop -f helm/vtop/ci/default-values.yaml
          helm lint helm/vtop -f helm/vtop/ci/separated-values.yaml
          helm lint helm/vtop -f helm/vtop/ci/plaintext-values.yaml
          helm lint helm/vtop -f helm/vtop/ci/external-secret-values.yaml

      # The plaintext shape (#294): every plane without TLS renders WITHOUT a
      # Secret, as the node's spelled-out any-interface form, and never a tls
      # block — and only when acknowledged. Asserted on the rendered config,
      # not on the exit code: a chart that rendered the TLS shape under the
      # plaintext values would also exit zero.
      - name: Plaintext planes render as spelled out, and only when acknowledged
        run: |
          set -euo pipefail
          helm template vtop helm/vtop -f helm/vtop/ci/plaintext-values.yaml > /tmp/plaintext.yaml
          for knob in peer_transport admin_transport replica_transport native_transport; do
            grep -q "$knob: plaintext-on-any-interface" /tmp/plaintext.yaml \
              || { echo "::error::plaintext render lacks $knob: plaintext-on-any-interface"; exit 1; }
          done
          if grep -qE '^\s*(replica_tls|native_tls|tls):' /tmp/plaintext.yaml; then
            echo "::error::plaintext render still carries a tls block"; exit 1
          fi
          if grep -q 'tls-meta\|tls-data' /tmp/plaintext.yaml; then
            echo "::error::plaintext render still mounts a TLS Secret"; exit 1
          fi
          # The lease dials the admin plane, and the plaintext values enable
          # it: the dial must be plaintext too, or the data pod would try a
          # TLS handshake against a plaintext admin listener.
          # Anchored to the lease's own line: the listener knobs carry the same
          # substring, and matching them would be the no-op this replaces.
          grep -qE '^\s*transport: plaintext$' /tmp/plaintext.yaml \
            || { echo "::error::plaintext render does not dial the admin plane plaintext"; exit 1; }
          echo "plaintext shape renders as spelled out, with no Secret"
          # Observability TLS, on BOTH shapes: the Secret mounted and named,
          # every probe on HTTPS, the config carrying the paths, the
          # annotation saying https.
          observe_render() {
            local values="$1" probes="$2" out="$3"
            helm template vtop helm/vtop -f "$values" \
              --set observability.tls.secretName=vtop-observe-tls > "$out"
            test "$(grep -c 'scheme: HTTPS' "$out")" -ge "$probes" \
              || { echo "::error::$values: observability TLS did not switch every probe to HTTPS"; exit 1; }
            grep -q 'cert: /etc/vtop/tls/observe/cert.pem' "$out" \
              || { echo "::error::$values: observability TLS not in the rendered config"; exit 1; }
            grep -q 'mountPath: /etc/vtop/tls/observe' "$out" \
              || { echo "::error::$values: the observability Secret is not mounted"; exit 1; }
            grep -q 'secretName: "vtop-observe-tls"' "$out" \
              || { echo "::error::$values: the observability Secret is not referenced"; exit 1; }
            grep -q 'prometheus.io/scheme: https' "$out" \
              || { echo "::error::$values: observability TLS not in the scrape annotations"; exit 1; }
          }
          observe_render helm/vtop/ci/default-values.yaml 3 /tmp/observe.yaml
          observe_render helm/vtop/ci/separated-values.yaml 6 /tmp/observe-separated.yaml
          echo "observability TLS renders end to end on both shapes"

      - name: Render the documented happy path
        run: |
          set -euo pipefail
          helm template vtop helm/vtop -f helm/vtop/ci/default-values.yaml > /tmp/rendered.yaml
          # A chart that renders NOTHING also exits zero, so count the output
          # rather than trusting the status code.
          manifests=$(grep -c '^kind:' /tmp/rendered.yaml)
          echo "rendered $manifests manifests"
          test "$manifests" -ge 5

      # A secret file from an external manager (#733) goes in through
      # extraVolumes as a whole Secret volume at defaultMode 0400 (256), which
      # the kubelet makes 0440 under the chart's fsGroup: the form the archive
      # engine accepts. Asserted on the rendered pod, so the documented
      # example cannot drift from what the chart does with it.
      - name: An external secret renders as a whole volume at 0400
        run: |
          set -euo pipefail
          helm template vtop helm/vtop -f helm/vtop/ci/external-secret-values.yaml > /tmp/external.yaml
          # toYaml sorts the keys: defaultMode comes before secretName.
          grep -A3 'name: external-secret$' /tmp/external.yaml | grep -q 'secretName: vtop-external-secret'
          grep -B2 -A2 'secretName: vtop-external-secret' /tmp/external.yaml | grep -q 'defaultMode: 256'
          grep -B1 -A2 'mountPath: /etc/vtop/external' /tmp/external.yaml | grep -q 'readOnly: true'
          grep -q 'fsGroup: 10001' /tmp/external.yaml
          if grep -q 'subPath' /tmp/external.yaml; then
            echo "the external secret must be mounted whole, never with subPath" >&2
            exit 1
          fi
          echo "external secret mounted whole at 0400 with fsGroup 10001"

      # The engine's alert rules as a PrometheusRule (#720): off by default,
      # refused like the ServiceMonitor where the Operator's CRDs are absent,
      # and when on, its spec is helm/vtop/files/vtop-rules.yaml verbatim (the
      # prometheus-rules job proves that copy equals the rules file and that
      # every runbook link in it resolves), valid to promtool, with
      # runbookBaseUrl moving every runbook link and keeping its #section.
      - name: The PrometheusRule serves the shipped rules, and only when asked
        run: |
          set -euo pipefail
          values=helm/vtop/ci/default-values.yaml
          if helm template vtop helm/vtop -f "$values" | grep -q '^kind: PrometheusRule'; then
            echo "::error::a PrometheusRule rendered with metrics.prometheusRule.enabled unset; it must be opt-in"
            exit 1
          fi
          if output=$(helm template vtop helm/vtop -f "$values" --set metrics.prometheusRule.enabled=true 2>&1); then
            echo "::error::the PrometheusRule rendered without monitoring.coreos.com/v1; it must refuse as the ServiceMonitor does"
            exit 1
          fi
          printf '%s' "$output" | grep -qF 'does not expose monitoring.coreos.com/v1' \
            || { echo "::error::refused without the CRDs, but not with the CRD message"; printf '%s\n' "$output" | tail -5; exit 1; }
          helm template vtop helm/vtop -f "$values" --set metrics.prometheusRule.enabled=true \
            --api-versions monitoring.coreos.com/v1 > /tmp/prometheusrule.yaml
          python3 - /tmp/prometheusrule.yaml helm/vtop/files/vtop-rules.yaml /tmp/prometheusrule-groups.yaml <<'PYEOF'
          import sys
          docs = [d for d in open(sys.argv[1]).read().split('\n---\n') if d.strip()]
          rules = [d for d in docs if '\nkind: PrometheusRule\n' in '\n' + d + '\n']
          assert len(rules) == 1, f'expected one PrometheusRule, rendered {len(rules)}'
          body = rules[0].split('\nspec:\n', 1)[1].split('\n')
          assert all(not line.strip() or line.startswith('  ') for line in body), 'spec is not indented under spec:'
          spec = '\n'.join(line[2:] for line in body).strip('\n')
          shipped = open(sys.argv[2]).read().strip('\n')
          assert spec == shipped, 'the PrometheusRule spec is not helm/vtop/files/vtop-rules.yaml verbatim'
          open(sys.argv[3], 'w').write(spec + '\n')
          print(f'the PrometheusRule spec is the shipped rules file ({len(spec.splitlines())} lines)')
          PYEOF
          docker run --rm --network none -v /tmp/prometheusrule-groups.yaml:/rules/vtop-rules.yaml:ro \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check rules /rules/vtop-rules.yaml
          helm template vtop helm/vtop -f "$values" --set metrics.prometheusRule.enabled=true \
            --set metrics.prometheusRule.runbookBaseUrl=https://runbooks.example.internal/vtop/ \
            --api-versions monitoring.coreos.com/v1 > /tmp/prometheusrule-base.yaml
          shipped=$(grep -c 'runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#' helm/vtop/files/vtop-rules.yaml)
          moved=$(grep -c 'runbook_url: "https://runbooks.example.internal/vtop/#' /tmp/prometheusrule-base.yaml)
          if [ "$shipped" -eq 0 ] || [ "$moved" -ne "$shipped" ] \
            || grep -q 'allamiro.github.io/vtop-engine/operate/runbooks' /tmp/prometheusrule-base.yaml; then
            echo "::error::runbookBaseUrl moved $moved of $shipped runbook links (or left one on the default page)"
            exit 1
          fi
          echo "runbookBaseUrl moved all $moved runbook links, each keeping its section"

      # Stdlib only, deliberately. A YAML library would have to be installed,
      # and an install step that quietly fails leaves a check that no longer
      # checks anything while still reporting success. Helm's output is
      # predictable enough that scanning it is honest.
      - name: Every manifest carries a kind and an apiVersion
        run: |
          python3 - "/tmp/rendered.yaml" <<'PYEOF'
          import re, sys
          docs = [d for d in open(sys.argv[1]).read().split('\n---\n') if d.strip()]
          for doc in docs:
              kind = re.search(r'^kind: (\S+)', doc, re.M)
              api = re.search(r'^apiVersion: (\S+)', doc, re.M)
              assert kind, f'manifest without a kind:\n{doc[:200]}'
              assert api, f'{kind.group(1)} without an apiVersion'
          print(f'{len(docs)} manifests carry kind and apiVersion')
          PYEOF

      # THE SECURITY CONTRACT. The chart never defaults an identity or a
      # credential; #81 exists because a lab compose shipped defaults. A
      # refusal that stopped refusing would render a cluster whose nodes all
      # share whatever the chart invented, and it would look like success.
      - name: Identities are still never defaulted
        run: |
          set -euo pipefail
          refuses() {
            what="$1"; shift
            if helm template vtop helm/vtop "$@" >/dev/null 2>&1; then
              echo "::error::the chart rendered without $what; identities must never be defaulted"
              exit 1
            fi
            echo "refused without $what"
          }
          # Verbatim copy of the message-asserting helper from the
          # replicated-guards step below — run blocks share no shell state.
          refuses_because() {
            expected="$1"; shift
            if output=$(helm template vtop helm/vtop "$@" 2>&1); then
              echo "::error::rendered successfully; expected a refusal mentioning: $expected"
              exit 1
            fi
            if ! printf '%s' "$output" | grep -qF "$expected"; then
              echo "::error::refused, but not for the expected reason."
              echo "::error::wanted: $expected"
              printf '%s\n' "$output" | tail -5
              exit 1
            fi
            echo "refused because: $expected"
          }
          refuses "any identities"
          # Every other identity supplied, so rendering REACHES the TLS check
          # instead of aborting earlier. The first version of this step set only
          # cluster.id and stopped at the nodeUuids length check — helm exits
          # non-zero either way, so the step passed while never once exercising
          # the contract it names. A regression that silently stopped refusing
          # TLS would have sailed through it.
          refuses "TLS secret names" \
            --set cluster.id=11111111-2222-3333-4444-555555555555 \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2,aaaaaaaa-0000-0000-0000-0000000000a3}' \
            --set data.range.topic=telemetry \
            --set data.range.rangeId=aaaaaaaa-0000-0000-0000-0000000000c1 \
            --set data.segmentId=aaaaaaaa-0000-0000-0000-0000000000d1 \
            --set data.principalId=aaaaaaaa-0000-0000-0000-0000000000ce
          refuses "a matching nodeUuids count" -f helm/vtop/ci/default-values.yaml --set replicaCount=5
          refuses "distinct broker UUIDs" \
            -f helm/vtop/ci/default-values.yaml \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a3}'
          # The #287 slice-1 guards. Each refusal is a values file somebody
          # could plausibly write: the retired key with a real list in it, an
          # even voter count, and the mode that exists in the schema before
          # its rendering exists in the chart.
          refuses "the nodeUuids migration (cluster.nodeUuids is retired)" \
            -f helm/vtop/ci/default-values.yaml \
            --set 'cluster.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2,aaaaaaaa-0000-0000-0000-0000000000a3}'
          # A MATCHING four-UUID list, so the render reaches the voter-count
          # guard: with the file's three UUIDs and replicaCount=4 the length
          # check refuses on its own, and this case stayed green with the
          # even-voter guard deleted — the same blindness the TLS refusal
          # above once had.
          refuses_because "replicaCount 4 is even" \
            -f helm/vtop/ci/default-values.yaml \
            --set replicaCount=4 \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2,aaaaaaaa-0000-0000-0000-0000000000a3,aaaaaaaa-0000-0000-0000-0000000000a4}'
          # The #240 format knob: a value the binary would refuse must be
          # refused at render time, with the two it accepts named.
          refuses_because 'data.segmentFormat must be "v1" or "v2"' \
            -f helm/vtop/ci/default-values.yaml --set data.segmentFormat=v3
          # The #287 slice-2 guards on the SEPARATED shape: the tier sizes
          # are required, the voter count stays odd, the identity list is
          # indexed by data-tier ordinal, and an explicit admin endpoint
          # needs the name its certificate carries.
          # The #294 transport guards: a plaintext plane must be acknowledged,
          # a value outside tls|plaintext is refused by name, and an admin
          # plane that cannot enforce a policy refuses to carry one.
          refuses_because "transport.acknowledgePlaintext is false" \
            -f helm/vtop/ci/default-values.yaml --set transport.native=plaintext
          refuses_because 'transport.peer must be "tls" or "plaintext"' \
            -f helm/vtop/ci/default-values.yaml --set transport.peer=mtls
          refuses_because "transport.admin is plaintext but meta.adminAuthorization.enabled is true" \
            -f helm/vtop/ci/plaintext-values.yaml --set meta.adminAuthorization.enabled=true
          # A replicated range is candidates, and the node refuses a candidate
          # on a plaintext replica plane; the chart refuses first.
          refuses_because "transport.replica is plaintext but data.topology is replicated" \
            -f helm/vtop/ci/plaintext-values.yaml --set data.topology=replicated
          refuses_because "deployment.meta.replicaCount is unset" \
            -f helm/vtop/ci/separated-values.yaml --set deployment.meta.replicaCount=0
          refuses_because "deployment.data.replicaCount is unset" \
            -f helm/vtop/ci/separated-values.yaml --set deployment.data.replicaCount=0
          refuses_because "deployment.meta.replicaCount 4 is even" \
            -f helm/vtop/ci/separated-values.yaml --set deployment.meta.replicaCount=4
          refuses_because "data.nodeUuids has 3 entries but deployment.data.replicaCount is 2" \
            -f helm/vtop/ci/separated-values.yaml --set deployment.data.replicaCount=2
          # An even replicated data tier (#562). The UUID list is resized to
          # match, so each case reaches the guard instead of stopping at the
          # length check above (the blindness recorded earlier in this step).
          refuses_because 'deployment.data.replicaCount 2 is even under data.topology "replicated"' \
            -f helm/vtop/ci/separated-values.yaml --set deployment.data.replicaCount=2 \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2}'
          refuses_because "4 replicas need 3 acknowledgements and survive 1 failure(s)" \
            -f helm/vtop/ci/separated-values.yaml --set deployment.data.replicaCount=4 \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2,aaaaaaaa-0000-0000-0000-0000000000a3,aaaaaaaa-0000-0000-0000-0000000000a4}'
          # Standalone pods serve independent ranges and have no quorum, so an
          # even count is fine there: the rule must not over-reach.
          helm template vtop helm/vtop -f helm/vtop/ci/separated-values.yaml \
            --set data.topology=standalone --set data.lease.enabled=false \
            --set deployment.data.replicaCount=2 \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2}' >/dev/null
          echo "an even standalone data tier still renders"
          refuses_because "set data.lease.serverName" \
            -f helm/vtop/ci/separated-values.yaml --set data.lease.adminEndpoint=meta.example:9200
          # The transition MAC key reference must be whole (#240 item 5).
          refuses_because "meta.transitionMacKey.secretKey is empty" \
            -f helm/vtop/ci/default-values.yaml --set meta.transitionMacKey.secretName=vtop-transition-key --set meta.transitionMacKey.secretKey=""
          refuses_because "extraEnv sets VTOP_TRANSITION_MAC_KEY" \
            -f helm/vtop/ci/default-values.yaml --set meta.transitionMacKey.secretName=vtop-transition-key \
            --set 'extraEnv[0].name=VTOP_TRANSITION_MAC_KEY' --set 'extraEnv[0].value=deadbeef'

      # The SEPARATED shape (#287 slice 2): two tiers, each pod's config the
      # ROLE config its command deserializes, the data tier's lease pointed
      # at the metadata tier by its pods' own names. Parsed, not grepped, for
      # the reason the replicated check below records.
      - name: The separated deployment renders two tiers that can find each other
        run: |
          set -euo pipefail
          helm template vtop helm/vtop -f helm/vtop/ci/separated-values.yaml > /tmp/separated.yaml
          ruby -ryaml -e '
            docs = YAML.load_stream(File.read("/tmp/separated.yaml")).compact
            sets = docs.select { |d| d["kind"] == "StatefulSet" }.map { |d| d["metadata"]["name"] }.sort
            abort "expected two StatefulSets, got #{sets}" unless sets == %w[vtop-data vtop-meta]
            budgets = docs.select { |d| d["kind"] == "PodDisruptionBudget" }.map { |d| d["metadata"]["name"] }.sort
            abort "expected one budget per tier, got #{budgets}" unless budgets == %w[vtop-data vtop-meta]
            headless = docs.select { |d| d["kind"] == "Service" && d["spec"]["clusterIP"] == "None" }.map { |d| d["metadata"]["name"] }.sort
            abort "expected one headless Service per tier, got #{headless}" unless headless == %w[vtop-data-headless vtop-meta-headless]
            cm = docs.find { |d| d["kind"] == "ConfigMap" } or abort "no ConfigMap"
            files = cm["data"].keys.sort
            abort "expected meta-0..2 and data-0..2, got #{files}" \
              unless files == %w[data-0.yaml data-1.yaml data-2.yaml meta-0.yaml meta-1.yaml meta-2.yaml]
            metas = (0..2).map { |i| YAML.safe_load(cm["data"]["meta-#{i}.yaml"]) }
            datas = (0..2).map { |i| YAML.safe_load(cm["data"]["data-#{i}.yaml"]) }

            # Role configs, not the co-located wrapper: no meta:/data: nesting,
            # and each carries its own observability endpoint.
            metas.each_with_index do |m, i|
              abort "meta-#{i} is nested like a co-located config" if m.key?("meta") || m.key?("data")
              abort "meta-#{i} node_id is #{m["node_id"]}, want #{i + 1}" unless m["node_id"] == i + 1
              abort "meta-#{i} has no observability endpoint" unless m["observability"]
              peers = m.fetch("peers").map { |p| p.fetch("addr") }
              want = (0..2).map { |j| "vtop-meta-#{j}.vtop-meta-headless.default.svc.cluster.local:9100" }
              abort "meta-#{i} peers #{peers} are not the metadata tier #{want}" unless peers == want
            end
            uuids = %w[aaaaaaaa-0000-0000-0000-0000000000a1 aaaaaaaa-0000-0000-0000-0000000000a2 aaaaaaaa-0000-0000-0000-0000000000a3]
            datas.each_with_index do |d, i|
              abort "data-#{i} is nested like a co-located config" if d.key?("meta") || d.key?("data")
              abort "data-#{i} role is #{d["role"]}, want candidate" unless d["role"] == "candidate"
              abort "data-#{i} node_uuid is #{d["node_uuid"]}, want #{uuids[i]}" unless d["node_uuid"] == uuids[i]
              abort "data-#{i} has no observability endpoint" unless d["observability"]
              peers = d.fetch("peers").map { |p| p.fetch("addr") }
              want = (0..2).map { |j| "vtop-data-#{j}.vtop-data-headless.default.svc.cluster.local:9300" }
              abort "data-#{i} peers #{peers} are not the data tier #{want}" unless peers == want
              # Addresses are what the replica plane dials; identities are
              # what quorum arithmetic counts (review). The peer list must
              # carry every data identity exactly once.
              peer_ids = d.fetch("peers").map { |p| p.fetch("node_uuid") }
              abort "data-#{i} peer identities #{peer_ids} are not the data tier #{uuids}" unless peer_ids == uuids
              lease = d.fetch("lease")
              # The lease reaches the METADATA tier, at a pod name the
              # certificate can be verified against — never the co-located
              # loopback default and never a Service name.
              abort "data-#{i} lease endpoint #{lease["admin_endpoint"]} is not the metadata tier" \
                unless lease["admin_endpoint"] == "vtop-meta-0.vtop-meta-headless.default.svc.cluster.local:9200"
              abort "data-#{i} lease server_name does not match its endpoint" \
                unless lease["server_name"] == "vtop-meta-0.vtop-meta-headless.default.svc.cluster.local"
              admin = lease.fetch("admin_peers").map { |p| p.fetch("endpoint") }
              want_admin = (0..2).map { |j| "vtop-meta-#{j}.vtop-meta-headless.default.svc.cluster.local:9200" }
              abort "data-#{i} admin_peers #{admin} are not every metadata pod" unless admin == want_admin
            end
            puts "separated deployment parses: three voters, three leased candidates, each tier addressed by its own names"
          '

      # The REPLICATED shape, which until now nothing rendered at all — not
      # here, and not in the live smoke test either. It is the only topology
      # that exercises replication, fencing and promotion, so it was the one
      # shape that mattered most and was covered least.
      # The transition MAC key (#240 item 5) is a metadata-process secret:
      # named to every metadata config, injected into every metadata
      # container, and handed to no data process in either shape.
      - name: The transition MAC key reaches every metadata process and no data process
        run: |
          set -euo pipefail
          helm template vtop helm/vtop -f helm/vtop/ci/default-values.yaml \
            --set meta.transitionMacKey.secretName=vtop-transition-key > /tmp/keyed.yaml
          helm template vtop helm/vtop -f helm/vtop/ci/separated-values.yaml \
            --set meta.transitionMacKey.secretName=vtop-transition-key > /tmp/keyed-separated.yaml
          ruby -ryaml -e '
            def env_of(container)
              (container["env"] || []).map { |e| [e["name"], e.dig("valueFrom", "secretKeyRef")] }.to_h
            end
            want = { "name" => "vtop-transition-key", "key" => "key" }
            docs = YAML.load_stream(File.read("/tmp/keyed.yaml")).compact
            cm = docs.find { |d| d["kind"] == "ConfigMap" } or abort "no ConfigMap"
            (0..2).each do |i|
              node = YAML.safe_load(cm["data"]["node-#{i}.yaml"])
              abort "node-#{i} meta config does not name the key env" unless node["meta"]["transition_mac_key_env"] == "VTOP_TRANSITION_MAC_KEY"
            end
            sts = docs.find { |d| d["kind"] == "StatefulSet" } or abort "no StatefulSet"
            ref = env_of(sts["spec"]["template"]["spec"]["containers"][0])["VTOP_TRANSITION_MAC_KEY"]
            abort "co-located container lacks the secretKeyRef, got #{ref.inspect}" unless ref == want

            docs = YAML.load_stream(File.read("/tmp/keyed-separated.yaml")).compact
            cm = docs.find { |d| d["kind"] == "ConfigMap" } or abort "no ConfigMap"
            (0..2).each do |i|
              meta = YAML.safe_load(cm["data"]["meta-#{i}.yaml"])
              abort "meta-#{i} does not name the key env" unless meta["transition_mac_key_env"] == "VTOP_TRANSITION_MAC_KEY"
              data = YAML.safe_load(cm["data"]["data-#{i}.yaml"])
              abort "data-#{i} carries a metadata-only field" if data.key?("transition_mac_key_env")
            end
            sets = docs.select { |d| d["kind"] == "StatefulSet" }.map { |d| [d["metadata"]["name"], d] }.to_h
            meta_ref = env_of(sets.fetch("vtop-meta")["spec"]["template"]["spec"]["containers"][0])["VTOP_TRANSITION_MAC_KEY"]
            abort "meta tier lacks the secretKeyRef, got #{meta_ref.inspect}" unless meta_ref == want
            data_env = env_of(sets.fetch("vtop-data")["spec"]["template"]["spec"]["containers"][0])
            abort "data tier was handed the metadata key" if data_env.key?("VTOP_TRANSITION_MAC_KEY")
            puts "the transition MAC key reaches every metadata process and no data process"
          '
      - name: The replicated topology renders the shape it claims
        run: |
          set -euo pipefail
          helm template vtop helm/vtop -f helm/vtop/ci/replicated-values.yaml > /tmp/replicated.yaml
          # Ruby, not python3, for one reason: this must PARSE the config, and
          # python3's stdlib has no YAML. The first version of this check used
          # regexes, and it passed against a render whose followers list was
          # glued onto the previous line — `followers:- node_uuid: ...` — which
          # the binary refuses to parse and which put the leader into
          # CrashLoopBackOff. Every pattern-shaped assertion matched happily.
          # Only parsing catches that class, and ruby is preinstalled on the
          # runner, so this stays a stdlib-only check with no install step to
          # fail silently.
          ruby -ryaml -e '
            docs = YAML.load_stream(File.read("/tmp/replicated.yaml")).compact
            cm = docs.find { |d| d["kind"] == "ConfigMap" && d["data"]&.keys&.any? { |k| k.start_with?("node-") } }
            abort "no node ConfigMap in the render" unless cm

            configs = {}
            cm["data"].each do |name, body|
              # An explicit capture rather than ruby global match variables:
              # actionlint runs shellcheck over these blocks, and a dollar-digit
              # inside single quotes reads as a shell positional that will not
              # expand (SC2016). It is a ruby capture, but code that looks like a
              # shell bug in a shell-linted context is worth not writing — and
              # this comment cannot name the sigil either, for the same reason.
              matched = name.match(/\Anode-(\d)\.yaml\z/)
              next unless matched
              # THE ASSERTION THAT MATTERS. A config that does not parse is not
              # a config; everything below is only meaningful once this holds.
              begin
                configs[matched[1]] = YAML.safe_load(body)
              rescue => e
                abort "#{name} is not valid YAML, so the pod cannot start: #{e.message}"
              end
            end
            abort "expected three node configs, got #{configs.keys.sort}" unless configs.size == 3

            # SYMMETRIC by design (#284): every pod a candidate, no rendered
            # leader at all — the role follows the metadata lease at runtime,
            # which is the entire point of retiring leaderOrdinal.
            roles = configs.transform_values { |c| c.fetch("data").fetch("role") }
            abort "roles are #{roles}, expected candidate on every pod" \
              unless roles.values.uniq == ["candidate"]

            # Each candidate names the FULL peer set, self included; the
            # binary skips its own entry. The lists must be identical — a
            # divergent list is two nodes disagreeing about the replica set.
            peer_lists = configs.transform_values { |c| c.fetch("data").fetch("peers") }
            abort "peer lists differ between pods: #{peer_lists}" \
              unless peer_lists.values.uniq.size == 1
            peers = peer_lists["0"]
            abort "expected 3 peers (self included), got #{peers.inspect}" unless peers.size == 3

            # Each peer dialled at its OWN address. A shared SAN once
            # collapsed every follower to one name here, so the leader
            # replicated to the same pod twice and "quorum" meant one replica.
            addrs = peers.map { |f| f.fetch("addr") }
            abort "peers collapsed to shared addresses: #{addrs}" unless addrs.uniq.size == 3

            # And each peer carries its OWN identity, checked against the
            # configured set (review). Addresses are what the replica plane
            # DIALS; node UUIDs are what quorum arithmetic COUNTS. Three
            # distinct addresses under two distinct identities would render,
            # deploy, and then count a two-node quorum as three — the failure
            # the address check alone cannot see.
            uuids = peers.map { |f| f.fetch("node_uuid") }
            abort "peers carry duplicate identities: #{uuids}" unless uuids.uniq.size == 3
            want_uuids = %w[
              aaaaaaaa-0000-0000-0000-0000000000a1
              aaaaaaaa-0000-0000-0000-0000000000a2
              aaaaaaaa-0000-0000-0000-0000000000a3
            ]
            abort "peer identities #{uuids.sort} are not the configured data.nodeUuids #{want_uuids}" \
              unless uuids.sort == want_uuids

            # Every pod carries its OWN identity from that same set, and the
            # peer list is identical everywhere: together those say the three
            # pods are three members of ONE range, not overlapping claims.
            #
            # NO APOSTROPHES anywhere in this ruby block, for the same reason
            # the comment above cannot name a dollar-sigil: the whole program
            # is one single-quoted shell argument, so an apostrophe in a
            # COMMENT terminates the string and the step dies with a bash
            # syntax error pointing at ruby code that is perfectly valid.
            # Write "the pod own identity" shaped prose instead.
            own = configs.values.map { |c| c.fetch("data").fetch("node_uuid") }
            abort "pod identities #{own.sort} are not the configured set" unless own.sort == want_uuids
            %w[0 1 2].each_with_index do |ordinal, idx|
              want = "vtop-#{ordinal}.vtop-headless.default.svc.cluster.local:9300"
              abort "peer addr #{addrs.sort[idx]} != #{want}" unless addrs.sort[idx] == want
            end

            # Candidates acquire the range through the lease; a candidate
            # without one can never lead, and the render-time guard for that
            # is itself tested below — this asserts the happy path carries it.
            %w[0 1 2].each do |ordinal|
              abort "candidate #{ordinal} has no lease block" unless configs[ordinal]["data"]["lease"]
              epoch = configs[ordinal]["data"].fetch("fencing_epoch")
              abort "candidate #{ordinal} fencing_epoch is #{epoch}, must be 0" unless epoch == 0
              # The happy path of the format knob (#240): the replicated CI
              # values choose v2 so the failover in the smoke test publishes
              # through the marker, and a render that silently dropped the
              # key would revert the whole path to v1 while deploying
              # cleanly. (No apostrophes in this block; see above.)
              format = configs[ordinal]["data"].fetch("segment_format", nil)
              abort "candidate #{ordinal} segment_format is #{format.inspect}, must be v2" unless format == "v2"
            end

            # One range, not a mixture. A stray standalone pod would serve its
            # own log while the others replicate, and renders perfectly.
            abort "a replicated render must contain no standalone pod" if roles.values.include?("standalone")

            puts "replicated topology parses: three identical leased candidates"
          '

      # The guards on the replicated shape. Both were added with the topology
      # itself and NEITHER was tested: a guard that stops guarding renders a
      # cluster that cannot work and reports success, which is the same trap
      # the identity refusals above exist to avoid.
      - name: The replicated topology still refuses what cannot work
        run: |
          set -euo pipefail
          # Asserts the REASON, not just a non-zero exit. Helm exits non-zero
          # for any failure, so a check that only looks at the status can pass
          # while aborting somewhere else entirely — which is exactly how the
          # TLS refusal above once tested nothing. A verbatim copy lives in
          # the identities step above (run blocks share no shell state) —
          # keep the two in step.
          refuses_because() {
            expected="$1"; shift
            if output=$(helm template vtop helm/vtop "$@" 2>&1); then
              echo "::error::rendered successfully; expected a refusal mentioning: $expected"
              exit 1
            fi
            if ! printf '%s' "$output" | grep -qF "$expected"; then
              echo "::error::refused, but not for the expected reason."
              echo "::error::wanted: $expected"
              printf '%s\n' "$output" | tail -5
              exit 1
            fi
            echo "refused because: $expected"
          }

          # leaderOrdinal is retired (#284): the refusal must EXPLAIN the
          # migration, not silently ignore a value that used to steer roles.
          refuses_because "data.leaderOrdinal is retired" \
            -f helm/vtop/ci/replicated-values.yaml --set data.leaderOrdinal=0

          # Candidates acquire the range through the lease; without it no pod
          # would ever lead, and the render is a cluster that cannot work.
          refuses_because "requires data.lease.enabled" \
            -f helm/vtop/ci/replicated-values.yaml --set data.lease.enabled=false

          # Grants are minted from 1; a floor at or above the first grant
          # refuses the very grant that makes a candidate lead.
          refuses_because "must be 0 under" \
            -f helm/vtop/ci/replicated-values.yaml --set data.fencingEpoch=1

          # A single-replica replicated range is standalone wearing the wrong
          # name. nodeUuids is shortened to match, so this reaches the
          # topology check instead of stopping at the UUID-count check.
          refuses_because "a replicated range needs at least one follower" \
            -f helm/vtop/ci/replicated-values.yaml \
            --set replicaCount=1 \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1}'

      # Long names are where DNS limits and collisions appear, and both were
      # real: the headless Service used to truncate to the same string as the
      # client Service, so a long release name rendered two Services with one
      # name.
      - name: Names stay distinct and inside DNS limits
        run: |
          set -euo pipefail
          long=$(printf 'a%.0s' $(seq 1 53))
          helm template "$long" helm/vtop -f helm/vtop/ci/default-values.yaml > /tmp/long.yaml
          python3 - "/tmp/long.yaml" <<'PYEOF'
          import re, sys
          docs = [d for d in open(sys.argv[1]).read().split('\n---\n') if d.strip()]
          services, checked = [], 0
          for doc in docs:
              kind = re.search(r'^kind: (\S+)', doc, re.M)
              name = re.search(r'^  name: (\S+)', doc, re.M)
              if not (kind and name):
                  continue
              kind, name = kind.group(1), name.group(1)
              checked += 1
              assert len(name) <= 63, f'{kind} name is {len(name)} chars: {name}'
              if kind == 'Service':
                  services.append(name)
              if kind == 'StatefulSet':
                  # Pods append "-<ordinal>", and the pod-name label is capped
                  # at 63 as well.
                  assert len(name) + 4 <= 63, f'pod names would exceed 63: {name}'
          assert checked, 'no named manifests found; the scan matched nothing'
          assert len(services) == len(set(services)), f'Service names collide: {services}'
          print(f'{checked} named manifests, {len(services)} Services, all distinct and in limits')
          PYEOF

      - name: helm package
        run: helm package helm/vtop --destination /tmp/chart

  shell:
    name: shellcheck + bats
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to reviewed versions rather than the mutable `stable`/`latest`
      # tags, so a tool update cannot change CI results without a commit.
      # Dependabot's docker ecosystem does not scan workflow `docker run` lines,
      # so these are bumped deliberately.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 docker/*.sh scripts/release-notes.sh \
            scripts/k8s-smoke.sh scripts/k8s-forward.sh scripts/e2e-smoke.sh \
            scripts/upgrade-compat.sh \
            scripts/manifest-compat.sh scripts/ledger-compat.sh scripts/compat/*.sh scripts/compat/cells/*.sh \
            scripts/restore-drill.sh \
            scripts/traffic-snapshot.sh scripts/test-progress.sh \
            scripts/check-naming.sh scripts/check-egress-claims.sh \
            scripts/check-failpoints-absent.sh scripts/kafka-broker.sh \
            scripts/kafka-cluster.sh scripts/update-surface-snapshots.sh

      # `-P scripts/live-chaos/scenarios` resolves the scenarios' dynamic
      # `source "$(dirname …)/../lib.sh"`. Without it every scenario reports
      # SC1091 plus spurious "may not be assigned" warnings for variables
      # lib.sh does define — noise that would train people to ignore this job.
      - name: shellcheck (live-chaos harness)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 -x -P scripts/live-chaos/scenarios \
            scripts/live-chaos/lib.sh \
            scripts/live-chaos/run-all.sh \
            scripts/live-chaos/gen-certs.sh \
            scripts/live-chaos/scenarios/*.sh \
            scripts/live-chaos/engine/*.sh

      # The disaster-recovery drills (#735). `-P scripts/dr-drill` resolves
      # the drills' `source` of their shared library, for the reason the
      # live-chaos step above gives.
      - name: shellcheck (disaster-recovery drills)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 -x -P scripts/dr-drill \
            scripts/dr-drill/*.sh

      # The drills trust these checks to find a missing record, a duplicate and
      # an altered response; this proves they can.
      - name: disaster-recovery drill helpers (unit tests)
        run: python3 -m unittest discover -s scripts/dr-drill -p 'test_*.py' -v

      - name: bats
        run: |
          docker run --rm -v "$PWD:/code" -w /code \
            bats/bats:1.13.0 docker/tests/ scripts/tests/

  # The naming and substantiation rules (#490), enforced mechanically —
  # judgement does not survive a deadline. Deliberately unfiltered: the scan
  # takes a second, and a rule whose check can be skipped by a path filter
  # has a blind spot exactly where a rename lands. The checks are proven
  # capable of failing by scripts/tests/naming-and-claims.bats in the shell
  # job; this job is the enforcement itself.
  claims:
    name: naming + substantiation + format registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The parent too: the surface check below compares with HEAD^1,
          # which on a pull request is the base the merge commit was made on.
          fetch-depth: 2

      - name: naming check (no commercial mark outside the prior-art files)
        run: bash scripts/check-naming.sh

      - name: substantiation lint (every measurement row carries its conditions)
        run: bash scripts/check-egress-claims.sh

      # The format registry (#743): every magic and version constant in the
      # sources has an entry in scripts/compat/formats.yaml with the value
      # written there, and the inventory on docs/reference/compatibility.md
      # is what the registry generates. A version bump, a new magic, feature
      # level or command kind therefore always edits the reviewed registry.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the pinned PyYAML
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/compat/requirements.txt
      - name: the registry check can fail for each drift it exists to catch
        run: python -m unittest discover -s scripts/compat/tests -p 'test_format_registry.py' -v
      - name: format registry (every magic and version constant has an entry)
        run: python scripts/check-format-registry.py
      # The list of config keys an older engine silently ignores, which a
      # release's notes carry (#743). It reads the schema out of config.rs
      # and the reference page, so its tests run against fixture refs and
      # against this tree's config.rs: a change to either that the script no
      # longer understands fails here, not on release day.
      - name: the list of new config keys can fail (fixture refs and this tree's schema)
        run: python -m unittest discover -s scripts/tests -p 'test_config_keys_since.py' -v

      # The operator-facing surface (#719). `cargo test` already fails when
      # docs/surface/ drifts from the code; this asks every command, flag,
      # value, metric or label the change removes or renames for its row in
      # docs/deprecations.md. HEAD^1 is the base: on a pull request HEAD is
      # the merge commit, so lines main gained since the branch point are on
      # both sides and do not read as removals; on a push to main it is the
      # commit before.
      - name: the surface check can fail for each removal it exists to catch
        run: python -m unittest discover -s scripts/tests -p 'test_check_surface_deprecations.py' -v
      - name: surface removals carry a deprecation entry
        run: python scripts/check-surface-deprecations.py --base HEAD^1

      # The threat map (#732): every threat in docs/SECURITY_MODEL.md section 17
      # names a control and a test, and each must still exist. It lives in this
      # job, which runs on every pull request, and not in the docs workflow,
      # because a renamed test in a crate must fail here and a docs path filter
      # would never see it. Standard library only; it reads a few files.
      - name: the threat map's tests can fail for each rot they exist to catch
        run: python -m unittest discover -s scripts/tests -p 'test_check_threat_map.py' -v
      - name: threat map (every named control and test exists)
        run: python scripts/check-threat-map.py

  # Kafka was entirely untested in CI, which is how a P0 shipped: every read
  # returned zero records (a subscribe() per read forced a rebalance that
  # reseeked to earliest and ate the poll window), so no batch ever sealed - and
  # CI stayed green because nothing here talked to a broker.
  #
  # The broker advertises localhost so the host-run test connects over the mapped
  # port without an /etc/hosts entry.
  kafka-integration:
    name: kafka integration (live broker)
    needs: changes
    if: needs.changes.outputs.kafka == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-kafka-it-${{ hashFiles('**/Cargo.lock') }}

      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      # Seed a topic with real records. The tests assert a NON-EMPTY read, so an
      # empty topic would make them fail rather than pass vacuously.
      - name: Seed the it_events topic
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "ancestor=apache/kafka:4.3.1" --format '{{.ID}}' | head -1)
          docker exec "$cid" /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic it_events --partitions 1 --replication-factor 1
          bash docker/seed-events.sh cef 40 \
            | docker exec -i "$cid" /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server localhost:9092 --topic it_events
          docker exec "$cid" /opt/kafka/bin/kafka-get-offsets.sh \
            --bootstrap-server localhost:9092 --topic it_events

          # Warm up the group coordinator before the tests run. The adapter
          # assigns Offset::Stored, which asks the broker for the consumer
          # group's committed offsets; that needs the group coordinator and the
          # __consumer_offsets topic, which a FRESH broker creates only lazily on
          # the first group operation. Until it exists, consumers get
          # "NotCoordinator" and every read fails. Consuming once under a
          # throwaway group forces it into existence.
          #
          # This is why the job failed on its first run but passed locally: a
          # long-lived local broker already had __consumer_offsets.
          docker exec "$cid" /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic it_events \
            --group ci-warmup --from-beginning --max-messages 1 --timeout-ms 30000
          docker exec "$cid" /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --list

      - name: Run live-broker integration tests
        env:
          VTOP_TEST_KAFKA: localhost:9092
        run: cargo test -p vtop-cli --test integration_kafka_to_minio -- --ignored

  # The same live-broker tests on the oldest Kafka release the docs declare
  # supported (#721, docs/install/kafka.md). The job above stays the newest
  # line's check; kafka-matrix.yml runs every pinned release nightly. Its
  # check is named `kafka matrix / kafka integration (3.7.2)`.
  kafka-matrix:
    name: kafka matrix
    needs: changes
    if: needs.changes.outputs.kafka == 'true'
    uses: ./.github/workflows/kafka-matrix.yml
    with:
      brokers: '["3.7.2"]'

  # The live S3 tests against a real store (#668). They are `#[ignore]` and
  # need `VTOP_TEST_S3_ENDPOINT`, so until this job they ran only by hand:
  # the multipart resume test (#668) proved the store keeps the parts that
  # completed only on someone's laptop. They run here against the lab's
  # MinIO, the same release the compose lab and the e2e smoke use.
  #
  # MinIO is BUILT from source (docker/minio/Dockerfile), not pulled: no
  # registry serves its images any more (`docker manifest inspect` finds
  # neither the pinned release tag nor `latest` on Docker Hub or quay.io).
  # The Dockerfile pins the release by commit and its base images by digest.
  # Compose runs the server on 127.0.0.1:9000 and `minio-init` creates the
  # buckets the tests name, exactly as the lab does, including
  # `telemetry-locked`, created with Object Lock for the #684 tests.
  minio-integration:
    name: minio integration (live S3 tests)
    needs: changes
    if: needs.changes.outputs.minio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-minio-it-${{ hashFiles('**/Cargo.lock') }}

      # The engine test builds vtop-cli, which compiles librdkafka.
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      # Built before it is started, so a failed build reads as a build
      # failure rather than as a store that never became healthy.
      - name: Build the lab's MinIO image
        run: docker compose build minio

      - name: Start MinIO and create the lab buckets
        run: |
          set -euo pipefail
          docker compose up -d minio
          # `run` waits for minio's healthcheck (depends_on: service_healthy)
          # and exits non-zero if a bucket cannot be created.
          docker compose run --rm minio-init

      # One test thread: the tests share the store, and the multipart ones
      # count the requests a forwarder in front of it sees. The server and
      # what it is expected to do come from tests/s3-compat/servers/minio.yaml
      # (#722); every case appends a results line to VTOP_TEST_S3_RESULTS.
      # What each results line names: the MinIO release the lab builds, the
      # local image's id (it is built, not pulled, so it has no registry
      # digest), and the PR's head commit rather than the merge commit
      # GITHUB_SHA names on a pull request.
      - name: Label the S3 compatibility results
        run: |
          set -euo pipefail
          release=$(sed -n 's/^ARG MINIO_RELEASE=//p' docker/minio/Dockerfile)
          image=$(docker compose config --format json | jq -r '.services.minio.image')
          {
            echo "VTOP_TEST_S3_SERVER_VERSION=RELEASE.${release//:/-}"
            echo "VTOP_TEST_S3_IMAGE_DIGEST=$(docker image inspect --format '{{.Id}}' "$image")"
            echo "VTOP_TEST_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}"
          } >> "$GITHUB_ENV"

      - name: Run the live S3 tests
        env:
          VTOP_TEST_S3_SERVER: minio
          VTOP_TEST_S3_RESULTS: ${{ runner.temp }}/s3-compat/results-minio.jsonl
          VTOP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: |
          cargo test -p vtop-upload --locked \
            --test live_s3_verification \
            --test transport_conformance \
            --test live_s3_multipart_resume \
            --test live_s3_object_lock \
            --test live_s3_sse \
            -- --ignored --test-threads=1

      # The S3 Object Lock profile end to end (#684): the engine refuses a
      # bucket without Object Lock at startup, and archives a batch whose
      # object, manifest and verification receipt the store then reports
      # locked. And the verification receipt (#671): the method it names is
      # the one the real backend ran, store_checksum for a single PUT and
      # read_back for a multipart object. And the anti-tamper suite (docs/
      # reference/tamper-evidence.md): a bucket-write attacker against signed
      # manifests, Object Lock, versioning, receipts and the coverage audit.
      - name: Run the live engine tests
        env:
          VTOP_TEST_S3_SERVER: minio
          VTOP_TEST_S3_RESULTS: ${{ runner.temp }}/s3-compat/results-minio.jsonl
          VTOP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: |
          cargo test -p vtop-cli --locked --test live_s3_object_lock_engine \
            --test live_s3_verification_receipts \
            --test live_s3_tamper \
            -- --ignored --test-threads=1

      # Every case, and any whose outcome is not what minio.yaml says, in the
      # job summary; the lines themselves as an artifact (#722, D6).
      - name: Summarise the S3 compatibility results
        if: always()
        env:
          RESULTS: ${{ runner.temp }}/s3-compat/results-minio.jsonl
        run: |
          set -euo pipefail
          if [ ! -s "$RESULTS" ]; then
            echo "No results were written (the tests did not reach a case)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### S3 compatibility: minio"
            echo
            echo "| case | outcome | expectation | method |"
            echo "|---|---|---|---|"
            jq -r '"| \(.case) | \(.outcome) | \(.expectation) | \(.method // "-") |"' "$RESULTS"
            echo
            jq -r 'select(.expected == false)
              | "\(if .outcome == "unexpected_pass" then "UNEXPECTED PASS" else "UNEXPECTED FAIL" end) \(.case) (\(.deciding_capability // "every capability"), expected \(.expectation)): edit tests/s3-compat/servers/\(.server).yaml or fix the cause"' "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the S3 compatibility results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s3-compat-results-minio
          path: ${{ runner.temp }}/s3-compat/results-minio.jsonl
          if-no-files-found: ignore

      # minio-init ran as a one-off `compose run` container, removed when it
      # exited; its output is in the "Start MinIO" step above.
      - name: MinIO logs on failure
        if: failure()
        run: docker compose logs --tail=200 minio || true

  # cargo-deny covers what cargo-audit does not: license compliance, dependency
  # bans, and source provenance. Advisory decisions are mirrored from
  # .cargo/audit.toml (the single source of truth) so the two cannot disagree.
  deny:
    name: supply-chain (cargo deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The live-chaos harness drives real processes over real TLS — metadata Raft,
  # replication, fencing, promotion, failover — and until now it ran only when
  # someone ran it by hand. That is how scenario 09 sat red on main since #236,
  # how scenario 10 sat red since #237, and how a data node spent three issues
  # presenting the wrong certificate to the admin endpoint: nothing looked.
  #
  # Scoped, not blanket. It runs only when the harness or one of the four
  # crates whose binaries it executes changes — a docs or workflow edit does
  # not pay for a cluster. Debug binaries, because these scenarios assert
  # correctness rather than throughput, and a release build costs more than the
  # runs it feeds.
  live-chaos:
    name: live chaos (real processes)
    needs: changes
    if: needs.changes.outputs.chaos == 'true'
    runs-on: ubuntu-latest
    # The suite is ~13 scenarios, several of which sit through election and
    # lease timeouts by design. Generous, but bounded: a hang must fail rather
    # than occupy a runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-chaos-${{ hashFiles('**/Cargo.lock') }}

      # Fault injection needs unprivileged user and mount namespaces (05, 05b,
      # 06). Ubuntu 24.04 — which `ubuntu-latest` now is — ships an AppArmor
      # restriction on unprivileged userns that blocks them by default, so the
      # runner needs it lifted. The sysctl is best-effort: if a future image
      # drops the knob, the probe below is what decides, not the setting.
      #
      # The probe does NOT skip on failure. These scenarios self-check and fail
      # with a remediation message, so a runner without namespaces turns this
      # job red honestly rather than reporting success for three scenarios that
      # never ran — which is precisely the kind of silent gap this job exists
      # to close.
      - name: Enable and verify unprivileged namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "note: sysctl unavailable on this image; relying on the probe"
          unshare -rm bash -c 'mount -t tmpfs -o size=1m tmpfs /mnt && echo "mount namespaces OK"'

      # Scenario 17 drives the Kafka gateway with a stock client: kafkacat is
      # librdkafka, the library under every non-JVM Kafka client (#225).
      - name: Install a stock Kafka client for scenarios 17 to 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kafkacat

      - name: Build harness binaries
        run: |
          cargo build -p vtop-node --bin vtop-node
          cargo build -p vtop-cli --no-default-features --bin vtopctl

      # The history checker's own tests (#728): the scenarios trust its
      # verdict, so its rules are pinned against hand-built histories first,
      # including ones shaped like past bugs. Pure Python; seconds.
      - name: Test the history checker
        run: python3 -m unittest discover -s scripts/live-chaos/history -p 'test_*.py'

      # CHAOS_WORKDIR is what makes the logs survive to be uploaded. Scenarios
      # delete workdirs they generated themselves, so an artifact pointed at
      # the default `/tmp/vtop-chaos.*` collects nothing and the upload passes
      # empty — a diagnostic that appears to exist and is absent exactly when
      # it is needed. Supplying the directory also sets WORKDIR_GENERATED=0,
      # which suppresses that cleanup, so the tree is still there afterwards.
      - name: Run the live chaos suite
        id: chaos
        run: CHAOS_PROFILE=debug CHAOS_WORKDIR="$RUNNER_TEMP/chaos" scripts/live-chaos/run-all.sh

      # A failing scenario names a log file; without this the reason dies with
      # the runner. `error` on empty, not `ignore`: an empty artifact means the
      # wiring above broke, and that must be visible rather than silent.
      #
      # Gated on THIS step's outcome, not the job's. `failure()` is also true
      # when the namespace probe or the build failed — cases where the suite
      # never reached a scenario, so no logs exist and `error` would stack a
      # spurious "no files found" on top of the real cause. The empty-artifact
      # signal only means something once the run itself has been attempted.
      - name: Upload scenario logs
        if: steps.chaos.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-chaos-logs
          path: |
            ${{ runner.temp }}/chaos/**/logs/
            ${{ runner.temp }}/chaos/**/history/
          if-no-files-found: error
          retention-days: 7

  # A data directory written by an old release must open under the current
  # build (#291). Every other durability test writes its fixtures with the
  # code under test, so the on-disk format was only ever validated against
  # itself — the one bug class an operator meets mid-upgrade and cannot fix
  # forward. Two legs: v0.2.1 writes the single-`range.active` shape (the
  # exact compatibility claim `open_range` makes), v0.3.0 writes rolled
  # sealed segments. Downgrade is NOT tested and NOT supported — stated in
  # ROADMAP.md rather than left as an untested assumption.
  upgrade-compat:
    name: upgrade compat (old directories open under HEAD)
    needs: changes
    if: needs.changes.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole point is building OTHER releases: the worktrees below
          # check out release tags, which a shallow clone does not have.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-upgrade-${{ hashFiles('**/Cargo.lock') }}
      # The tag list is DERIVED, not hardcoded: the newest patch release of
      # every minor series since the native data plane shipped (v0.2+ — the
      # v0.1.x CLI predates the produce/verify surface this script drives).
      # A new release therefore joins the matrix the moment its tag exists,
      # so the immediately preceding release — the upgrade path most
      # operators actually take — cannot silently fall out of coverage.
      # FINALS ONLY, stated as a policy rather than a sort subtlety (#409):
      # a suffixed tag (v0.5.0-rc1) must never beat its final in last-wins,
      # and the glob admits every major so v1.0.0 joins the day it exists.
      # The finals pattern guards inside awk, not as a grep stage (review):
      # under pipefail a matchless grep would kill the assignment before the
      # friendly no-tags guard below could speak; awk exits clean on none.
      - name: Select the released tags to replay
        id: tags
        run: |
          set -euo pipefail
          tags="$(git tag --list 'v[0-9]*' --sort=version:refname \
            | awk -F. '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && ($1 "." $2) != "v0.1" { latest[$1 "." $2] = $0 } END { for (m in latest) print latest[m] }' \
            | sort -V | tr '\n' ' ')"
          [[ -n "${tags// /}" ]] || { echo "no release tags found"; exit 1; }
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "replaying: $tags"
      # Release tags are immutable, so their builds are cached essentially
      # forever: after the first run this job pays only the HEAD build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target-old
          key: ${{ runner.os }}-upgrade-old-tags-${{ steps.tags.outputs.list }}

      - name: Build HEAD vtop-node
        run: cargo build -p vtop-node --bin vtop-node

      # vtopctl drives the metadata-tier rolling upgrade below (#554).
      - name: Build HEAD vtopctl
        run: cargo build -p vtop-cli --no-default-features --bin vtopctl

      - name: Build the released tags
        run: |
          set -euo pipefail
          for tag in ${{ steps.tags.outputs.list }}; do
            if [[ -x "target-old/$tag/debug/vtop-node" ]]; then
              echo "$tag build cached"
              continue
            fi
            git worktree add "../wt-$tag" "$tag"
            (cd "../wt-$tag" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-old/$tag" \
              cargo build -p vtop-node --bin vtop-node)
            git worktree remove --force "../wt-$tag"
          done

      - name: Each released directory opens under HEAD
        run: |
          set -euo pipefail
          port=9700
          for tag in ${{ steps.tags.outputs.list }}; do
            # The rolling profile's threshold keys exist from v0.3.0 (#313);
            # older releases refuse unknown config keys, which is itself the
            # compatibility contract, so they replay the legacy single-file
            # shape — the exact claim open_range makes. A NUMERIC compare
            # states that rule (#409); the glob it replaces enumerated digit
            # ranges and would have been silently outgrown at v0.10.
            profile=legacy
            IFS=. read -r maj min _ <<< "${tag#v}"
            if (( maj > 0 || min >= 3 )); then profile=rolling; fi
            UPGRADE_KEEP=1 UPGRADE_WORKDIR="$GITHUB_WORKSPACE/upgrade-$tag" \
            UPGRADE_NATIVE_PORT="$port" \
              scripts/upgrade-compat.sh "$tag" \
                "target-old/$tag/debug/vtop-node" target/debug/vtop-node "$profile"
            port=$((port + 20))
          done

      # The metadata tier rolled from the newest release to HEAD, one voter at
      # a time, the way the chart rolls it (#554): every mixed step must keep
      # committing and every voter must converge. Only the NEWEST release:
      # upgrading from the immediately preceding release is the supported
      # path. Plaintext on loopback - the transport is not what is under test.
      - name: The metadata tier rolls from the newest release to HEAD
        run: |
          set -euo pipefail
          newest="$(tr ' ' '\n' <<< "${{ steps.tags.outputs.list }}" | grep . | tail -1)"
          CHAOS_PROFILE=debug CHAOS_TRANSPORT=plaintext CHAOS_KEEP=1 \
            CHAOS_WORKDIR="$GITHUB_WORKSPACE/upgrade-meta" \
            CHAOS_OLD_VTOP_NODE="target-old/$newest/debug/vtop-node" \
            scripts/live-chaos/scenarios/22-meta-rolling-upgrade.sh

      - name: Upload fixture logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-compat-logs
          path: |
            upgrade-v*/logs
            upgrade-meta/logs
          if-no-files-found: ignore
          retention-days: 7

  # The file source's delete path on macOS (#619). Everything else in CI runs
  # on Linux, where delete_after_commit proves no process holds a file open
  # with a write lease. macOS has no lease, so its half of that code - the
  # refusal, the Apple rename that never replaces a file
  # (renameatx_np(RENAME_EXCL)), the put-back by hard link, the ctime reads -
  # was built and run by no job: 14 of the adapter's lib tests failed there
  # unnoticed. Default features only, so there is no librdkafka or OpenSSL
  # build and the job takes minutes. The vtop-cli tests that delete files
  # would refuse here the same way and are not run.
  file-source-macos:
    name: file source (macOS)
    needs: changes
    if: needs.changes.outputs.file_source == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-file-source-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-file-source-

      - name: Clippy (deny warnings)
        run: cargo clippy -p vtop-adapters --all-targets --locked -- -D warnings

      - name: File source lib tests
        run: cargo test -p vtop-adapters --lib --locked

  # The MSRV is a tested promise, not a number in a file: this builds on exactly
  # the declared toolchain. The floor is set by aws-smithy-types 1.6.3
  # (rust-version 1.94.1), which raised the 1.94.0 floor sqlx 0.9 set;
  # lowering it means pinning aws-smithy-types back below 1.6.3.
  msrv:
    name: msrv (build on declared rust-version)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      - run: cargo check --workspace --all-targets

  # Coverage is reported, NOT gated: a threshold invites tests written to move a
  # number. The summary makes gaps visible on each PR so they can be judged.
  coverage:
    name: coverage (report only)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      # Run the instrumented suite ONCE and reuse its output. Calling
      # cargo llvm-cov again just to format the summary would recompile and
      # re-run every workspace test for no new information.
      - name: Collect coverage
        run: |
          cargo llvm-cov --workspace --summary-only \
            --ignore-filename-regex '(tests?/|benchmarks/)' | tee /tmp/coverage.txt
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            tail -25 /tmp/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # The benchmark harness had zero tests while accumulating real defects
  # (double-counted input bytes, silently dropped child runs, unescaped Markdown
  # tables, a write-after-close race, a large-binary OOM, swallowed YAML errors).
  # Only manual review was protecting it.
  benchmarks:
    name: benchmarks (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test tooling
        # ruff is pinned: a new release adds lint rules, and an unpinned one
        # turned this job red with no change to the code (ruff 0.17.0).
        run: pip install --disable-pip-version-check pytest pyyaml ruff==0.17.0

      - name: ruff
        run: ruff check .

      - name: pytest
        run: python -m pytest

      # The harness must keep working where PyYAML is absent - that fallback is
      # the whole reason load_scenario() has two code paths - so prove the suite
      # passes without it too, rather than assuming. The PyYAML-specific tests
      # live in their own module and skip themselves; everything else must still
      # run and pass.
      - name: pytest without PyYAML (fallback parser path)
        run: |
          pip uninstall -y pyyaml
          python -m pytest

  # The whole stack, assembled and asserted end to end. Unit and integration
  # tests never run the real compose lab, which is exactly how the Kafka
  # ingestion P0 shipped with CI fully green. Verified this job catches it:
  # re-introducing that bug fails "no committed batch for source type: kafka"
  # while file/syslog still pass - the precise signature of the original defect.
  e2e-smoke:
    name: e2e smoke (full compose lab)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Build the engine image once, up front: the script's `compose up` would
      # otherwise build it inside the timed wait loop and could time out on a
      # cold cache rather than on a real failure.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built here rather than by `docker compose build` so it can read the same
      # cache as the other two jobs; compose then finds the tag already in the
      # daemon and builds nothing. The tag must match what compose would have
      # produced, or compose rebuilds it and the cache buys nothing.
      - name: Build the engine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: vtop-engine:local
          load: true
          cache-from: type=gha,scope=ci-image

      # MinIO is built from source (docker/minio/Dockerfile: no registry serves
      # its images any more). Built here, before the smoke, for the same reason
      # as the engine image: a cold build inside the script's `compose up` is
      # slow, and its failure should read as a build failure, not a lab one.
      - name: Build the lab's MinIO image
        run: docker compose build minio

      - name: Run the end-to-end smoke test
        env:
          TIMEOUT: "300"
        run: bash scripts/e2e-smoke.sh

      # The script itself dumps engine logs on failure BEFORE its exit trap tears
      # the stack down, so the real diagnostics are already in the job output
      # above. This is a best-effort fallback; the container is usually gone by
      # now, which is expected.
      - name: Engine logs on failure (best effort)
        if: failure()
        run: docker compose logs --tail=100 vtop-engine 2>/dev/null || echo "stack already torn down; see the smoke output above"

  # Fuzzing (issues #25, #729): every decoder of untrusted bytes must never
  # panic. This is a bounded SMOKE run - a short campaign per target from the
  # committed seed corpus that fails the build if any target crashes. The
  # long campaigns, with a corpus that persists between nights, are
  # .github/workflows/fuzz-nightly.yml. cargo-fuzz needs nightly + libFuzzer.
  fuzz:
    name: fuzz smoke (every target)
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned: the floating "nightly" channel broke on 2026-07-24 with an
          # ICE compiling tokio under ASAN (rustc 89c61a754). Pin the last
          # known-good nightly; bump deliberately when a newer one is verified.
          # fuzz-nightly.yml pins the same one.
          toolchain: nightly-2026-07-22
          # ASAN (which libFuzzer builds with) is incompatible with a statically
          # linked libc, so the fuzz build must target the GNU (dynamic-libc)
          # triple explicitly - otherwise a musl default fails with
          # "sanitizer is incompatible with statically linked libc".
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
      # The fuzz crate is its own workspace with no committed lockfile.
      # Starting it from the workspace's lockfile builds the same, audited
      # versions the engine ships, rather than whatever resolves today.
      - name: Seed the fuzz lockfile from the workspace
        run: cp Cargo.lock fuzz/Cargo.lock
      # The list comes from the crate, not from this file, so a target added
      # to fuzz/Cargo.toml is fuzzed here and nightly without a workflow edit.
      - name: List the targets
        id: targets
        run: |
          targets=$(cargo +nightly-2026-07-22 fuzz list | tr '\n' ' ')
          echo "targets: $targets"
          test -n "$targets"
          echo "list=$targets" >> "$GITHUB_OUTPUT"
      - name: Build every target
        run: cargo +nightly-2026-07-22 fuzz build --target x86_64-unknown-linux-gnu
      # Each committed seed is decoded once (-runs=0 runs the corpus and
      # stops), so a seed that panics names itself before the campaign.
      - name: Replay every committed seed
        env:
          TARGETS: ${{ steps.targets.outputs.list }}
        run: |
          for t in $TARGETS; do
            echo "::group::seeds $t"
            cargo +nightly-2026-07-22 fuzz run "$t" --target x86_64-unknown-linux-gnu -- -runs=0
            echo "::endgroup::"
          done
      # 30 s per target. The filter puts this job on most Rust PRs, and at
      # 60 s the eleven targets alone took 11 of its 19 minutes. A PR smoke
      # catches a decoder that panics on inputs near the seeds, which shows
      # in seconds; the deep search is the nightly's hour per target.
      - name: Smoke-fuzz each target (fails on any crash)
        env:
          TARGETS: ${{ steps.targets.outputs.list }}
        run: |
          for t in $TARGETS; do
            echo "::group::fuzz $t"
            cargo +nightly-2026-07-22 fuzz run "$t" --target x86_64-unknown-linux-gnu -- \
              -max_total_time=30 -print_final_stats=1
            echo "::endgroup::"
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The group-commit coordinator's model test (#752). The coordinator hands
  # the lead from one waiting producer thread to the next over a Mutex and
  # Condvars; a lost wake-up there hangs every producer on the range, and a
  # stress test only finds one by luck. loom explores every interleaving of a
  # small model instead. `vtop_loom`, not `loom`: a plain `--cfg loom` turns
  # on tokio's own loom paths and the tree no longer builds.
  loom:
    name: loom model (group commit)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-loom-${{ hashFiles('**/Cargo.lock') }}
      - name: Explore the coordinator's interleavings
        env:
          RUSTFLAGS: --cfg vtop_loom
        run: cargo test -p vtop-broker --lib --release --locked loom_model

  # Mutation testing on the commit path (#729): GATED. A mutant of the
  # state machine (`transition`, `can_transition`, `is_committable`) or of
  # replay that the tests do not catch is a way to reach SOURCE_COMMITTED
  # before VERIFIED that nothing would notice, so the build fails when the
  # score drops below MUTANTS_MIN_SCORE. scripts/mutants-gate.py computes
  # caught / (caught + missed + timeout) from mutants.out/outcomes.json
  # (unviable mutants do not compile and are left out, as cargo-mutants
  # leaves them out), names every survivor, and refuses a run that is not
  # evidence (failed baseline, no viable mutant, a file with none).
  mutants-gate:
    name: mutation testing (commit path)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.mutants_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The maintainer's rule (#729): a gate is the measured score minus 5
      # points, never below 0.80. These two files measured 22 of 22 (1.00),
      # but stay at 0.90 until the nightly runs show no flaky timeouts: a
      # mutant that times out on a loaded runner counts against the score,
      # and at 1.00 one would fail an unrelated PR. Then this goes to 1.00.
      MUTANTS_MIN_SCORE: "0.90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The gate is only as good as its arithmetic: prove it on crafted
      # outcomes (pass, fail, unviable excluded, timeouts counted, empty and
      # failed-baseline runs refused) before trusting it with a real one.
      - name: Test the gate script
        run: python3 -m unittest discover -s scripts/tests -p 'test_mutants_gate.py' -v
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-mutants
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      # cargo-mutants exits non-zero when a mutant survives; the gate script,
      # not that exit code, decides, so the run's result is kept for it.
      - name: Run cargo-mutants on the commit path
        run: |
          cargo mutants --package vtop-core \
            --file 'crates/vtop-core/src/state_machine.rs' \
            --file 'crates/vtop-core/src/replay.rs' \
            --timeout 120 --no-shuffle | tee /tmp/mutants.txt || true
      - name: Gate on the mutation score
        run: |
          python3 scripts/mutants-gate.py \
            --outcomes mutants.out/outcomes.json \
            --min-score "$MUTANTS_MIN_SCORE" \
            --expect-file crates/vtop-core/src/state_machine.rs \
            --expect-file crates/vtop-core/src/replay.rs \
            --title 'Mutation testing (commit path, gated)' \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-commit-path
          path: |
            mutants.out/outcomes.json
            mutants.out/missed.txt
            mutants.out/timeout.txt
          if-no-files-found: ignore
          retention-days: 14

  # Mutation testing (issue #25): REPORT ONLY - never gates the build
  # (continue-on-error) - for the classifier and the batcher, which are not
  # on the commit path. The commit-path files moved to the gated job above.
  mutants:
    name: mutation testing (report only)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-mutants
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      - name: Run cargo-mutants on the core logic
        run: |
          cargo mutants --package vtop-core \
            --file 'crates/vtop-core/src/detect.rs' \
            --file 'crates/vtop-core/src/batch.rs' \
            --timeout 120 --no-shuffle | tee /tmp/mutants.txt || true
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Mutation testing (report only)'
            echo '```'
            tail -40 /tmp/mutants.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The fast path for observability changes: dashboards are generated Python +
  # JSON, not engine code, so they don't need the Rust workspace, Docker, Kafka,
  # or the e2e lab. This job lints the generators, re-runs them and fails if the
  # committed JSON is stale (the exact drift that shipped once), and checks the
  # JSON parses. Seconds, not tens of minutes.
  # The engine's alert rules (#720). promtool runs from the pinned image with
  # the rules mounted read-only and no network; the checker proves every alert
  # has a runbook section its link resolves to, and a firing and a quiet test.
  prometheus-rules:
    name: prometheus rules (promtool + runbooks)
    needs: changes
    if: needs.changes.outputs.prometheus_rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # A digest pin stops the image moving under us, but a pin bumped
      # halfway (a new digest under the old comment) or a registry that no
      # longer serves the digest would otherwise only show as a confusing
      # failure later. Check the pin itself first.
      - name: The pinned promtool image exists and is the version its pin names
        run: |
          set -euo pipefail
          comment=$(sed -n 's/^  PROMETHEUS_IMAGE: [^ ]* # v\([0-9][^ ]*\)$/\1/p' .github/workflows/ci.yml)
          if [ "$comment" != "$PROMETHEUS_VERSION" ]; then
            echo "::error::the PROMETHEUS_IMAGE pin comment names v$comment but PROMETHEUS_VERSION is $PROMETHEUS_VERSION; bump them together"
            exit 1
          fi
          docker pull --quiet "$PROMETHEUS_IMAGE" \
            || { echo "::error::$PROMETHEUS_IMAGE could not be pulled; the registry no longer serves the pinned digest"; exit 1; }
          reported=$(docker run --rm --network none --entrypoint promtool "$PROMETHEUS_IMAGE" --version \
            | sed -n 's/^promtool, version \([^ ]*\) .*/\1/p')
          if [ "$reported" != "$PROMETHEUS_VERSION" ]; then
            echo "::error::the pinned image reports promtool '$reported', but the pin names $PROMETHEUS_VERSION"
            exit 1
          fi
          echo "pinned promtool is $reported"

      - name: The chart's copy of the rules is the rules file
        run: |
          if ! diff -u observability/prometheus/vtop-rules.yaml helm/vtop/files/vtop-rules.yaml; then
            echo "::error::helm/vtop/files/vtop-rules.yaml differs from observability/prometheus/vtop-rules.yaml (diff above). Edit the rules file, then copy it: cp observability/prometheus/vtop-rules.yaml helm/vtop/files/vtop-rules.yaml"
            exit 1
          fi

      - name: promtool check rules
        run: |
          docker run --rm --network none -v "$PWD/observability/prometheus:/rules:ro" -w /rules \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check rules vtop-rules.yaml

      - name: promtool test rules
        run: |
          docker run --rm --network none -v "$PWD/observability/prometheus:/rules:ro" -w /rules \
            --entrypoint promtool "$PROMETHEUS_IMAGE" test rules tests/vtop-rules.test.yaml

      - name: Install the runbook checker's dependency (hash-pinned)
        run: python -m pip install --disable-pip-version-check --require-hashes -r observability/prometheus/requirements.txt

      - name: The runbook checker can fail
        run: python -m unittest discover -s scripts/tests -p 'test_check_alert_runbooks.py' -v

      - name: Every alert has a runbook section, a working link and both unit tests
        run: python scripts/check-alert-runbooks.py

  dashboards:
    name: dashboards (generators + no drift)
    needs: changes
    if: needs.changes.outputs.dashboards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Syntax-check the dashboard generators
        run: python -m compileall -q observability/*.py
      # Catches the class of bug drift detection structurally cannot: a panel
      # that matches its generator exactly and still renders blank (stat panel
      # missing pluginVersion, duplicate/missing panel id, no targets).
      - name: Validate dashboard structure
        run: python3 observability/validate-dashboards.py
      - name: Regenerate dashboards and fail on drift
        run: |
          python3 observability/build-dashboards.py
          # --porcelain reports MODIFIED and UNTRACKED files, so a newly added
          # dashboard whose JSON was never committed also fails - `git diff`
          # alone would ignore the untracked output and pass.
          drift="$(git status --porcelain -- observability/grafana/dashboards/)"
          if [ -n "$drift" ]; then
            echo "::error::Committed dashboard JSON is out of date or missing. Run 'python3 observability/build-dashboards.py' and commit the result."
            echo "$drift"
            exit 1
          fi
      - name: Validate every dashboard JSON parses
        run: |
          set -e
          for f in observability/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          echo "all dashboard JSON valid"

  # The Kafka-comparison charts and reports (#600) are generated from the
  # committed CSVs and must stay exactly that: this job regenerates every one
  # and fails on any difference, as the dashboards job does for its JSON.
  # regenerate.py hands EVERY committed run under benchmarks/kafka_compare/
  # results/ to report.py, which picks the generator per run (a failover run
  # goes to failover_report.py), so a new run or generator is covered when its
  # results are committed, with no change here.
  #
  # SVG and Markdown are compared byte for byte. PNG bytes cannot be: Pillow's
  # macOS and manylinux wheels deflate with different zlib builds, so the same
  # pixels compress to different bytes (measured: identical pixels on macOS
  # arm64, Linux arm64 and Linux x86_64, different files). regenerate.py puts
  # back the committed bytes of a PNG whose decoded pixels, size, mode and
  # metadata are unchanged, so `git diff` sees a PNG only when it looks
  # different. The plotting stack is pinned exactly, with hashes, in
  # requirements-report.txt and regenerate.py refuses any other, and refuses a DejaVu Sans from outside
  # matplotlib's own bundled copy.
  benchmark-charts:
    name: benchmark charts (regenerate + no drift)
    needs: changes
    if: needs.changes.outputs.benchmark_charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The patch version is pinned: a floating "3.12" moves with the runner
      # image, and the charts are checked byte for byte.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      # Hash-checked, as docs/requirements.txt is: pip refuses a file whose
      # hash is not in the lock. The test runner has its own lock, compiled
      # against the plotting stack's, so the stack's lock stays the stack.
      - name: Install the pinned plotting stack
        run: |
          pip install --disable-pip-version-check --require-hashes -r benchmarks/kafka_compare/requirements-report.txt
          pip install --disable-pip-version-check --require-hashes -r benchmarks/kafka_compare/requirements-report-test.txt
      # The benchmarks job runs without matplotlib or Pillow, so every test
      # file that needs them skips there and runs here;
      # tests/test_benchmark_charts_job.py fails when one is missing below.
      # That check reads this file as text, so the run checks too: a test
      # that skipped here for want of matplotlib or Pillow fails the job.
      - name: Report and drift-check tests, with matplotlib
        working-directory: benchmarks
        # A step with no `shell:` runs as `bash -e {0}`, without pipefail:
        # without this line the pipe into tee would hide a failing test.
        run: |
          set -o pipefail
          python -m pytest -rs tests/test_kafka_compare_report.py tests/test_kafka_compare_regenerate.py tests/test_kafka_compare_failover.py tests/test_kafka_compare_footer.py tests/test_kafka_compare_colours.py tests/test_readme_charts.py tests/test_benchmark_charts_job.py tests/test_compare_reports.py | tee "$RUNNER_TEMP/chart-tests.log"
          if grep -E "SKIPPED.*(matplotlib|PIL)" "$RUNNER_TEMP/chart-tests.log"; then
            echo "::error::A chart test skipped for want of matplotlib or Pillow, in the one job that installs them."
            exit 1
          fi
      - name: Regenerate every chart and report and fail on drift
        run: |
          python3 benchmarks/kafka_compare/regenerate.py
          # --porcelain reports modified AND untracked files, so a new chart
          # whose output was never committed fails too; `git diff` alone would
          # ignore the untracked file and pass.
          drift="$(git status --porcelain -- docs/benchmarks/)"
          if [ -n "$drift" ]; then
            echo "::error::Committed benchmark charts or reports differ from what the committed CSVs produce. Run 'python3 -m pip install --require-hashes -r benchmarks/kafka_compare/requirements-report.txt && python3 benchmarks/kafka_compare/regenerate.py' and commit the result."
            echo "$drift"
            git diff --stat -- docs/benchmarks/
            exit 1
          fi
      # The cross-product comparisons (#744): every committed run under
      # benchmarks/<kind>_compare/results/ through its kind's report.py. A kind
      # with no committed run yet is skipped, and must then have no output.
      - name: Regenerate the cross-product comparison reports and fail on drift
        run: |
          python3 benchmarks/compare_common/regenerate.py
          drift="$(git status --porcelain -- docs/benchmarks/)"
          if [ -n "$drift" ]; then
            echo "::error::Committed comparison charts or reports differ from what the committed CSVs produce. Run 'python3 -m pip install --require-hashes -r benchmarks/kafka_compare/requirements-report.txt && python3 benchmarks/compare_common/regenerate.py' and commit the result."
            echo "$drift"
            exit 1
          fi
      - name: Redraw the README's charts and fail on drift
        run: |
          python3 benchmarks/readme_charts.py
          drift="$(git status --porcelain -- docs/assets/readme/)"
          if [ -n "$drift" ]; then
            echo "::error::The README's charts differ from what the committed measurements produce. Run 'python3 -m pip install --require-hashes -r benchmarks/kafka_compare/requirements-report.txt && python3 benchmarks/readme_charts.py' and commit the result."
            echo "$drift"
            exit 1
          fi

  # The SQLite ledger's backup and restore, drilled (#734): an engine archives a
  # growing file, the ledger is backed up with the online backup API while it
  # runs, the engine is killed and the ledger destroyed, and the restore
  # (docs/operate/backup-and-recovery.md) is followed by an engine that must
  # resume with no hole (`audit-coverage --check-storage`, `scrub --sample`)
  # and by RPO and RTO inside the documented bounds. The PostgreSQL modes run
  # from postgres-matrix.yml, nightly, on the pinned images.
  restore-drill-sqlite:
    name: restore drill (sqlite)
    needs: changes
    if: needs.changes.outputs.restore_drill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # The upgrade-compat job's key: the same `vtopctl` build, so a hit costs a
      # relink and this job adds no cache entry of its own.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-upgrade-${{ hashFiles('**/Cargo.lock') }}
      - name: Build vtopctl
        run: cargo build -p vtop-cli --no-default-features --bin vtopctl
      - name: Back up, destroy, restore and resume
        env:
          RESTORE_DRILL_WORKDIR: ${{ runner.temp }}/restore-drill-sqlite
        run: scripts/restore-drill.sh sqlite target/debug/vtopctl
      - name: Keep the measurements and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-sqlite
          path: |
            ${{ runner.temp }}/restore-drill-sqlite/result.json
            ${{ runner.temp }}/restore-drill-sqlite/logs
          if-no-files-found: ignore
          retention-days: 30

  # The Postgres backend (Phase 3) must pass the SAME behavioural battery as
  # SQLite, and its DB-level invariant trigger must reject a bypass, with
  # `vtopctl migrate`, a ledger restore and the engine's recovery (#723).
  # The jobs and the pinned images live in postgres-matrix.yml, which also
  # runs all five supported majors nightly. Here, on a change the `postgres`
  # filter matches, it runs the oldest and the newest: their checks are
  # named `postgres / postgres backend (battery) (pg 14)` and `(pg 18)`.
  postgres:
    name: postgres
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    uses: ./.github/workflows/postgres-matrix.yml
    with:
      majors: '["14","18"]'

  # #723, opt-in: the same tests against a managed PostgreSQL service (RDS,
  # Cloud SQL, ...). It needs a throwaway instance and repository secrets,
  # which a maintainer sets up (docs/POSTGRES_DEPLOYMENT.md, "Managed-service
  # smoke test"); without them the job reports that it skipped and passes. A
  # fork's pull request never sees secrets, so it always skips there. The
  # `secrets` context cannot gate a job, so the first step reads the secret
  # and every later step is gated on its output.
  postgres-managed:
    name: postgres managed smoke (opt-in)
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every run, from every branch, shares the one managed instance and the
    # fixed `vtop_test_*` databases and roles, and the workflow's concurrency
    # group is per ref. One at a time across the repository; a run waits
    # rather than cancel another's half-done restore.
    #
    # GitHub keeps one PENDING job per concurrency group and cancels the older
    # pending one when a third arrives, whatever cancel-in-progress says, so a
    # shared group cancels (and reddens) other PRs' runs while two or more
    # wait. When no managed database is configured the job does nothing, so
    # it then gets a group of its own per run and never queues. The client
    # image variable is required whenever the smoke is enabled (the gate step
    # refuses without it), and unlike a secret, `vars` may name a group.
    concurrency:
      group: ${{ vars.VTOP_MANAGED_POSTGRES_CLIENT_IMAGE != '' && 'postgres-managed-smoke' || format('postgres-managed-smoke-off-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    env:
      VTOP_TEST_POSTGRES: ${{ secrets.VTOP_MANAGED_POSTGRES_URL }}
      VTOP_TEST_POSTGRES_RUNTIME: ${{ secrets.VTOP_MANAGED_POSTGRES_RUNTIME_URL }}
      CLIENT_IMAGE: ${{ vars.VTOP_MANAGED_POSTGRES_CLIENT_IMAGE }}
    steps:
      - name: Is a managed database configured?
        id: gate
        run: |
          if [ -z "$VTOP_TEST_POSTGRES" ]; then
            echo "::notice title=postgres managed smoke skipped::No VTOP_MANAGED_POSTGRES_URL secret, so nothing ran against a managed service. See docs/POSTGRES_DEPLOYMENT.md, 'Managed-service smoke test'."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -n "$VTOP_TEST_POSTGRES_RUNTIME" ] || missing="$missing secret:VTOP_MANAGED_POSTGRES_RUNTIME_URL"
          [ -n "$CLIENT_IMAGE" ] || missing="$missing variable:VTOP_MANAGED_POSTGRES_CLIENT_IMAGE"
          if [ -n "$missing" ]; then
            echo "::error::VTOP_MANAGED_POSTGRES_URL is set, but the managed smoke also needs:$missing. Nothing was run. See docs/POSTGRES_DEPLOYMENT.md, 'Managed-service smoke test'."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: steps.gate.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pg-${{ hashFiles('**/Cargo.lock') }}
      # A private CA (RDS, Cloud SQL) for `sslmode=verify-full`: the URLs
      # name this path in `sslrootcert`, and the client container sees the
      # file at the same path.
      - name: Write the database CA
        if: steps.gate.outputs.enabled == 'true'
        env:
          CA: ${{ secrets.VTOP_MANAGED_POSTGRES_CA }}
        run: printf '%s\n' "$CA" > /tmp/vtop-managed-postgres-ca.pem
      - name: Run the Postgres StateStore battery
        if: steps.gate.outputs.enabled == 'true'
        run: cargo test -p vtop-state --features postgres,test-support --test pg_battery
      - name: vtopctl migrate twice, and a restore into a migrated schema
        if: steps.gate.outputs.enabled == 'true'
        run: |
          export VTOP_TEST_PG_EXEC="docker run --rm -i --network host -v /tmp/vtop-managed-postgres-ca.pem:/tmp/vtop-managed-postgres-ca.pem:ro $CLIENT_IMAGE"
          cargo test -p vtop-cli --no-default-features --features postgres --test postgres_migrate_restore
      - name: Engine recovery on PostgreSQL
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -o pipefail
          cargo test -p vtop-cli --no-default-features --features postgres \
            --test integration_state_recovery -- --exact \
            on_postgres_a_recovered_commit_is_counted_by_its_stored_class 2>&1 | tee recovery.log
          grep -q 'test result: ok. 1 passed' recovery.log
