name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting `main`. This project stacks
  # PRs — each slice bases on the one below it — and a `branches: [main]`
  # filter here meant a stacked PR ran NO CI at all: it was reviewed, approved,
  # and merged on the strength of a bot comment, with the first real signal
  # arriving only once its parent merged and it retargeted. A base change fires
  # `edited`, which is not in the default event set, so even that retarget did
  # not reliably re-trigger anything.
  #
  # The path filters already scope the work per PR, so the added cost is the
  # jobs a stacked slice actually needs — which is the cost of knowing whether
  # it works.
  pull_request:

# Least privilege by default; no CI job needs write access to the repo.
# pull-requests: read is required by dorny/paths-filter in the `changes` job —
# it lists a PR's changed files via the pulls API, and an unspecified scope
# under an explicit permissions block is `none`, which would fail detection
# and silently skip every downstream job.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what actually changed so heavy Rust jobs don't run for a docs- or
  # dashboard-only PR. Each downstream job gates on these outputs. This job is
  # seconds; the jobs it can skip are tens of minutes.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dashboards: ${{ steps.filter.outputs.dashboards }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
      scripts: ${{ steps.filter.outputs.scripts }}
      shell: ${{ steps.filter.outputs.shell }}
      kafka: ${{ steps.filter.outputs.kafka }}
      postgres: ${{ steps.filter.outputs.postgres }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      chaos: ${{ steps.filter.outputs.chaos }}
      upgrade: ${{ steps.filter.outputs.upgrade }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # Pinned to a full commit SHA (v3), not the mutable tag, so an upstream
      # tag move cannot change CI behaviour without a reviewed commit here.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'fuzz/**'
              - 'docker/**'
              - '.dockerignore'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            # Narrow filters for the jobs that spin up external services or a
            # nightly toolchain. Each lists the crates its command actually
            # compiles, taken from `cargo tree`, rather than all of `crates/**`.
            #
            # Listing crates explicitly is safe here BECAUSE a crate can only
            # gain a dependency by editing its own Cargo.toml — which is inside
            # its own path pattern. So a closure that grows re-triggers the job
            # that cares, and these lists cannot silently go stale. Verify one
            # with `cargo tree -p <crate> -e normal`.
            #
            # Each filter also carries `.cargo/**` and `rust-toolchain*`: those
            # change the flags, target, and linker every one of these commands
            # compiles with, so a job that ignored them could pass on a build
            # configuration it never used.

            # `cargo test -p vtop-cli --test integration_kafka_to_minio`,
            # plus the seeding step that runs `docker/seed-events.sh` — the
            # generator whose output the test then asserts is non-empty.
            #
            # vtop-cli depends on every workspace crate EXCEPT vtop-node, so
            # this is "everything but the cluster-node binary" — which is where
            # a lot of #215/#224 work lands. vtop-broker and vtop-protocol are
            # listed because PR #229 makes vtop-cli depend on them for
            # `vtopctl node status`; they are a superset until it lands.
            kafka:
              - 'crates/vtop-adapters/**'
              - 'crates/vtop-broker/**'
              - 'crates/vtop-cli/**'
              - 'crates/vtop-core/**'
              - 'crates/vtop-log/**'
              - 'crates/vtop-meta/**'
              - 'crates/vtop-observe/**'
              - 'crates/vtop-protocol/**'
              - 'crates/vtop-state/**'
              - 'crates/vtop-upload/**'
              - 'tests/**'
              # Executed by the job's seeding step, and its output is what the
              # test asserts on.
              - 'docker/seed-events.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            # `cargo test -p vtop-state --features postgres,test-support
            #  --test pg_battery`. Closure is vtop-state + vtop-core.
            postgres:
              - 'crates/vtop-state/**'
              - 'crates/vtop-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            # The fuzz targets (detect_batch, detect_record, manifest_parse)
            # exercise vtop-core only, and need a pinned nightly toolchain.
            fuzz:
              - 'fuzz/**'
              - 'crates/vtop-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'

            dashboards:
              - 'observability/**'
            benchmarks:
              - 'benchmarks/**'
            scripts:
              - 'scripts/**'
              - 'docker-compose*.yml'
              - 'docker/**'
              - '.dockerignore'
              - 'examples/**'
            # The chart is a released artifact with two contracts worth gating:
            # it must RENDER valid manifests, and it must REFUSE to render
            # without identities. The second is the security property — #81
            # exists because a lab compose shipped default credentials — and a
            # refusal that quietly stopped refusing would look exactly like
            # success.
            #
            # The workflow file rides along because the job's own steps are
            # part of the contract they enforce.
            helm:
              - 'helm/**'
              - '.github/workflows/ci.yml'
              # The chart's appVersion has to track the workspace version, and
              # the workspace version can only change HERE. Without this the
              # helm job is skipped by exactly the PR that bumps it — the one
              # case the check exists for.
              - 'Cargo.toml'
            shell:
              - 'docker/*.sh'
              - 'docker/tests/**'
              # Executable CI test code (#291), linted like the rest.
              - 'scripts/upgrade-compat.sh'
              # The live-chaos harness is executable shell that gates every
              # distributed-systems claim this project makes, and it was
              # unlinted: a change to lib.sh — sourced by every scenario —
              # triggered nothing. That is how a scenario stayed red on main
              # without anyone noticing.
              - 'scripts/live-chaos/**'
              # The two smoke scripts that gate the DEPLOYMENT paths. Listed
              # here as well as under `scripts` because the two filters drive
              # different jobs: `scripts` gates the e2e/compose work, `shell`
              # gates the lint. Adding them to the shellcheck step without
              # adding them here meant a PR touching only a smoke script skipped
              # the shellcheck job entirely — so the lint would never once run
              # against the files it was added for, which is the same
              # unlinted-shell hole the live-chaos entry below exists to close.
              - 'scripts/k8s-smoke.sh'
              - 'scripts/e2e-smoke.sh'
              # The traffic collector, for the same reason and by the same
              # mistake: it was added to the shellcheck step without being
              # added here, so a PR touching only the collector would have
              # skipped the lint it was added for (review).
              - 'scripts/traffic-snapshot.sh'
              # The test-progress runner: developer tooling, but shell that people
              # will paste and rely on, so it is linted like the rest — listed here
              # AND in the shellcheck step, for the reason the comment above gives.
              - 'scripts/test-progress.sh'
              # The release-notes generator only ever runs during a tag build,
              # where a failure means a published release with a broken body and
              # no second chance to get it right before people see it. Lint it
              # on the pull request instead.
              - 'scripts/release-notes.sh'
              - '.github/workflows/**'

            # `scripts/live-chaos/run-all.sh`. The harness drives real
            # processes over real TLS: metadata Raft, replication, fencing,
            # and failover.
            #
            # `crates/**`, not a hand-listed subset. The two binaries this job
            # runs pull in every workspace crate — verified, not assumed:
            #
            #   cargo tree -p vtop-node --edges normal
            #     → broker, log, meta, observe, protocol
            #   cargo tree -p vtop-cli --no-default-features --edges normal
            #     → adapters, broker, core, log, meta, observe, protocol,
            #       state, upload
            #
            # An earlier version of this filter named four crates and claimed
            # nothing else could change a scenario's outcome. That was wrong in
            # both directions that matter: vtop-log owns the segment format the
            # durability and recovery scenarios assert on, and vtop-protocol
            # owns the produce/fetch wire these scenarios speak. Either could
            # have broken the suite with this job never running.
            #
            # This does mean the suite runs on most Rust changes. That is the
            # honest cost of it being the only thing that validates replication
            # and fencing against real processes; the alternative is a gate
            # with a hole in it, which is what the four-crate list was.
            chaos:
              - 'scripts/live-chaos/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
            upgrade:
              # The on-disk format contract (#291): any crate change can move
              # the format, the toolchain/cargo config changes the HEAD binary
              # that opens the fixtures, and the script itself is executable
              # test code.
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'scripts/upgrade-compat.sh'
              - 'scripts/live-chaos/gen-certs.sh'
              - '.github/workflows/ci.yml'
  build-and-test:
    name: fmt + clippy + test + build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # librdkafka (cmake-build feature) builds from source. It needs cmake + a
      # C toolchain, SSL + SASL, zlib, and libcurl (the SASL OAUTHBEARER/OIDC
      # path #includes <curl/curl.h> even when WITH_CURL=0).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        # --locked: a Cargo.lock that does not match Cargo.toml must FAIL
        # rather than be silently regenerated. Without it a dependency can be
        # added with no lockfile entry and builds then resolve versions that were
        # never tested - which had already happened before this guard existed.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --bin vtopctl --locked

  docker:
    name: docker image build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # THE ONLY JOB THAT WRITES THE CACHE. Three jobs build this image and they
      # run in parallel, so having each export would mean three concurrent
      # writers to one scope for identical layers. This one exports; the Helm
      # and compose jobs import. They therefore warm from the PREVIOUS run
      # rather than from this one, which is what makes the saving repeatable
      # instead of dependent on job ordering.
      - name: Build engine image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          tags: vtop-engine:ci
          load: true
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

      # The build succeeding says nothing about what is INSIDE. The image
      # shipped for two releases containing only vtopctl, so the Helm chart —
      # which runs `vtop-node node` — could not start a single pod against it,
      # and nothing noticed because no check ever looked.
      - name: The image contains the binaries a deployment needs
        run: |
          set -euo pipefail
          for binary in vtop-node vtopctl; do
            docker run --rm --entrypoint "$binary" vtop-engine:ci --version \
              || { echo "::error::$binary is missing from the image or will not run"; exit 1; }
          done

      # The TOOLS, not only the binaries. `vtop-node` itself went missing from
      # this image and shipped in a release (#281) because nothing asserted its
      # presence; the troubleshooting tools are one Dockerfile edit away from
      # going the same way, and their absence is only discovered mid-incident.
      #
      # `curl` earns its place because /metrics, /healthz and /readyz are plain
      # HTTP and nothing else in the image can read them — `vtopctl` speaks VTPM
      # and the replica plane over mTLS. `getent` is the DNS check (same
      # nsswitch path the engine resolves peers through) and comes from libc.
      - name: The image contains the tools an operator needs to debug it
        run: |
          set -euo pipefail
          for tool in curl nc getent openssl; do
            docker run --rm --entrypoint sh vtop-engine:ci -c "command -v $tool >/dev/null" \
              || { echo "::error::$tool is missing from the image; an operator cannot diagnose a node without it (see #295)"; exit 1; }
          done
          # Present is not the same as working: a curl that cannot execute is
          # exactly as useful as no curl, and only running it proves the
          # difference.
          docker run --rm --entrypoint curl vtop-engine:ci --version \
            || { echo "::error::curl is present but will not run"; exit 1; }
          echo "image carries curl, nc, getent and openssl"

  audit:
    name: supply-chain (cargo audit)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Prebuilt cargo-audit binary (fast; no compile).
      - name: Install cargo-audit
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-audit
      # Reads .cargo/audit.toml: fails on any advisory NOT documented there,
      # so new/actionable vulnerabilities block the build while known
      # unfixable transitive ones (tracked in docs/SECURITY_MODEL.md) are
      # still printed in the log as "ignored".
      - name: Audit dependencies
        run: cargo audit

  # The lab shell scripts have already produced real defects (broken pick()
  # array indexing, a port off-by-one, and PARTITIONS=0 passing validation only
  # to fail Kafka topic creation silently), so they are linted and tested like
  # any other code.
  helm-deploy:
    name: helm (deploy to kind)
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: vtop-ci

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Imports only — see the note on the image job. `load: true` is required
      # because the next step pulls the binaries back OUT of this image and
      # `kind load` needs it in the daemon, neither of which can read a build
      # that only exists in the buildx cache.
      - name: Build the engine image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          tags: vtop-engine:local
          load: true
          cache-from: type=gha,scope=ci-image

      # Taken OUT of the image rather than compiled again. The image already
      # contains both binaries — that is the property #281 was about — so
      # extracting them proves the SHIPPED artifact is the one under test, and
      # skips a second full Rust build.
      - name: Take vtopctl and vtop-node out of the image under test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          container="$(docker create vtop-engine:local)"
          for binary in vtopctl vtop-node; do
            docker cp "$container:/usr/local/bin/$binary" "$RUNNER_TEMP/bin/$binary"
          done
          docker rm "$container" >/dev/null
          chmod +x "$RUNNER_TEMP/bin"/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Load the image into kind
        run: kind load docker-image vtop-engine:local --name vtop-ci

      # The half the static checks cannot reach: pods Ready, Raft bootstrapped,
      # records streamed and counted, and every record surviving a killed pod.
      - name: Deploy the chart and verify it works
        run: scripts/k8s-smoke.sh vtop-ci vtop

      # EVERY namespace the smoke test uses, and the node itself.
      #
      # This dumped only `vtop-ci` while the test had grown two more namespaces,
      # so a failure in the replicated shape captured the state of a namespace
      # that was fine. Node capacity is here because the failure it hid was a
      # Pending pod: the chart requests 500m CPU each and a two-vCPU runner
      # cannot host seven, which surfaces as a DNS error three layers away from
      # its cause.
      - name: Cluster state on failure
        if: failure()
        run: |
          echo "=== node capacity and allocation ==="
          kubectl describe node | sed -n '/Allocated resources/,/^Events/p' || true
          kubectl get pods -A -o wide || true
          for ns in vtop-ci vtop-ci-neighbour vtop-ci-replicated; do
            echo "=== $ns ==="
            kubectl -n "$ns" get pods -o wide || true
            # Pending pods have no logs and no events of their own worth
            # printing; the scheduler's refusal is on the pod, so describe first.
            kubectl -n "$ns" describe pods || true
            kubectl -n "$ns" logs -l app.kubernetes.io/instance=vtop --tail=60 --all-containers || true
          done

  helm:
    name: helm (lint + render + refusals)
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      # THE DEFAULT INSTALL PULLS `appVersion`. `statefulset.yaml` defaults the
      # image tag to `.Chart.AppVersion`, so a chart whose appVersion lags the
      # workspace ships users an older image than the release they downloaded —
      # and it drifted silently for two releases before anything noticed. The
      # failure is nasty because the chart installs cleanly and the pods run the
      # wrong binaries.
      - name: The chart's appVersion tracks the workspace version
        run: |
          set -euo pipefail
          workspace="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          chart="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' helm/vtop/Chart.yaml)"
          # BOTH must be found. If a reformat breaks either anchor, both go
          # empty and `"" != ""` is false — the check would pass by extracting
          # nothing, which is the failure mode it exists to prevent.
          if [ -z "$workspace" ] || [ -z "$chart" ]; then
            echo "::error::could not read the versions to compare (workspace='$workspace', chart='$chart'). One of the anchors in Cargo.toml or helm/vtop/Chart.yaml has moved; fix this check rather than removing it."
            exit 1
          fi
          if [ "$workspace" != "$chart" ]; then
            echo "::error::helm/vtop/Chart.yaml appVersion ($chart) != workspace version ($workspace). A default chart install resolves its image tag from appVersion, so it would deploy $chart while the release says $workspace."
            exit 1
          fi
          echo "appVersion $chart matches the workspace"

      - name: helm lint
        run: helm lint helm/vtop -f helm/vtop/ci/default-values.yaml

      - name: Render the documented happy path
        run: |
          set -euo pipefail
          helm template vtop helm/vtop -f helm/vtop/ci/default-values.yaml > /tmp/rendered.yaml
          # A chart that renders NOTHING also exits zero, so count the output
          # rather than trusting the status code.
          manifests=$(grep -c '^kind:' /tmp/rendered.yaml)
          echo "rendered $manifests manifests"
          test "$manifests" -ge 5

      # Stdlib only, deliberately. A YAML library would have to be installed,
      # and an install step that quietly fails leaves a check that no longer
      # checks anything while still reporting success. Helm's output is
      # predictable enough that scanning it is honest.
      - name: Every manifest carries a kind and an apiVersion
        run: |
          python3 - "/tmp/rendered.yaml" <<'PYEOF'
          import re, sys
          docs = [d for d in open(sys.argv[1]).read().split('\n---\n') if d.strip()]
          for doc in docs:
              kind = re.search(r'^kind: (\S+)', doc, re.M)
              api = re.search(r'^apiVersion: (\S+)', doc, re.M)
              assert kind, f'manifest without a kind:\n{doc[:200]}'
              assert api, f'{kind.group(1)} without an apiVersion'
          print(f'{len(docs)} manifests carry kind and apiVersion')
          PYEOF

      # THE SECURITY CONTRACT. The chart never defaults an identity or a
      # credential; #81 exists because a lab compose shipped defaults. A
      # refusal that stopped refusing would render a cluster whose nodes all
      # share whatever the chart invented, and it would look like success.
      - name: Identities are still never defaulted
        run: |
          set -euo pipefail
          refuses() {
            what="$1"; shift
            if helm template vtop helm/vtop "$@" >/dev/null 2>&1; then
              echo "::error::the chart rendered without $what; identities must never be defaulted"
              exit 1
            fi
            echo "refused without $what"
          }
          # Verbatim copy of the message-asserting helper from the
          # replicated-guards step below — run blocks share no shell state.
          refuses_because() {
            expected="$1"; shift
            if output=$(helm template vtop helm/vtop "$@" 2>&1); then
              echo "::error::rendered successfully; expected a refusal mentioning: $expected"
              exit 1
            fi
            if ! printf '%s' "$output" | grep -qF "$expected"; then
              echo "::error::refused, but not for the expected reason."
              echo "::error::wanted: $expected"
              printf '%s\n' "$output" | tail -5
              exit 1
            fi
            echo "refused because: $expected"
          }
          refuses "any identities"
          # Every other identity supplied, so rendering REACHES the TLS check
          # instead of aborting earlier. The first version of this step set only
          # cluster.id and stopped at the nodeUuids length check — helm exits
          # non-zero either way, so the step passed while never once exercising
          # the contract it names. A regression that silently stopped refusing
          # TLS would have sailed through it.
          refuses "TLS secret names" \
            --set cluster.id=11111111-2222-3333-4444-555555555555 \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2,aaaaaaaa-0000-0000-0000-0000000000a3}' \
            --set data.range.topic=telemetry \
            --set data.range.rangeId=aaaaaaaa-0000-0000-0000-0000000000c1 \
            --set data.segmentId=aaaaaaaa-0000-0000-0000-0000000000d1 \
            --set data.principalId=aaaaaaaa-0000-0000-0000-0000000000ce
          refuses "a matching nodeUuids count" -f helm/vtop/ci/default-values.yaml --set replicaCount=5
          refuses "distinct broker UUIDs" \
            -f helm/vtop/ci/default-values.yaml \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a3}'
          # The #287 slice-1 guards. Each refusal is a values file somebody
          # could plausibly write: the retired key with a real list in it, an
          # even voter count, and the mode that exists in the schema before
          # its rendering exists in the chart.
          refuses "the nodeUuids migration (cluster.nodeUuids is retired)" \
            -f helm/vtop/ci/default-values.yaml \
            --set 'cluster.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2,aaaaaaaa-0000-0000-0000-0000000000a3}'
          # A MATCHING four-UUID list, so the render reaches the voter-count
          # guard: with the file's three UUIDs and replicaCount=4 the length
          # check refuses on its own, and this case stayed green with the
          # even-voter guard deleted — the same blindness the TLS refusal
          # above once had.
          refuses_because "replicaCount 4 is even" \
            -f helm/vtop/ci/default-values.yaml \
            --set replicaCount=4 \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1,aaaaaaaa-0000-0000-0000-0000000000a2,aaaaaaaa-0000-0000-0000-0000000000a3,aaaaaaaa-0000-0000-0000-0000000000a4}'
          refuses "deployment.mode=colocated (separated is slice 2)" \
            -f helm/vtop/ci/default-values.yaml --set deployment.mode=separated

      # The REPLICATED shape, which until now nothing rendered at all — not
      # here, and not in the live smoke test either. It is the only topology
      # that exercises replication, fencing and promotion, so it was the one
      # shape that mattered most and was covered least.
      - name: The replicated topology renders the shape it claims
        run: |
          set -euo pipefail
          helm template vtop helm/vtop -f helm/vtop/ci/replicated-values.yaml > /tmp/replicated.yaml
          # Ruby, not python3, for one reason: this must PARSE the config, and
          # python3's stdlib has no YAML. The first version of this check used
          # regexes, and it passed against a render whose followers list was
          # glued onto the previous line — `followers:- node_uuid: ...` — which
          # the binary refuses to parse and which put the leader into
          # CrashLoopBackOff. Every pattern-shaped assertion matched happily.
          # Only parsing catches that class, and ruby is preinstalled on the
          # runner, so this stays a stdlib-only check with no install step to
          # fail silently.
          ruby -ryaml -e '
            docs = YAML.load_stream(File.read("/tmp/replicated.yaml")).compact
            cm = docs.find { |d| d["kind"] == "ConfigMap" && d["data"]&.keys&.any? { |k| k.start_with?("node-") } }
            abort "no node ConfigMap in the render" unless cm

            configs = {}
            cm["data"].each do |name, body|
              # An explicit capture rather than ruby global match variables:
              # actionlint runs shellcheck over these blocks, and a dollar-digit
              # inside single quotes reads as a shell positional that will not
              # expand (SC2016). It is a ruby capture, but code that looks like a
              # shell bug in a shell-linted context is worth not writing — and
              # this comment cannot name the sigil either, for the same reason.
              matched = name.match(/\Anode-(\d)\.yaml\z/)
              next unless matched
              # THE ASSERTION THAT MATTERS. A config that does not parse is not
              # a config; everything below is only meaningful once this holds.
              begin
                configs[matched[1]] = YAML.safe_load(body)
              rescue => e
                abort "#{name} is not valid YAML, so the pod cannot start: #{e.message}"
              end
            end
            abort "expected three node configs, got #{configs.keys.sort}" unless configs.size == 3

            # SYMMETRIC by design (#284): every pod a candidate, no rendered
            # leader at all — the role follows the metadata lease at runtime,
            # which is the entire point of retiring leaderOrdinal.
            roles = configs.transform_values { |c| c.fetch("data").fetch("role") }
            abort "roles are #{roles}, expected candidate on every pod" \
              unless roles.values.uniq == ["candidate"]

            # Each candidate names the FULL peer set, self included; the
            # binary skips its own entry. The lists must be identical — a
            # divergent list is two nodes disagreeing about the replica set.
            peer_lists = configs.transform_values { |c| c.fetch("data").fetch("peers") }
            abort "peer lists differ between pods: #{peer_lists}" \
              unless peer_lists.values.uniq.size == 1
            peers = peer_lists["0"]
            abort "expected 3 peers (self included), got #{peers.inspect}" unless peers.size == 3

            # Each peer dialled at its OWN address. A shared SAN once
            # collapsed every follower to one name here, so the leader
            # replicated to the same pod twice and "quorum" meant one replica.
            addrs = peers.map { |f| f.fetch("addr") }
            abort "peers collapsed to shared addresses: #{addrs}" unless addrs.uniq.size == 3

            # And each peer carries its OWN identity, checked against the
            # configured set (review). Addresses are what the replica plane
            # DIALS; node UUIDs are what quorum arithmetic COUNTS. Three
            # distinct addresses under two distinct identities would render,
            # deploy, and then count a two-node quorum as three — the failure
            # the address check alone cannot see.
            uuids = peers.map { |f| f.fetch("node_uuid") }
            abort "peers carry duplicate identities: #{uuids}" unless uuids.uniq.size == 3
            want_uuids = %w[
              aaaaaaaa-0000-0000-0000-0000000000a1
              aaaaaaaa-0000-0000-0000-0000000000a2
              aaaaaaaa-0000-0000-0000-0000000000a3
            ]
            abort "peer identities #{uuids.sort} are not the configured data.nodeUuids #{want_uuids}" \
              unless uuids.sort == want_uuids

            # Every pod carries its OWN identity from that same set, and the
            # peer list is identical everywhere: together those say the three
            # pods are three members of ONE range, not overlapping claims.
            #
            # NO APOSTROPHES anywhere in this ruby block, for the same reason
            # the comment above cannot name a dollar-sigil: the whole program
            # is one single-quoted shell argument, so an apostrophe in a
            # COMMENT terminates the string and the step dies with a bash
            # syntax error pointing at ruby code that is perfectly valid.
            # Write "the pod own identity" shaped prose instead.
            own = configs.values.map { |c| c.fetch("data").fetch("node_uuid") }
            abort "pod identities #{own.sort} are not the configured set" unless own.sort == want_uuids
            %w[0 1 2].each_with_index do |ordinal, idx|
              want = "vtop-#{ordinal}.vtop-headless.default.svc.cluster.local:9300"
              abort "peer addr #{addrs.sort[idx]} != #{want}" unless addrs.sort[idx] == want
            end

            # Candidates acquire the range through the lease; a candidate
            # without one can never lead, and the render-time guard for that
            # is itself tested below — this asserts the happy path carries it.
            %w[0 1 2].each do |ordinal|
              abort "candidate #{ordinal} has no lease block" unless configs[ordinal]["data"]["lease"]
              epoch = configs[ordinal]["data"].fetch("fencing_epoch")
              abort "candidate #{ordinal} fencing_epoch is #{epoch}, must be 0" unless epoch == 0
            end

            # One range, not a mixture. A stray standalone pod would serve its
            # own log while the others replicate, and renders perfectly.
            abort "a replicated render must contain no standalone pod" if roles.values.include?("standalone")

            puts "replicated topology parses: three identical leased candidates"
          '

      # The guards on the replicated shape. Both were added with the topology
      # itself and NEITHER was tested: a guard that stops guarding renders a
      # cluster that cannot work and reports success, which is the same trap
      # the identity refusals above exist to avoid.
      - name: The replicated topology still refuses what cannot work
        run: |
          set -euo pipefail
          # Asserts the REASON, not just a non-zero exit. Helm exits non-zero
          # for any failure, so a check that only looks at the status can pass
          # while aborting somewhere else entirely — which is exactly how the
          # TLS refusal above once tested nothing. A verbatim copy lives in
          # the identities step above (run blocks share no shell state) —
          # keep the two in step.
          refuses_because() {
            expected="$1"; shift
            if output=$(helm template vtop helm/vtop "$@" 2>&1); then
              echo "::error::rendered successfully; expected a refusal mentioning: $expected"
              exit 1
            fi
            if ! printf '%s' "$output" | grep -qF "$expected"; then
              echo "::error::refused, but not for the expected reason."
              echo "::error::wanted: $expected"
              printf '%s\n' "$output" | tail -5
              exit 1
            fi
            echo "refused because: $expected"
          }

          # leaderOrdinal is retired (#284): the refusal must EXPLAIN the
          # migration, not silently ignore a value that used to steer roles.
          refuses_because "data.leaderOrdinal is retired" \
            -f helm/vtop/ci/replicated-values.yaml --set data.leaderOrdinal=0

          # Candidates acquire the range through the lease; without it no pod
          # would ever lead, and the render is a cluster that cannot work.
          refuses_because "requires data.lease.enabled" \
            -f helm/vtop/ci/replicated-values.yaml --set data.lease.enabled=false

          # Grants are minted from 1; a floor at or above the first grant
          # refuses the very grant that makes a candidate lead.
          refuses_because "must be 0 under" \
            -f helm/vtop/ci/replicated-values.yaml --set data.fencingEpoch=1

          # A single-replica replicated range is standalone wearing the wrong
          # name. nodeUuids is shortened to match, so this reaches the
          # topology check instead of stopping at the UUID-count check.
          refuses_because "a replicated range needs at least one follower" \
            -f helm/vtop/ci/replicated-values.yaml \
            --set replicaCount=1 \
            --set 'data.nodeUuids={aaaaaaaa-0000-0000-0000-0000000000a1}'

      # Long names are where DNS limits and collisions appear, and both were
      # real: the headless Service used to truncate to the same string as the
      # client Service, so a long release name rendered two Services with one
      # name.
      - name: Names stay distinct and inside DNS limits
        run: |
          set -euo pipefail
          long=$(printf 'a%.0s' $(seq 1 53))
          helm template "$long" helm/vtop -f helm/vtop/ci/default-values.yaml > /tmp/long.yaml
          python3 - "/tmp/long.yaml" <<'PYEOF'
          import re, sys
          docs = [d for d in open(sys.argv[1]).read().split('\n---\n') if d.strip()]
          services, checked = [], 0
          for doc in docs:
              kind = re.search(r'^kind: (\S+)', doc, re.M)
              name = re.search(r'^  name: (\S+)', doc, re.M)
              if not (kind and name):
                  continue
              kind, name = kind.group(1), name.group(1)
              checked += 1
              assert len(name) <= 63, f'{kind} name is {len(name)} chars: {name}'
              if kind == 'Service':
                  services.append(name)
              if kind == 'StatefulSet':
                  # Pods append "-<ordinal>", and the pod-name label is capped
                  # at 63 as well.
                  assert len(name) + 4 <= 63, f'pod names would exceed 63: {name}'
          assert checked, 'no named manifests found; the scan matched nothing'
          assert len(services) == len(set(services)), f'Service names collide: {services}'
          print(f'{checked} named manifests, {len(services)} Services, all distinct and in limits')
          PYEOF

      - name: helm package
        run: helm package helm/vtop --destination /tmp/chart

  shell:
    name: shellcheck + bats
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Pinned to reviewed versions rather than the mutable `stable`/`latest`
      # tags, so a tool update cannot change CI results without a commit.
      # Dependabot's docker ecosystem does not scan workflow `docker run` lines,
      # so these are bumped deliberately.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 docker/*.sh scripts/release-notes.sh \
            scripts/k8s-smoke.sh scripts/e2e-smoke.sh scripts/upgrade-compat.sh \
            scripts/traffic-snapshot.sh scripts/test-progress.sh

      # `-P scripts/live-chaos/scenarios` resolves the scenarios' dynamic
      # `source "$(dirname …)/../lib.sh"`. Without it every scenario reports
      # SC1091 plus spurious "may not be assigned" warnings for variables
      # lib.sh does define — noise that would train people to ignore this job.
      - name: shellcheck (live-chaos harness)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 -x -P scripts/live-chaos/scenarios \
            scripts/live-chaos/lib.sh \
            scripts/live-chaos/run-all.sh \
            scripts/live-chaos/gen-certs.sh \
            scripts/live-chaos/scenarios/*.sh

      - name: bats
        run: |
          docker run --rm -v "$PWD:/code" -w /code \
            bats/bats:1.13.0 docker/tests/

  # Kafka was entirely untested in CI, which is how a P0 shipped: every read
  # returned zero records (a subscribe() per read forced a rebalance that
  # reseeked to earliest and ate the poll window), so no batch ever sealed - and
  # CI stayed green because nothing here talked to a broker.
  #
  # The broker advertises localhost so the host-run test connects over the mapped
  # port without an /etc/hosts entry.
  kafka-integration:
    name: kafka integration (live broker)
    needs: changes
    if: needs.changes.outputs.kafka == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-kafka-it-${{ hashFiles('**/Cargo.lock') }}

      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      # Seed a topic with real records. The tests assert a NON-EMPTY read, so an
      # empty topic would make them fail rather than pass vacuously.
      - name: Seed the it_events topic
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "ancestor=apache/kafka:4.3.1" --format '{{.ID}}' | head -1)
          docker exec "$cid" /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic it_events --partitions 1 --replication-factor 1
          bash docker/seed-events.sh cef 40 \
            | docker exec -i "$cid" /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server localhost:9092 --topic it_events
          docker exec "$cid" /opt/kafka/bin/kafka-get-offsets.sh \
            --bootstrap-server localhost:9092 --topic it_events

          # Warm up the group coordinator before the tests run. The adapter
          # assigns Offset::Stored, which asks the broker for the consumer
          # group's committed offsets; that needs the group coordinator and the
          # __consumer_offsets topic, which a FRESH broker creates only lazily on
          # the first group operation. Until it exists, consumers get
          # "NotCoordinator" and every read fails. Consuming once under a
          # throwaway group forces it into existence.
          #
          # This is why the job failed on its first run but passed locally: a
          # long-lived local broker already had __consumer_offsets.
          docker exec "$cid" /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic it_events \
            --group ci-warmup --from-beginning --max-messages 1 --timeout-ms 30000
          docker exec "$cid" /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --list

      - name: Run live-broker integration tests
        env:
          VTOP_TEST_KAFKA: localhost:9092
        run: cargo test -p vtop-cli --test integration_kafka_to_minio -- --ignored
  # cargo-deny covers what cargo-audit does not: license compliance, dependency
  # bans, and source provenance. Advisory decisions are mirrored from
  # .cargo/audit.toml (the single source of truth) so the two cannot disagree.
  deny:
    name: supply-chain (cargo deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The live-chaos harness drives real processes over real TLS — metadata Raft,
  # replication, fencing, promotion, failover — and until now it ran only when
  # someone ran it by hand. That is how scenario 09 sat red on main since #236,
  # how scenario 10 sat red since #237, and how a data node spent three issues
  # presenting the wrong certificate to the admin endpoint: nothing looked.
  #
  # Scoped, not blanket. It runs only when the harness or one of the four
  # crates whose binaries it executes changes — a docs or workflow edit does
  # not pay for a cluster. Debug binaries, because these scenarios assert
  # correctness rather than throughput, and a release build costs more than the
  # runs it feeds.
  live-chaos:
    name: live chaos (real processes)
    needs: changes
    if: needs.changes.outputs.chaos == 'true'
    runs-on: ubuntu-latest
    # The suite is ~13 scenarios, several of which sit through election and
    # lease timeouts by design. Generous, but bounded: a hang must fail rather
    # than occupy a runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-chaos-${{ hashFiles('**/Cargo.lock') }}

      # Fault injection needs unprivileged user and mount namespaces (05, 05b,
      # 06). Ubuntu 24.04 — which `ubuntu-latest` now is — ships an AppArmor
      # restriction on unprivileged userns that blocks them by default, so the
      # runner needs it lifted. The sysctl is best-effort: if a future image
      # drops the knob, the probe below is what decides, not the setting.
      #
      # The probe does NOT skip on failure. These scenarios self-check and fail
      # with a remediation message, so a runner without namespaces turns this
      # job red honestly rather than reporting success for three scenarios that
      # never ran — which is precisely the kind of silent gap this job exists
      # to close.
      - name: Enable and verify unprivileged namespaces
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "note: sysctl unavailable on this image; relying on the probe"
          unshare -rm bash -c 'mount -t tmpfs -o size=1m tmpfs /mnt && echo "mount namespaces OK"'

      - name: Build harness binaries
        run: |
          cargo build -p vtop-node --bin vtop-node
          cargo build -p vtop-cli --no-default-features --bin vtopctl

      # CHAOS_WORKDIR is what makes the logs survive to be uploaded. Scenarios
      # delete workdirs they generated themselves, so an artifact pointed at
      # the default `/tmp/vtop-chaos.*` collects nothing and the upload passes
      # empty — a diagnostic that appears to exist and is absent exactly when
      # it is needed. Supplying the directory also sets WORKDIR_GENERATED=0,
      # which suppresses that cleanup, so the tree is still there afterwards.
      - name: Run the live chaos suite
        id: chaos
        run: CHAOS_PROFILE=debug CHAOS_WORKDIR="$RUNNER_TEMP/chaos" scripts/live-chaos/run-all.sh

      # A failing scenario names a log file; without this the reason dies with
      # the runner. `error` on empty, not `ignore`: an empty artifact means the
      # wiring above broke, and that must be visible rather than silent.
      #
      # Gated on THIS step's outcome, not the job's. `failure()` is also true
      # when the namespace probe or the build failed — cases where the suite
      # never reached a scenario, so no logs exist and `error` would stack a
      # spurious "no files found" on top of the real cause. The empty-artifact
      # signal only means something once the run itself has been attempted.
      - name: Upload scenario logs
        if: steps.chaos.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-chaos-logs
          path: ${{ runner.temp }}/chaos/**/logs/
          if-no-files-found: error
          retention-days: 7

  # A data directory written by an old release must open under the current
  # build (#291). Every other durability test writes its fixtures with the
  # code under test, so the on-disk format was only ever validated against
  # itself — the one bug class an operator meets mid-upgrade and cannot fix
  # forward. Two legs: v0.2.1 writes the single-`range.active` shape (the
  # exact compatibility claim `open_range` makes), v0.3.0 writes rolled
  # sealed segments. Downgrade is NOT tested and NOT supported — stated in
  # ROADMAP.md rather than left as an untested assumption.
  upgrade-compat:
    name: upgrade compat (old directories open under HEAD)
    needs: changes
    if: needs.changes.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # The whole point is building OTHER releases: the worktrees below
          # check out release tags, which a shallow clone does not have.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-upgrade-${{ hashFiles('**/Cargo.lock') }}
      # The tag list is DERIVED, not hardcoded: the newest patch release of
      # every minor series since the native data plane shipped (v0.2+ — the
      # v0.1.x CLI predates the produce/verify surface this script drives).
      # A new release therefore joins the matrix the moment its tag exists,
      # so the immediately preceding release — the upgrade path most
      # operators actually take — cannot silently fall out of coverage.
      # FINALS ONLY, stated as a policy rather than a sort subtlety (#409):
      # a suffixed tag (v0.5.0-rc1) must never beat its final in last-wins,
      # and the glob admits every major so v1.0.0 joins the day it exists.
      # The finals pattern guards inside awk, not as a grep stage (review):
      # under pipefail a matchless grep would kill the assignment before the
      # friendly no-tags guard below could speak; awk exits clean on none.
      - name: Select the released tags to replay
        id: tags
        run: |
          set -euo pipefail
          tags="$(git tag --list 'v[0-9]*' --sort=version:refname \
            | awk -F. '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && ($1 "." $2) != "v0.1" { latest[$1 "." $2] = $0 } END { for (m in latest) print latest[m] }' \
            | sort -V | tr '\n' ' ')"
          [[ -n "${tags// /}" ]] || { echo "no release tags found"; exit 1; }
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "replaying: $tags"
      # Release tags are immutable, so their builds are cached essentially
      # forever: after the first run this job pays only the HEAD build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target-old
          key: ${{ runner.os }}-upgrade-old-tags-${{ steps.tags.outputs.list }}

      - name: Build HEAD vtop-node
        run: cargo build -p vtop-node --bin vtop-node

      - name: Build the released tags
        run: |
          set -euo pipefail
          for tag in ${{ steps.tags.outputs.list }}; do
            if [[ -x "target-old/$tag/debug/vtop-node" ]]; then
              echo "$tag build cached"
              continue
            fi
            git worktree add "../wt-$tag" "$tag"
            (cd "../wt-$tag" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-old/$tag" \
              cargo build -p vtop-node --bin vtop-node)
            git worktree remove --force "../wt-$tag"
          done

      - name: Each released directory opens under HEAD
        run: |
          set -euo pipefail
          port=9700
          for tag in ${{ steps.tags.outputs.list }}; do
            # The rolling profile's threshold keys exist from v0.3.0 (#313);
            # older releases refuse unknown config keys, which is itself the
            # compatibility contract, so they replay the legacy single-file
            # shape — the exact claim open_range makes. A NUMERIC compare
            # states that rule (#409); the glob it replaces enumerated digit
            # ranges and would have been silently outgrown at v0.10.
            profile=legacy
            IFS=. read -r maj min _ <<< "${tag#v}"
            if (( maj > 0 || min >= 3 )); then profile=rolling; fi
            UPGRADE_KEEP=1 UPGRADE_WORKDIR="$GITHUB_WORKSPACE/upgrade-$tag" \
            UPGRADE_NATIVE_PORT="$port" \
              scripts/upgrade-compat.sh "$tag" \
                "target-old/$tag/debug/vtop-node" target/debug/vtop-node "$profile"
            port=$((port + 20))
          done

      - name: Upload fixture logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-compat-logs
          path: upgrade-v*/logs
          if-no-files-found: ignore
          retention-days: 7

  # The MSRV is a tested promise, not a number in a file: this builds on exactly
  # the declared toolchain. The floor is set by sqlx 0.9 (rust-version 1.94.0),
  # which raised the aws-sdk crates' previous 1.91.1 floor; lowering it means
  # pinning sqlx back to 0.8.
  msrv:
    name: msrv (build on declared rust-version)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      - run: cargo check --workspace --all-targets

  # Coverage is reported, NOT gated: a threshold invites tests written to move a
  # number. The summary makes gaps visible on each PR so they can be judged.
  coverage:
    name: coverage (report only)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      # Run the instrumented suite ONCE and reuse its output. Calling
      # cargo llvm-cov again just to format the summary would recompile and
      # re-run every workspace test for no new information.
      - name: Collect coverage
        run: |
          cargo llvm-cov --workspace --summary-only \
            --ignore-filename-regex '(tests?/|benchmarks/)' | tee /tmp/coverage.txt
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            tail -25 /tmp/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  # The benchmark harness had zero tests while accumulating real defects
  # (double-counted input bytes, silently dropped child runs, unescaped Markdown
  # tables, a write-after-close race, a large-binary OOM, swallowed YAML errors).
  # Only manual review was protecting it.
  benchmarks:
    name: benchmarks (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: pip install --disable-pip-version-check pytest pyyaml ruff

      - name: ruff
        run: ruff check .

      - name: pytest
        run: python -m pytest

      # The harness must keep working where PyYAML is absent - that fallback is
      # the whole reason load_scenario() has two code paths - so prove the suite
      # passes without it too, rather than assuming. The PyYAML-specific tests
      # live in their own module and skip themselves; everything else must still
      # run and pass.
      - name: pytest without PyYAML (fallback parser path)
        run: |
          pip uninstall -y pyyaml
          python -m pytest

  # The whole stack, assembled and asserted end to end. Unit and integration
  # tests never run the real compose lab, which is exactly how the Kafka
  # ingestion P0 shipped with CI fully green. Verified this job catches it:
  # re-introducing that bug fails "no committed batch for source type: kafka"
  # while file/syslog still pass - the precise signature of the original defect.
  e2e-smoke:
    name: e2e smoke (full compose lab)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Build the engine image once, up front: the script's `compose up` would
      # otherwise build it inside the timed wait loop and could time out on a
      # cold cache rather than on a real failure.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Built here rather than by `docker compose build` so it can read the same
      # cache as the other two jobs; compose then finds the tag already in the
      # daemon and builds nothing. The tag must match what compose would have
      # produced, or compose rebuilds it and the cache buys nothing.
      - name: Build the engine image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          tags: vtop-engine:local
          load: true
          cache-from: type=gha,scope=ci-image

      - name: Run the end-to-end smoke test
        env:
          TIMEOUT: "300"
        run: bash scripts/e2e-smoke.sh

      # The script itself dumps engine logs on failure BEFORE its exit trap tears
      # the stack down, so the real diagnostics are already in the job output
      # above. This is a best-effort fallback; the container is usually gone by
      # now, which is expected.
      - name: Engine logs on failure (best effort)
        if: failure()
        run: docker compose logs --tail=100 vtop-engine 2>/dev/null || echo "stack already torn down; see the smoke output above"

  # Fuzzing (issue #25): detect.rs and manifest deserialization both parse
  # UNTRUSTED bytes, so they must never panic. This is a bounded SMOKE run - a
  # short campaign from the committed seed corpus that fails the build if any
  # target crashes. It is not a substitute for long out-of-band fuzzing, but it
  # catches regressions on every PR. cargo-fuzz needs nightly + libFuzzer.
  fuzz:
    name: fuzz smoke (detect + manifest)
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # Pinned: the floating "nightly" channel broke on 2026-07-24 with an
          # ICE compiling tokio under ASAN (rustc 89c61a754). Pin the last
          # known-good nightly; bump deliberately when a newer one is verified.
          toolchain: nightly-2026-07-22
          # ASAN (which libFuzzer builds with) is incompatible with a statically
          # linked libc, so the fuzz build must target the GNU (dynamic-libc)
          # triple explicitly - otherwise a musl default fails with
          # "sanitizer is incompatible with statically linked libc".
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
      - name: Smoke-fuzz each target (fails on any crash)
        run: |
          for t in detect_record detect_batch manifest_parse; do
            echo "::group::fuzz $t"
            cargo +nightly-2026-07-22 fuzz run "$t" --target x86_64-unknown-linux-gnu -- \
              -max_total_time=60 -print_final_stats=1
            echo "::endgroup::"
          done

  # Mutation testing (issue #25): measure whether the suite actually catches
  # injected faults. REPORT ONLY - never gates the build (continue-on-error) -
  # and scoped to the highest-value modules so a run finishes in CI time.
  mutants:
    name: mutation testing (report only)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-mutants
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config
      - name: Run cargo-mutants on the core logic
        run: |
          cargo mutants --package vtop-core \
            --file 'crates/vtop-core/src/detect.rs' \
            --file 'crates/vtop-core/src/state_machine.rs' \
            --file 'crates/vtop-core/src/batch.rs' \
            --timeout 120 --no-shuffle | tee /tmp/mutants.txt || true
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Mutation testing (report only)'
            echo '```'
            tail -40 /tmp/mutants.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The fast path for observability changes: dashboards are generated Python +
  # JSON, not engine code, so they don't need the Rust workspace, Docker, Kafka,
  # or the e2e lab. This job lints the generators, re-runs them and fails if the
  # committed JSON is stale (the exact drift that shipped once), and checks the
  # JSON parses. Seconds, not tens of minutes.
  dashboards:
    name: dashboards (generators + no drift)
    needs: changes
    if: needs.changes.outputs.dashboards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Syntax-check the dashboard generators
        run: python -m compileall -q observability/*.py
      # Catches the class of bug drift detection structurally cannot: a panel
      # that matches its generator exactly and still renders blank (stat panel
      # missing pluginVersion, duplicate/missing panel id, no targets).
      - name: Validate dashboard structure
        run: python3 observability/validate-dashboards.py
      - name: Regenerate dashboards and fail on drift
        run: |
          python3 observability/build-dashboards.py
          # --porcelain reports MODIFIED and UNTRACKED files, so a newly added
          # dashboard whose JSON was never committed also fails - `git diff`
          # alone would ignore the untracked output and pass.
          drift="$(git status --porcelain -- observability/grafana/dashboards/)"
          if [ -n "$drift" ]; then
            echo "::error::Committed dashboard JSON is out of date or missing. Run 'python3 observability/build-dashboards.py' and commit the result."
            echo "$drift"
            exit 1
          fi
      - name: Validate every dashboard JSON parses
        run: |
          set -e
          for f in observability/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          echo "all dashboard JSON valid"

  # The Postgres backend (Phase 3) must pass the SAME behavioural battery as
  # SQLite, and its DB-level invariant trigger must reject a bypass. Runs against
  # a real Postgres service. Gated on rust changes like the other Rust jobs.
  postgres:
    name: postgres backend (battery)
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vtop
          POSTGRES_PASSWORD: vtop
          POSTGRES_DB: vtop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pg-${{ hashFiles('**/Cargo.lock') }}
      # vtop-state depends only on vtop-core (no librdkafka), so no system deps.
      - name: Run the Postgres StateStore battery
        env:
          VTOP_TEST_POSTGRES: postgres://vtop:vtop@localhost:5432/vtop
          VTOP_TEST_POSTGRES_RUNTIME: postgres://vtop_runtime_test:vtop-runtime-test@localhost:5432/vtop
        run: cargo test -p vtop-state --features postgres,test-support --test pg_battery
