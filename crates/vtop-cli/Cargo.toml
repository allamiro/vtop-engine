[package]
name = "vtop-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VTOP Engine runtime and the `vtopctl` command-line interface."

[lib]
name = "vtop_cli"
path = "src/lib.rs"

[[bin]]
name = "vtopctl"
path = "src/main.rs"

[features]
default = ["kafka"]
# Kafka is a compatibility/source adapter, not a native broker dependency.
kafka = ["vtop-adapters/kafka", "dep:rdkafka"]
# Opt-in Kerberos (SASL GSSAPI) for the Kafka source; see vtop-adapters.
kafka-gssapi = ["kafka", "vtop-adapters/kafka-gssapi"]
# Keep PostgreSQL optional in the CLI while providing a discoverable feature
# for production builds and the separate `vtopctl migrate` deployment step.
postgres = ["vtop-state/postgres"]
# TEST BUILDS ONLY (#725): `VTOP_FAILPOINT=<point>` makes the engine kill
# itself with SIGKILL at that line, for the engine crash sweep
# (scripts/live-chaos/engine/run-sweep.sh). Off by default; no release
# archive, container image or chart enables it, and
# scripts/check-failpoints-absent.sh fails CI if one does.
failpoints = ["dep:bytes", "rustix/process"]

[dependencies]
blake3 = { workspace = true }
vtop-core = { workspace = true }
vtop-log = { workspace = true }
vtop-meta = { workspace = true }
vtop-broker = { workspace = true }
vtop-observe = { workspace = true }
vtop-protocol = { workspace = true }
vtop-adapters = { workspace = true, default-features = false }
vtop-upload = { workspace = true }
vtop-state = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
rustix = { workspace = true }
rdkafka = { workspace = true, optional = true }
# The multipart part type the failpoint decorator passes through.
bytes = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# The surface snapshot (#719): the vtopctl command tree and the engine's
# metric families, against docs/surface/.
vtop-surface = { workspace = true, features = ["clap"] }
# The in-memory span exporter the trace tests assert against (#683).
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# Decoding what the fake collector receives (tests/otel_messages.rs).
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
# s3_native_object_keys (#626) counts stored object versions on a live store.
aws-sdk-s3 = { workspace = true }
# `PgStateStore::execute_raw` resets the Postgres ledger between the recovery
# tests that run on one when VTOP_TEST_POSTGRES is set (#664).
vtop-state = { workspace = true, features = ["test-support"] }
# Which S3 server a live test runs against, and what it expects of it (#722).
vtop-s3-testkit = { workspace = true }
# ledger_v0_9_0 re-roots the paths in a ledger the released v0.9.0 wrote
# (#626), with SQL, before this build opens it.
sqlx = { workspace = true }

# Integration tests live in the repo-root tests/ directory and are compiled as
# integration tests of this package.
[[test]]
name = "integration_file_to_minio"
path = "../../tests/integration_file_to_minio.rs"

[[test]]
name = "integration_replay"
path = "../../tests/integration_replay.rs"

[[test]]
name = "integration_state_recovery"
path = "../../tests/integration_state_recovery.rs"

[[test]]
name = "integration_manifest_rollback"
path = "../../tests/integration_manifest_rollback.rs"

[[test]]
name = "integration_kafka_to_minio"
path = "../../tests/integration_kafka_to_minio.rs"
required-features = ["kafka"]

# The same Kafka source refused by a broker that wants TLS or SASL: the wrong
# password, the wrong user, the wrong certificate authority (#721).
[[test]]
name = "integration_kafka_auth"
path = "../../tests/integration_kafka_auth.rs"
required-features = ["kafka"]

# The same Kafka source against a three-broker cluster whose partition leader
# is stopped and started mid-read (#721, scripts/kafka-cluster.sh).
[[test]]
name = "integration_kafka_cluster"
path = "../../tests/integration_kafka_cluster.rs"
required-features = ["kafka"]

# Every failpoint kills the real binary where it says it does (#725).
[[test]]
name = "failpoints"
path = "tests/failpoints.rs"
required-features = ["failpoints"]

[[test]]
name = "integration_metrics_endpoint"
path = "tests/integration_metrics_endpoint.rs"

# The schema on one PostgreSQL major (#723): `vtopctl migrate` twice, and a
# ledger restore into a migrated schema. Needs a throwaway server
# (VTOP_TEST_POSTGRES) and its client tools (VTOP_TEST_PG_EXEC); skips without.
[[test]]
name = "postgres_migrate_restore"
required-features = ["postgres"]
