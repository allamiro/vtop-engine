[package]
name = "vtop-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VTOP Engine runtime and the `vtopctl` command-line interface."

[lib]
name = "vtop_cli"
path = "src/lib.rs"

[[bin]]
name = "vtopctl"
path = "src/main.rs"

[features]
default = ["kafka", "otel"]
# Kafka is a compatibility/source adapter, not a native broker dependency.
kafka = ["vtop-adapters/kafka", "dep:rdkafka"]
# Opt-in Kerberos (SASL GSSAPI) for the Kafka source; see vtop-adapters.
kafka-gssapi = ["kafka", "vtop-adapters/kafka-gssapi"]
# Keep PostgreSQL optional in the CLI while providing a discoverable feature
# for production builds and the separate `vtopctl migrate` deployment step.
postgres = ["vtop-state/postgres"]
# OTLP trace export (#683). Default, so the shipped binary and image export
# once an operator sets OTEL_EXPORTER_OTLP_ENDPOINT; until one is set there is
# no exporter and no export thread. A build that must not carry the egress
# code at all drops it: `--no-default-features --features kafka`.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-http",
    "dep:tracing-opentelemetry",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:rustls",
]

[dependencies]
blake3 = { workspace = true }
vtop-core = { workspace = true }
vtop-log = { workspace = true }
vtop-meta = { workspace = true }
vtop-broker = { workspace = true }
vtop-observe = { workspace = true }
vtop-protocol = { workspace = true }
vtop-adapters = { workspace = true, default-features = false }
vtop-upload = { workspace = true }
vtop-state = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
rustix = { workspace = true }
rdkafka = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true, features = ["client-legacy"] }
rustls = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# The in-memory span exporter the trace tests assert against (#683).
opentelemetry_sdk = { workspace = true, features = ["testing"] }

# Integration tests live in the repo-root tests/ directory and are compiled as
# integration tests of this package.
[[test]]
name = "integration_file_to_minio"
path = "../../tests/integration_file_to_minio.rs"

[[test]]
name = "integration_replay"
path = "../../tests/integration_replay.rs"

[[test]]
name = "integration_state_recovery"
path = "../../tests/integration_state_recovery.rs"

[[test]]
name = "integration_manifest_rollback"
path = "../../tests/integration_manifest_rollback.rs"

[[test]]
name = "integration_kafka_to_minio"
path = "../../tests/integration_kafka_to_minio.rs"
required-features = ["kafka"]

[[test]]
name = "integration_metrics_endpoint"
path = "tests/integration_metrics_endpoint.rs"
