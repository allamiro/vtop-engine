[package]
name = "vtop-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Source adapters (Kafka, file, syslog spool) for the VTOP Engine."

[features]
default = []
kafka = ["dep:rdkafka"]
# Kerberos (SASL GSSAPI) for the Kafka source. It links the system Cyrus SASL,
# so it needs its development headers at build time and its library at run
# time. PLAIN, SCRAM and OAUTHBEARER don't need it.
kafka-gssapi = ["kafka", "rdkafka/sasl"]

[dependencies]
vtop-core = { workspace = true }
rdkafka = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }

[target.'cfg(unix)'.dependencies]
# renameat2(RENAME_NOREPLACE) / renameatx_np(RENAME_EXCL): delete_after_commit
# moves a file aside without ever replacing another (#619).
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# fcntl(F_SETLEASE): delete_after_commit deletes a file only on proof that no
# other process holds it open (#619, src/write_lease.rs).
libc = "0.2.189"

[dev-dependencies]
tempfile = { workspace = true }
