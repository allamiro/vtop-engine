[package]
name = "vtop-surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The operator-facing surface of the VTOP processes as data: every metric family a registry carries, and every command and flag of a command tree, for the snapshot gate (#719)."

[features]
# The command-tree half. Only the snapshot tests need it, so the libraries
# that hold a registry (vtop-core, vtop-observe) do not build clap for it.
clap = ["dep:clap"]

[dependencies]
prometheus = { workspace = true }
clap = { workspace = true, optional = true }
