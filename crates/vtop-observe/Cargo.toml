[package]
name = "vtop-observe"
description = "Shared operational surface for VTOP processes: Prometheus scrape endpoint, health/readiness probes, and structured-log initialization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy"] }
prometheus = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# OpenTelemetry export (#683), compiled into every binary; see `otel`.
hyper-rustls = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
rustix = { workspace = true, features = ["system", "process"] }
# The audit record (#694).
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
rcgen = { workspace = true }
tempfile = { workspace = true }
