[package]
name = "vtop-kafka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kafka wire-compatibility gateway over the native VTOP broker (#225)."

[dependencies]
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "sync", "time", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "net",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
