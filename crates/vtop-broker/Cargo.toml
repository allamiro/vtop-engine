[package]
name = "vtop-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Kafka-independent local broker and mTLS server for VTOP native segments."

[dependencies]
blake3 = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
uuid = { workspace = true }
vtop-log = { workspace = true }
vtop-meta = { workspace = true }
vtop-protocol = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tempfile = { workspace = true }

# The group-commit coordinator's model test (#752): built only with
# `RUSTFLAGS="--cfg vtop_loom"`, which swaps the coordinator's Mutex, Condvar
# and Arc for loom's so every interleaving of a small model is explored. A
# custom cfg name, not `loom`, so tokio and the rest of the tree build as
# they always do.
[target.'cfg(vtop_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vtop_loom)"] }
