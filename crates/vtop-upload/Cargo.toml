[package]
name = "vtop-upload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pluggable S3-compatible upload backends for the VTOP Engine with integrity verification before source acknowledgment."

[dependencies]
vtop-core = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
futures = { workspace = true }
# CLI-exec backends download to a temp file for get_object (verify-manifest).
tempfile = { workspace = true }

# The write path runs a command backend's tool in its own process group and
# kills that group, so a descendant holding the tool's pipes ends with it
# (#593).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
# The trait-surface guard in s3_native.rs parses this crate's src/ rather than
# scanning its text: layout-independent, and a macro is a node it can refuse.
syn = { workspace = true }
quote = { workspace = true }
