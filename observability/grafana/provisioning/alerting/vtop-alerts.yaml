apiVersion: 1

# The lab's alert rules, file-provisioned (#454). Provisioned rules are
# read-only in Grafana's UI, which is right for a rule: it should say the same
# thing in every lab. No contact point is provisioned, so a firing rule shows
# in Grafana's alert list and on the dashboard's state, and goes nowhere else —
# wire a contact point and a notification policy for a real deployment.
#
# The folder is named by title: Grafana's provisioner creates it at boot with
# a uid of its own (a folderUid key here is ignored; tested on 13.2), and the
# dashboard seeder adopts that folder rather than minting a second one with
# the same name - see seed-dashboards.sh.
groups:
  - orgId: 1
    name: vtop
    folder: VTOP
    interval: 1m
    rules:
      # The engine counts records a Kafka source lost to the broker's retention
      # before it read them: `vtop_retention_lost_records_total`, with a WARN
      # naming the rule when it happens (#98 confirmed it fires: 27,582,996
      # records in one pass when a 120 s retention outran an engine reading
      # 6k rec/s against a 200k rec/s inflow). Those records will never be
      # archived. Any increase is worth a page: the remedy — size retention
      # above worst-case lag, or catch the engine up — is operational, and
      # the loss is invisible on every other panel. The counter is
      # process-local like every counter this exporter serves: a restart in
      # the same scrape interval as a loss hides the loss from the counter;
      # the WARN line the adapter logs is the durable record (see README).
      - uid: vtop-retention-loss
        title: Records lost to retention
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # increase() needs two samples of a series; a counter child that
              # first appears already at N shows none. The engine primes every
              # (tenant, source_type) child at zero when it starts, so a loss is
              # a step from zero; the second branch admits a series that appears
              # unprimed (an engine older than the primer) at its first sample.
              expr: sum by (tenant, source_type) (increase(vtop_retention_lost_records_total[5m]) or (vtop_retention_lost_records_total unless vtop_retention_lost_records_total offset 5m))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        labels:
          severity: page
          service: vtop-engine
        annotations:
          summary: "VTOP lost records to Kafka retention"
          description: >-
            {{ printf "%.0f" $values.A.Value }} records on tenant {{ $labels.tenant }} ({{ $labels.source_type }})
            were removed by the broker's retention before the engine read them in the last
            five minutes. They will never be archived. Size retention above the worst-case
            lag and check consumer lag; the engine's log carries the WARN naming the rule.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#retention-loss"

      # The data plane's retention cannot bring a range under its bound (#561).
      # committed_floor: the oldest segment holds records a follower has not
      # acknowledged or the quorum mark has not passed, so disk grows past the bound
      # until replication catches up. active_segment: the bound is smaller than one
      # segment. Either way the range is over its bound and the pass is quiet about
      # it; 15 minutes rides out a follower restart.
      - uid: vtop-retention-blocked
        title: Range retention blocked
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: max by (topic, range, reason) (vtop_broker_retention_blocked)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 15m
        isPaused: false
        labels:
          severity: warning
          service: vtop-node
        annotations:
          summary: "Range retention is blocked"
          description: >-
            Range {{ $labels.range }} of {{ $labels.topic }} is above its retention bound and the
            pass cannot reclaim it ({{ $labels.reason }}). committed_floor: a follower or the
            quorum mark is behind - check vtop_broker_follower_lag_records. active_segment: the
            bound is smaller than one segment.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#retention-blocked"

      # A retention pass that fails outright is retried after the next append. The
      # gauge holds the LATEST pass's result, so it stays 1 until a pass succeeds:
      # this fires on a failure unresolved for ten minutes - with no appends, one
      # failure is enough (#561, review of #572).
      - uid: vtop-retention-failing
        title: Range retention failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: max by (topic, range) (vtop_broker_retention_last_pass_failed)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 10m
        isPaused: false
        labels:
          severity: warning
          service: vtop-node
        annotations:
          summary: "Range retention failure unresolved"
          description: >-
            The latest retention pass on range {{ $labels.range }} of {{ $labels.topic }} failed, and
            none has succeeded in the ten minutes since (a pass runs after each append, so an idle
            range keeps its last failure). The node's log names the error.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#retention-blocked"

      # The leader holds no replication stream to a follower. Two minutes rides out
      # a rolling restart; past that the range runs on fewer replicas than it was
      # sized for, and a quorum produce may already be failing (#561).
      - uid: vtop-follower-disconnected
        title: Follower disconnected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: min by (follower) (vtop_broker_follower_connected)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 2m
        isPaused: false
        labels:
          severity: warning
          service: vtop-node
        annotations:
          summary: "A follower is disconnected from its leader"
          description: >-
            The leader has had no replication stream to follower {{ $labels.follower }} for two
            minutes. The range is running with less redundancy than configured.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#replication-health"

      # A follower whose lag only grows will not catch up on its own: it is starved
      # of bandwidth or disk, and it holds the committed floor down, which blocks
      # retention (#561). A burst grows lag briefly; 15 minutes of growth does not.
      - uid: vtop-follower-lag-growing
        title: Follower lag growing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: max by (follower) (deriv(vtop_broker_follower_lag_records[10m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 15m
        isPaused: false
        labels:
          severity: warning
          service: vtop-node
        annotations:
          summary: "A follower's replication lag keeps growing"
          description: >-
            Follower {{ $labels.follower }} has fallen further behind for fifteen minutes. It holds
            the committed floor down, which blocks retention on the range.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#replication-health"

      # Each new fencing epoch is a leadership change. A few in half an hour means
      # leases are lapsing - stalls, skew, or a lease too short for the metadata
      # commit latency - and every failover costs a fence and a probe (#561).
      - uid: vtop-fencing-epoch-churn
        title: Fencing epoch churn
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # The epoch's RISE, not its number of changes (review of #572):
              # several leadership changes between two scrapes are one
              # change of the gauge but several epochs. The low end is the
              # highest epoch any replica knew as the window OPENED (review
              # of #574): a replica (re)started inside the window has no
              # sample there, so it cannot pull the low end up to today's
              # epoch and hide the churn, and a replica whose view lags
              # cannot pull it down. A range with no sample that old falls
              # back to its lowest epoch in the window. Zeros (a replica that
              # has not read metadata yet) are left out of the low end.
              expr: >-
                max by (topic, range) (max_over_time(vtop_broker_meta_fencing_epoch[30m]))
                - (
                  max by (topic, range) (max_over_time((vtop_broker_meta_fencing_epoch > 0)[5m:1m] offset 30m))
                  or max by (topic, range) (min_over_time((vtop_broker_meta_fencing_epoch > 0)[30m:1m]))
                )
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        labels:
          severity: warning
          service: vtop-node
        annotations:
          summary: "Range leadership is churning"
          description: >-
            Range {{ $labels.range }} of {{ $labels.topic }} changed leader {{ printf "%.0f" $values.A.Value }}
            times in thirty minutes. Check lease renewals, clock skew and metadata commit latency.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#replication-health"

      # After a promotion, fetch is refused until the new epoch's boundary marker is
      # quorum-acknowledged. That should take about one replication round trip; two
      # minutes is many leases' worth, and consumers are being refused meanwhile (#561).
      - uid: vtop-boundary-pending
        title: Promotion boundary stuck
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              expr: max by (topic, range) (vtop_broker_boundary_pending)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 2m
        isPaused: false
        labels:
          severity: page
          service: vtop-node
        annotations:
          summary: "A promoted leader cannot establish its boundary"
          description: >-
            Range {{ $labels.range }} of {{ $labels.topic }} has refused fetch for two minutes because its
            promotion boundary is not quorum-acknowledged. Check that a majority of followers is
            connected.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#replication-health"

      # A metadata leader that a quorum has not acknowledged for ten seconds is
      # partitioned from its peers; lease renewals cannot commit, and ranges start
      # failing over when their leases lapse (#561). -1 (not leading) never fires.
      - uid: vtop-meta-quorum-ack-age
        title: Metadata leader lost its quorum
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # -1 means "no acknowledgement yet" for a leader and "not a
              # leader" for everyone else (review of #572). A leader still at
              # -1 has never heard from a quorum, so it is lifted to 1e9 ms
              # here; a follower's -1 stays below the threshold.
              expr: >-
                max by (instance) (vtop_meta_raft_millis_since_quorum_ack)
                + on (instance)
                (max by (instance) (vtop_meta_raft_state{state="leader"})
                * (max by (instance) (vtop_meta_raft_millis_since_quorum_ack) == bool -1) * 1e9)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [10000]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 1m
        isPaused: false
        labels:
          severity: page
          service: vtop-node
        annotations:
          summary: "A metadata leader has lost its quorum"
          description: >-
            The metadata leader on {{ $labels.instance }} has not been acknowledged by a quorum for
            {{ printf "%.0f" $values.A.Value }} ms (about 1000000000 means never, since it became
            leader). Lease renewals cannot commit until it recovers or a new leader is elected.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#replication-health"

      # A group whose cursor is below the range's log start is told OffsetOutOfRange on its
      # next fetch: retention already removed records it had not read (#571).
      - uid: vtop-group-cursor-evicted
        title: Consumer group cursor below log start
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # The SERVING replica's log start (review of #574): replicas reclaim
              # independently, and after a failover the leader can hold records a
              # follower has dropped; the group fetches from the leader. Serving
              # means the lease AND a published boundary: a leaseholder whose
              # boundary is still pending refuses fetches, so nobody can be told
              # OffsetOutOfRange yet.
              expr: >-
                max by (topic, range) (vtop_broker_log_start_offset * on (instance, topic, range) group_left () ((vtop_broker_lease_active == 1) unless on (instance, topic, range) (vtop_broker_boundary_pending == 1))) - on (topic, range) group_right max by (topic, range, group) (vtop_meta_group_cursor_offset)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        labels:
          severity: page
          service: vtop-node
        annotations:
          summary: "A consumer group lost records to retention"
          description: >-
            Group {{ $labels.group }} is positioned below the log start of range {{ $labels.range }} of
            {{ $labels.topic }}, {{ printf "%.0f" $values.A.Value }} offsets short: the records between were
            retained no longer and the group will be told OffsetOutOfRange. Raise the retention bound or
            unstick the group, and account for the lost range.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#group-eviction"

      # Seconds until retention passes a group's cursor, at the rate the log start has moved
      # over 30 minutes; only ranges whose log start is moving, and only groups not already
      # passed (those page on the rule above) (#571).
      - uid: vtop-group-cursor-eviction-near
        title: Consumer group near eviction
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              instant: true
              # The serving replica's log start and its rate (review of #574) -
              # the rate over samples taken WHILE it served (a subquery of the
              # masked series), not over the reclamation it did as a follower.
              expr: >-
                ((max by (topic, range, group) (vtop_meta_group_cursor_offset) - on (topic, range) group_left max by (topic, range) (vtop_broker_log_start_offset * on (instance, topic, range) group_left () ((vtop_broker_lease_active == 1) unless on (instance, topic, range) (vtop_broker_boundary_pending == 1)))) / on (topic, range) group_left() (max by (topic, range) (deriv((vtop_broker_log_start_offset * on (instance, topic, range) group_left () ((vtop_broker_lease_active == 1) unless on (instance, topic, range) (vtop_broker_boundary_pending == 1)))[30m:1m])) > 0)) > 0
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [3600]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Error
        for: 15m
        isPaused: false
        labels:
          severity: warning
          service: vtop-node
        annotations:
          summary: "A consumer group will lose records to retention within the hour"
          description: >-
            At the rate retention is moving the log start of range {{ $labels.range }} of {{ $labels.topic }},
            it passes group {{ $labels.group }}'s cursor in about {{ printf "%.0f" $values.A.Value }} s. The
            group is too slow for the retention bound: speed it up, or raise the bound before it is
            told OffsetOutOfRange.
          runbook_url: "https://github.com/allamiro/vtop-engine/blob/main/observability/README.md#group-eviction"
