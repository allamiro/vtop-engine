# Tempo — single-binary, filesystem storage. LAB ONLY.
#
# The engine exports OTLP traces (#683) to Alloy, which forwards them here on
# 4317. The receivers below also accept OTLP directly, for a sender outside the
# lab's Alloy.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
