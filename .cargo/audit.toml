# cargo-audit configuration (read by `cargo audit`).
#
# CI runs `cargo audit` and fails on any advisory NOT listed here, so new or
# actionable vulnerabilities block the build. The advisories below are
# unfixable transitive entries with documented justification; each MUST be
# re-evaluated when its upstream ships a fix (see docs/SECURITY_MODEL.md §13).

[advisories]
ignore = [
    # rsa — Marvin timing side-channel. No fixed upgrade exists upstream.
    # `rsa` is pulled ONLY by sqlx's optional MySQL driver, which this project
    # does not enable (sqlite-only). It is a Cargo.lock entry and is NOT
    # compiled or executed in any VTOP build (`cargo tree -i rsa` is empty).
    "RUSTSEC-2023-0071",

    # rkyv 0.7.46 — archive validation can permit out-of-bounds reads for
    # archived Rc/Arc values. It is an optional rust_decimal feature pulled
    # into Cargo.lock through openraft -> byte-unit, but the feature is not
    # enabled and the crate is absent from every build graph
    # (`cargo tree --target all -i rkyv@0.7.46` is empty). rust_decimal 1.42.1
    # still pins the vulnerable major; remove this when upstream adopts
    # rkyv >=0.8.17.
    "RUSTSEC-2026-0235",

    # rustls-webpki 0.101.x (3 advisories). Pulled transitively by
    # aws-smithy-http-client 1.1.13, whose `__rustls` feature hard-depends on
    # the legacy hyper-rustls 0.24 -> rustls 0.21 -> rustls-webpki 0.101 stack.
    # No feature flag or `cargo update` removes it in the current AWS SDK; it
    # requires an upstream aws-smithy-http-client release that drops
    # hyper-rustls 0.24. Re-check and remove these on the next AWS SDK bump.
    "RUSTSEC-2026-0098", # name constraints accepted for URI names
    "RUSTSEC-2026-0099", # name constraints accepted for wildcard certs
    "RUSTSEC-2026-0104", # reachable panic parsing a CRL

    # lru 0.16.4 — potential use-after-free from a lack of panic safety in
    # `LruCache::pop()`. UNSOUNDNESS, not a vulnerability, and it is reachable
    # only if a cached value's `Drop` panics during eviction.
    #
    # No fixed release exists: 0.16.4 IS the newest published version, so there
    # is nothing to upgrade to (`cargo update -p lru` moves nothing, and
    # `--precise 0.16.5` reports no such package). It reaches this build solely
    # through aws-sdk-s3 1.137.0, whose cached values are SDK-internal types
    # this project neither supplies nor controls. Re-evaluate when upstream
    # publishes a fix, and on the next AWS SDK bump.
    "RUSTSEC-2026-0253",

    # unsafe-libyaml 0.2.11 — unmaintained (the upstream repository is archived).
    # UNMAINTAINED, not a vulnerability: no exploitable defect is reported, but
    # none will be fixed upstream either. It arrives only through `serde_yaml`
    # 0.9, which is itself deprecated and is what parses the engine, node and
    # CLI YAML configuration — operator-written files, not network input.
    # The advisory points at safe-Rust YAML parsers (saphyr / serde-saphyr);
    # moving to one is a deliberate migration of every config type, not a
    # version bump, and is follow-up work. Re-evaluate when it lands.
    "RUSTSEC-2024-0449",

    # crypto-bigint 0.5.5 — multiple timing-variability issues in operations
    # intended to be constant-time. Fixed in crypto-bigint >=0.7.6, a major
    # version bump. It reaches this build only through aws-sigv4 1.4.5 and
    # elliptic-curve 0.13.8, both of which require the 0.5.x line; nothing in
    # the current AWS SDK / RustCrypto graph permits 0.7 (`cargo update -p
    # crypto-bigint` moves it nowhere). The timing channel requires an attacker
    # measuring operations over secret key material; VTOP exercises this path
    # only for AWS SigV4/SigV4a request signing. Remove this exception when the
    # AWS signing / RustCrypto stack adopts crypto-bigint >=0.7.6
    # (elliptic-curve >=0.14).
    "RUSTSEC-2026-0387",

    # libsqlite3-sys 0.30.1 — bundles a SQLite affected by CVE-2026-119375.
    # Fixed in libsqlite3-sys >=0.39.0 (SQLite 3.54), reachable only through a
    # newer sqlx: sqlx-sqlite 0.9.0 caps libsqlite3-sys at <0.38, so no
    # `cargo update` reaches the fix. SQLite here parses the engine's *local*
    # state-store database (operator-owned, on the host), never network input,
    # so a crafted-database CVE is not reachable by a remote party. Remove this
    # exception when sqlx ships a release depending on libsqlite3-sys >=0.39.
    "RUSTSEC-2026-0459",

    # pin-utils 0.1.0 — UNMAINTAINED (upstream repository archived; 0.1.1 is the
    # final release and no fix will be published). Not a vulnerability.
    # `cargo audit` treats this as a non-failing warning, but cargo-deny's
    # `unmaintained` check fails on it, so it is ignored in both files (as with
    # RUSTSEC-2024-0449 above). It reaches the build only through
    # aws-smithy-http / aws-smithy-runtime. Remove when the AWS SDK drops its
    # dependency on pin-utils.
    "RUSTSEC-2026-0441",
]
