# CI render of a secret file from an external manager (#733), on top of the
# default identities: a Secret (for example one External Secrets Operator
# keeps in sync) mounted as a whole volume with defaultMode 0400. With the
# chart's fsGroup the kubelet makes the files 0440, owned by root and group
# 10001. Nothing here is a credential: the Secret names refer to objects that
# do not exist anywhere. See helm/vtop/README.md, "Secrets from an external
# manager".
cluster:
  id: 11111111-2222-3333-4444-555555555555
tls:
  metaSecretName: vtop-meta-tls
  dataSecretName: vtop-data-tls
data:
  nodeUuids:
    - aaaaaaaa-0000-0000-0000-0000000000a1
    - aaaaaaaa-0000-0000-0000-0000000000a2
    - aaaaaaaa-0000-0000-0000-0000000000a3
  range:
    topic: telemetry
    rangeId: aaaaaaaa-0000-0000-0000-0000000000c1
  segmentId: aaaaaaaa-0000-0000-0000-0000000000d1
  principalId: aaaaaaaa-0000-0000-0000-0000000000ce
meta:
  # Admin authorization is on by default (#732, M2).
  adminAuthorization:
    operatorCommonNames: [operator]

extraVolumes:
  - name: external-secret
    secret:
      secretName: vtop-external-secret
      defaultMode: 0400
extraVolumeMounts:
  - name: external-secret
    mountPath: /etc/vtop/external
    readOnly: true
