# CI render identities. The chart refuses to render without identities and
# Secret names (they are never defaulted — issue #81), so CI supplies
# syntactically valid dummies to prove the chart's happy path renders and
# validates. These mirror the working invocation documented in
# helm/vtop/README.md; nothing here is a credential — the Secret names refer
# to objects that do not exist anywhere.
cluster:
  id: 11111111-2222-3333-4444-555555555555
tls:
  metaSecretName: vtop-meta-tls
  dataSecretName: vtop-data-tls
data:
  nodeUuids:
    - aaaaaaaa-0000-0000-0000-0000000000a1
    - aaaaaaaa-0000-0000-0000-0000000000a2
    - aaaaaaaa-0000-0000-0000-0000000000a3
  range:
    topic: telemetry
    rangeId: aaaaaaaa-0000-0000-0000-0000000000c1
  segmentId: aaaaaaaa-0000-0000-0000-0000000000d1
  principalId: aaaaaaaa-0000-0000-0000-0000000000ce

# CI-ONLY SCHEDULING SIZE, never a recommendation. The chart's own defaults
# (500m/512Mi requested) are what a real deployment should ask for, but this
# test stands up SEVEN pods at once — three standalone, one neighbour, three
# replicated — and 3.5 CPU of requests does not fit a two-vCPU runner. The
# scheduler simply leaves one pod Pending, and its peers then fail DNS
# resolution and crash-loop, which is the same failure reported three layers
# from its cause (the note on the kind job in ci.yml records the diagnosis).
#
# Requests are a SCHEDULING claim, not a throttle, so lowering them here costs
# the test nothing: the limits stay at the chart's defaults, and a pod may burst
# to them exactly as in production. What it buys is a run that does not depend
# on which runner size the job happens to land on.
resources:
  requests:
    cpu: 100m
    memory: 256Mi

# Raft timers for CI (#469). A kind cluster on a shared runner is not a
# datacenter LAN: with the chart's defaults (60 ms heartbeats, 300-600 ms
# elections) a loaded runner misses replication deadlines for minutes at a
# time, and a linearizable admin read — which needs the leader to confirm a
# quorum — is refused for as long as that lasts. The smoke then cannot tell
# "the range did not move" from "the read never landed". Widened here and
# only here: a real deployment keeps the chart's defaults, which are sized
# for a network, not for a CI runner sharing a core with a compiler.
meta:
  timers:
    electionTimeoutMinMs: 1500
    electionTimeoutMaxMs: 3000
    heartbeatIntervalMs: 250
