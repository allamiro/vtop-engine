{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vtop.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vtop.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Belt and braces with the pod spec: vtop-node never calls the Kubernetes
# API, so nothing should ever mount a token for this identity.
automountServiceAccountToken: false
{{- end }}
