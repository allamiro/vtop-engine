# One fully rendered config per pod ordinal, all in one ConfigMap. Rendering
# per ordinal at template time (rather than sed-substituting placeholders in
# an initContainer) keeps every byte of every node's config visible in
# `helm template` output and covered by the pod template's checksum/config
# annotation — a config change rolls the StatefulSet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vtop.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vtop.labels" . | nindent 4 }}
data:
{{- if eq (include "vtop.deploymentMode" .) "separated" }}
{{- /* Two tiers, two file families (#287): meta-<i>.yaml for the metadata
       tier's pods and data-<i>.yaml for the data tier's, each the ROLE
       config its `vtop-node meta`/`data` command deserializes. */}}
{{- range $i := until (int (include "vtop.metaReplicaCount" .)) }}
  meta-{{ $i }}.yaml: |
{{ include "vtop.metaTierConfig" (dict "root" $ "ordinal" $i) | indent 4 }}
{{- end }}
{{- range $i := until (int (include "vtop.dataReplicaCount" .)) }}
  data-{{ $i }}.yaml: |
{{ include "vtop.dataTierConfig" (dict "root" $ "ordinal" $i) | indent 4 }}
{{- end }}
{{- else }}
{{- range $i := until (int .Values.replicaCount) }}
  node-{{ $i }}.yaml: |
{{ include "vtop.nodeConfig" (dict "root" $ "ordinal" $i) | indent 4 }}
{{- end }}
{{- end }}
