# Client-facing Service.
#
# Carries the observability plane unconditionally: metrics scraping is
# target-agnostic, so round-robin is exactly right for it.
#
# It does NOT carry the admin plane by default, and that is a correctness
# constraint rather than caution. Every pod presents its own certificate,
# whose SAN is that pod's headless FQDN — so a client reaching a
# Service-selected pod cannot know which name to verify against, and TLS
# fails before `vtopctl meta init` sends a byte. A load-balanced endpoint and
# per-pod certificate identity are incompatible unless the operator issues
# certificates that ALSO carry this Service's DNS name as a shared SAN, which
# the chart cannot verify and must not assume.
#
# Set `service.exposeMetaAdmin: true` once your certificates carry that shared
# SAN. Otherwise bootstrap against a specific pod through the headless
# Service, which NOTES.txt prints.
#
# The native produce/fetch plane is never here: it is per-pod (each pod is an
# independent standalone range), and a round-robin Service would hand clients
# a random range.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vtop.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vtop.labels" . | nindent 4 }}
    # Distinguishes this Service from the headless one so the ServiceMonitor
    # selects exactly one and pods are not scraped twice.
    vtop.allamiro.io/service: client
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "vtop.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.service.exposeMetaAdmin }}
    - name: meta-admin
      port: {{ .Values.ports.metaAdmin }}
      targetPort: meta-admin
    {{- end }}
    - name: obs
      port: {{ .Values.ports.observability }}
      targetPort: obs
