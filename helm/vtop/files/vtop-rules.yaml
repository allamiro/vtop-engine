# VTOP engine alert rules (Prometheus rule format).
#
# Load this file with `rule_files:` in prometheus.yml, or through the chart's
# PrometheusRule (helm/vtop, metrics.prometheusRule.enabled). The chart ships
# a byte-for-byte copy at helm/vtop/files/vtop-rules.yaml; CI fails when the
# two differ, so edit this file and copy it there.
#
# Every alert is unit-tested in tests/vtop-rules.test.yaml (`promtool test
# rules`), and its runbook_url points at a section of
# docs/operate/runbooks.md (scripts/check-alert-runbooks.py checks both).
#
# Thresholds. These are defaults to tune, not measured values; the SLO page
# (docs/operate/slos.md) says what each one protects. Each is written once,
# in the one rule that uses it. PromQL cannot take a range or a duration
# from another series, so the windows are literals. A threshold kept in a
# recording rule would make each alert depend silently on another rule
# being loaded, so the numbers are literals too.
#
#   Name                         Default  Used in
#   verification_window          10m      VtopVerificationFailures
#   no_commits_quiet_window      10m      VtopNoCommits (no commit in this window...)
#   no_commits_hold              20m      VtopNoCommits (...held this long: 30 min in all)
#   replay_rate_window           15m      VtopReplayRateSpike
#   replay_rate_floor            0.01/s   VtopReplayRateSpike (about 9 replays in 15 min)
#   replay_baseline_window       6h       VtopReplayRateSpike
#   replay_baseline_multiple     3        VtopReplayRateSpike
#   lag_deriv_window             15m      VtopSourceLagGrowing
#   lag_rising_hold              30m      VtopSourceLagGrowing
#   lag_consumer_group           vtop-engine  VtopSourceLagGrowing (sources.kafka.consumer_group)
#   object_lock_window           15m      VtopObjectLockCheckFailed
#   object_lock_fallback_window  1h       VtopObjectLockFallback
#   retention_loss_window        15m      VtopRetentionLoss
#   replay_refused_window        15m      VtopSourceReplayRefused
#   multipart_kept_offset        30h      VtopMultipartSessionsPiling (24 h abandon window + 6 h sweep interval)
#   multipart_kept_window        6h       VtopMultipartSessionsPiling (sessions kept 30-36 h ago)
#   multipart_cleared_window     36h      VtopMultipartSessionsPiling (no resume or sweep in this window)
#   multipart_hold               1h       VtopMultipartSessionsPiling
#   state_write_seconds          1s       VtopStateStoreWritesSlow (a bucket bound of the histogram)
#   state_write_slow_share       0.05     VtopStateStoreWritesSlow (more than 5% of batches over it...)
#   state_write_window           15m      VtopStateStoreWritesSlow
#   state_write_hold             15m      VtopStateStoreWritesSlow (...held this long)
#
# Severity: `page` wakes someone (data is missing, at risk, or not being
# archived); `ticket` is for working hours (degraded, or a setting to fix).
#
# Counters are per engine process and restart at zero. Every rule keeps the
# series' own labels (job, instance, tenant, source_type, format, ...), so an
# alert names the engine and the stream it is about.

groups:
  - name: vtop-engine
    rules:
      # The commit rule's own failure: a stored copy did not match its
      # manifest, so the batch was not committed. The counter is not primed:
      # its series appears at the first failure, and increase() needs two
      # samples, so the second branch fires on a series that is non-zero now
      # and did not exist one window ago.
      - alert: VtopVerificationFailures
        expr: |
          increase(vtop_verification_failures_total[10m]) > 0
          or
          (vtop_verification_failures_total > 0 unless vtop_verification_failures_total offset 10m)
        labels:
          severity: page
        annotations:
          summary: "Verification failed for {{ $labels.tenant }}/{{ $labels.source_type }}/{{ $labels.format }} on {{ $labels.instance }}"
          description: "A stored object or manifest did not match what the engine uploaded. The batch was not committed and its data is still in the source. Find the batch id in the engine's verification WARN lines, check the object store, then run vtopctl scrub over the affected range."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopverificationfailures"

      # An engine holding data that has committed nothing. vtop_inflight_batches
      # is the engine's count of batches still accumulating; it stays at zero
      # for an idle source, so an idle engine never pages. The fallback to
      # inflight*0 makes an engine that has not committed once since it
      # started count as zero commits instead of having no series at all.
      # The 20m hold also covers the first batches after a start.
      - alert: VtopNoCommits
        expr: |
          (
            sum by (job, instance) (increase(vtop_commits_total[10m]))
            or on (job, instance)
            max by (job, instance) (vtop_inflight_batches) * 0
          ) == 0
          and on (job, instance)
          max by (job, instance) (max_over_time(vtop_inflight_batches[10m])) > 0
        for: 20m
        labels:
          severity: page
        annotations:
          summary: "No batch committed for 30 minutes on {{ $labels.instance }} while data is waiting"
          description: "The engine has batches in memory but has not committed one for 30 minutes, so nothing is being archived and source progress is not moving. Check the engine's WARN and ERROR lines and vtopctl status for where batches stop (upload, verify or the state store)."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopnocommits"

      # Batches marked REPLAY_REQUIRED and re-read from source, well above
      # both a floor and this stream's own recent rate. The baseline window
      # ends where the short window starts, so a spike does not raise its own
      # baseline; a stream with no baseline yet compares against zero.
      - alert: VtopReplayRateSpike
        expr: |
          rate(vtop_replay_required_total[15m]) > 0.01
          and
          rate(vtop_replay_required_total[15m])
            > 3 * (
              rate(vtop_replay_required_total[6h] offset 15m)
              or
              rate(vtop_replay_required_total[15m]) * 0
            )
        labels:
          severity: ticket
        annotations:
          summary: "Replays of {{ $labels.tenant }}/{{ $labels.source_type }}/{{ $labels.format }} on {{ $labels.instance }} are well above their usual rate"
          description: "Batches are failing after they were sealed and are being re-read from the source. Nothing is lost while the source still holds the data, but the work is repeated. Read the engine's WARN lines for why batches fail (upload, verification, Object Lock or the state store) and fix that cause."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopreplayratespike"

      # The engine has no lag metric of its own. This reads
      # kafka_consumergroup_lag from kafka-exporter (the lab runs
      # danielqsj/kafka-exporter, docker-compose.observability.yml), and is
      # silent without it. Set the consumergroup matcher to your
      # sources.kafka.consumer_group (default vtop-engine). Partitions are
      # summed per exporter (job, instance), which is per Kafka cluster: a
      # cluster whose lag falls must not cancel one whose lag rises, and the
      # alert has to say which cluster it is about.
      - alert: VtopSourceLagGrowing
        expr: |
          sum by (job, instance, consumergroup, topic) (deriv(kafka_consumergroup_lag{consumergroup="vtop-engine"}[15m])) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Kafka lag of consumer group {{ $labels.consumergroup }} on {{ $labels.topic }} ({{ $labels.instance }}) has risen for 30 minutes"
          description: "The engine is reading this topic more slowly than it is written. If the lag reaches the topic's retention, records are deleted before they are archived (VtopRetentionLoss). Check upload throughput and throttling, then scale the engine or raise the topic's retention."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopsourcelaggrowing"

      # Set once at startup: upload.require_strong_verification is false, so
      # verification compares sizes only and same-size corruption commits.
      - alert: VtopSizeOnlyVerification
        expr: |
          vtop_verification_mode{mode="size_only"} == 1
        labels:
          severity: ticket
        annotations:
          summary: "Engine {{ $labels.instance }} verifies tenant {{ $labels.tenant }} by size only"
          description: "upload.require_strong_verification is false, so a stored object of the right size but wrong content is committed. Turn on strong verification (a backend and checksum that can hash the stored bytes), or record why this deployment accepts size-only checks."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopsizeonlyverification"

      # Primed at zero at startup when upload.object_lock is set, so
      # increase() sees the first failure once Prometheus has scraped the
      # zero. A check can fail before that first scrape; the second branch
      # catches a series first seen non-zero. Any result but ok failed a
      # batch.
      - alert: VtopObjectLockCheckFailed
        expr: |
          increase(vtop_object_lock_checks_total{result!="ok"}[15m]) > 0
          or
          (vtop_object_lock_checks_total{result!="ok"} > 0 unless vtop_object_lock_checks_total{result!="ok"} offset 15m)
        labels:
          severity: page
        annotations:
          summary: "Object Lock check failed ({{ $labels.result }}) for tenant {{ $labels.tenant }} on {{ $labels.instance }}"
          description: "A written or reused object or manifest is not under the retention upload.object_lock asks for, or its bucket has no Object Lock. The batch failed and will be replayed. Read the object_lock_check_failed or object_lock_bucket_refused ERROR line, then fix the bucket or the credentials' retention permissions."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopobjectlockcheckfailed"

      # A replay found the object already archived for its range not locked
      # as configured and wrote a fresh locked one under its attempt key, or
      # withheld that write because the fresh object it wrote moments ago is
      # not usable either (#709). Nothing failed to be archived, so a ticket,
      # not a page: but an object that should be locked is not, or the store
      # is not keeping locks. fallback_lock_elapsed (a lock that ended before
      # its range was replayed) is storage cost, not a finding, and is left
      # out. The counter is not primed (its series appears at the first
      # decision), so the second branch catches a series first seen non-zero.
      - alert: VtopObjectLockFallback
        expr: |
          increase(vtop_object_key_decisions_total{decision=~"fallback_unlocked|fallback_lock_mode|fallback_hold_missing|lock_withheld"}[1h]) > 0
          or
          (vtop_object_key_decisions_total{decision=~"fallback_unlocked|fallback_lock_mode|fallback_hold_missing|lock_withheld"} > 0 unless vtop_object_key_decisions_total{decision=~"fallback_unlocked|fallback_lock_mode|fallback_hold_missing|lock_withheld"} offset 1h)
        labels:
          severity: ticket
        annotations:
          summary: "Object Lock fallback ({{ $labels.decision }}) for tenant {{ $labels.tenant }} on {{ $labels.instance }}"
          description: "A replay found the object already archived for its range not locked as upload.object_lock asks (no lock, the other mode, or no legal hold) and wrote a fresh locked object under its attempt key, leaving the old one as it is; or (lock_withheld) the fresh object it wrote is not usable either, so nothing was written and the batch failed. Read the object_key_fallback WARN line for the two keys and the reason, then check the bucket's Object Lock configuration and the credentials' retention and legal-hold permissions."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopobjectlockfallback"

      # Records Kafka retention deleted before the engine read them: never
      # archived. Primed at zero at startup; the second branch also catches a
      # series that first appears with the loss (an engine before the primer).
      - alert: VtopRetentionLoss
        expr: |
          increase(vtop_retention_lost_records_total[15m]) > 0
          or
          (vtop_retention_lost_records_total > 0 unless vtop_retention_lost_records_total offset 15m)
        labels:
          severity: page
        annotations:
          summary: "Source retention deleted records {{ $labels.instance }} had not read ({{ $labels.tenant }}/{{ $labels.source_type }})"
          description: "Records were removed by the source's retention before the engine read them. They will never be archived. Read the WARN line for the topic and partition, record the loss, and raise the topic's retention above the engine's worst-case lag."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopretentionloss"

      # A failed range the source could not hand back for re-reading: a range
      # missing from the archive. Primed at zero at startup; the second
      # branch catches a refusal before Prometheus's first scrape, whose
      # series is first seen non-zero.
      - alert: VtopSourceReplayRefused
        expr: |
          increase(vtop_source_replay_refused_total[15m]) > 0
          or
          (vtop_source_replay_refused_total > 0 unless vtop_source_replay_refused_total offset 15m)
        labels:
          severity: page
        annotations:
          summary: "A failed range could not be re-read from {{ $labels.source_type }} on {{ $labels.instance }}"
          description: "A batch failed and its source refused to hand the range back (for a file: truncated, rewritten, or rotated away and removed). That range is missing from the archive. The path is in the ERROR line beside the count; recover the data from another copy if one exists."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopsourcereplayrefused"

      # Recovery could not write its replay decision for a range to the state
      # store, so it held the range instead of rewinding it (#639, #782).
      # Nothing is lost (the range is read again with the ranges above it),
      # but a state store refusing writes needs a person. The counter is not
      # primed: its series appears with the first hold, at startup, and stays
      # flat until the engine restarts, so increase() would never see it.
      # Fire on the value; it clears at a restart that holds nothing.
      # reason="newer_manifest" holds are VERIFIED batches a newer release
      # wrote: an upgrade question, not this alert.
      - alert: VtopRecoveryLedgerWriteFailed
        expr: |
          vtop_recovery_held_total{reason="ledger_write_failed"} > 0
        labels:
          severity: page
        annotations:
          summary: "Recovery on {{ $labels.instance }} could not record its replay decision for {{ $labels.tenant }}/{{ $labels.source_type }} ranges"
          description: "At startup the state store refused recovery's write of a replay decision, so recovery held those ranges instead of rewinding them. Nothing is lost: each held range is read again with the ranges above it, which are archived twice. Check the state store's disk, permissions and connectivity; the batch ids are in the ERROR lines beside the count. The alert clears when the engine restarts without a hold."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtoprecoveryledgerwritefailed"

      # Sessions kept after failed uploads that the sweep should have
      # aborted by now, with none resumed and none swept: incomplete uploads
      # pile up in the bucket, where their parts are billed. The sweep aborts
      # a session once it is older than upload.multipart_abandon_after_secs
      # (default 24 h) and runs every quarter of that window (6 h), so a
      # session kept 30 to 36 hours ago is one a working sweep has already
      # aborted; a younger one is still waiting for it and is not an alert.
      # With a different abandon window, scale the offset (window + window/4)
      # and the second lookback (offset + 6h) to match. The outcomes are
      # primed at zero at startup.
      - alert: VtopMultipartSessionsPiling
        expr: |
          sum by (job, instance) (increase(vtop_multipart_sessions_total{outcome="kept_after_failure"}[6h] offset 30h)) > 0
          unless on (job, instance)
          sum by (job, instance) (increase(vtop_multipart_sessions_total{outcome=~"resumed|swept"}[36h])) > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "Incomplete multipart uploads on {{ $labels.instance }} are kept and never resumed or swept"
          description: "Failed uploads kept their multipart sessions for the replay, but for over a day none was resumed and none swept, so their parts stay billed in the bucket. Check the engine's multipart_sweep_failed events and the bucket's lifecycle rule for incomplete uploads."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopmultipartsessionspiling"

      # The state store's write latency (the SLO on docs/operate/slos.md):
      # the share of committed batches whose ledger writes took more than a
      # second in all, from vtop_stage_duration_seconds{stage="state_write"},
      # observed once per committed batch with the time of every ledger write
      # it made (about eight, two of them synced). 1 s is a bucket bound of
      # that histogram; le is matched both as the engine writes it ("1") and
      # as Prometheus 3 stores a classic histogram's bound ("1.0"). No batch
      # in the window is no data, not a miss: the division has no result.
      - alert: VtopStateStoreWritesSlow
        expr: |
          (
            sum by (job, instance) (rate(vtop_stage_duration_seconds_count{stage="state_write"}[15m]))
            -
            sum by (job, instance) (rate(vtop_stage_duration_seconds_bucket{stage="state_write", le=~"1|1.0"}[15m]))
          )
          /
          sum by (job, instance) (rate(vtop_stage_duration_seconds_count{stage="state_write"}[15m]))
          > 0.05
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "State-store writes on {{ $labels.instance }} are slow: more than 5% of batches spend over a second on them"
          description: "Over 15 minutes, more than 5% of the committed batches spent more than a second in their ledger writes, for 15 minutes on end. Every batch waits for its writes before the next stage, so archiving slows and the source falls behind. Check the state store: the disk under the SQLite ledger, or the PostgreSQL server's load, locks and network."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopstatestorewritesslow"

      # A data node's replica whose epoch history broke (#881): a write to its
      # epoch journal failed, a full disk above all, so it answers every fence
      # with no history and no leader gives it a session. The range runs a
      # replica short until an operator repairs it; it never heals itself.
      # Set once, when the write fails, and stays set until the replica is
      # repaired, so a minute rides out nothing but a scrape race.
      - alert: VtopEpochHistoryBroken
        expr: |
          max by (job, instance, topic, range) (vtop_broker_epoch_history_broken) == 1
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Replica {{ $labels.instance }} of range {{ $labels.range }} ({{ $labels.topic }}) lost its epoch history"
          description: "A write to this replica's epoch journal failed (a full disk, usually), so it answers every fence and promotion probe with no history: no leader gives it a replication session and no promotion counts it, and the range runs with one replica fewer than configured until it is repaired. Its log has an ERROR line naming the failed write. Free space on its data directory, then run vtopctl node repair against a replica whose history is intact."
          runbook_url: "https://allamiro.github.io/vtop-engine/operate/runbooks/#vtopepochhistorybroken"
