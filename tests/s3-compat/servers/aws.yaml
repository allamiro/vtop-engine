# AWS S3 itself, in us-east-1, reached by the opt-in
# .github/workflows/s3-aws.yml (#722): virtual-host addressing, verified TLS,
# and no endpoint override, so the SDK finds the regional endpoint itself.
# Settled from its first run, run 45127198938 on 2026-11-23 at a7b4491e
# (v0.11.1), in both SDK checksum modes, with every capability unknown: every
# case that ran passed. The capabilities only the multipart fault-injection
# cases name stay unknown: those cases cannot run against AWS (not_run), so
# nothing has tested them there. It never gates a pull request and is never
# a branch-protection check: the workflow runs only on its schedule and by
# hand, and the release gate takes one run per release (row B1, decided
# 2026-11-23).
id: aws
name: AWS S3
gating: false
sdk_default_endpoint: true
capabilities:
  put_get_head: pass
  # The workflow runs virtual-host addressing only (decision D12).
  path_style: not_applicable
  virtual_host: pass
  checksum_sha256_enforced: pass
  checksum_sha256_returned: pass
  checksum_crc32_default: pass
  multipart: pass
  multipart_abort:
    state: unknown
    note: "Not tested on AWS: only the multipart fault-injection cases name it, and their forwarder needs a plain-HTTP VTOP_TEST_S3_ENDPOINT, so against AWS they are not run."
  multipart_list_uploads:
    state: unknown
    note: "Not tested on AWS: only the multipart fault-injection cases name it, and their forwarder needs a plain-HTTP VTOP_TEST_S3_ENDPOINT, so against AWS they are not run."
  multipart_resume:
    state: unknown
    note: "Not tested on AWS: only the multipart fault-injection cases name it, and their forwarder needs a plain-HTTP VTOP_TEST_S3_ENDPOINT, so against AWS they are not run."
  versioning: pass
  object_lock: pass
  object_lock_enforced: pass
  object_lock_retention_clear:
    state: not_applicable
    note: "The leg's role deliberately lacks s3:BypassGovernanceRetention, which clearing a retention needs, so the case that clears a receipt's retention to see the scrub report it cannot run there. For the same reason the engine case that replays over an ended lock (it shortens a governance retention) is not run on AWS."
  conditional_put: pass
