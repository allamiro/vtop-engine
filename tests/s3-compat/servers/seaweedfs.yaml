# SeaweedFS 4.53, master, volume, filer and S3 in one container
# (docker/s3-servers/seaweedfs).
# Settled from a first run of every live case with every capability unknown
# (#722): all passed. New to the matrix, so not gating yet (D11): it moves to
# gating: true in its own PR after ten consecutive runs match this file.
id: seaweedfs
name: SeaweedFS
gating: false
capabilities:
  put_get_head: pass
  path_style: pass
  # The lab is reached by path style only (decision D12).
  virtual_host: not_applicable
  # Asked by the probes (#722): a wrong SHA-256 is refused (BadDigest), and
  # If-None-Match: * is honoured (412).
  checksum_sha256_enforced: pass
  checksum_sha256_returned: pass
  checksum_crc32_default: pass
  multipart: pass
  multipart_abort: pass
  multipart_list_uploads: pass
  multipart_resume: pass
  versioning: pass
  object_lock: pass
  object_lock_enforced: pass
  object_lock_retention_clear:
    state: not_applicable
    note: "PutObjectRetention with an empty retention answers 400 InvalidRequest, so the case that clears a receipt's retention to see the scrub report it cannot run here. VTOP never clears a retention; only that test does."
  conditional_put: pass
