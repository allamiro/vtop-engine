# VTOP for the whole-replica-set crash benchmark (#599), layered on compose.vtop.yml: the three nodes'
# home directories (their data) are bind mounts under ${CRASH_DATA_ROOT}, one filesystem for all
# three, and the CPUs per node come from ${CRASH_NODE_CPUS}. Every engine setting is the shipped one, except in
# the two group-commit configurations (#752), which run the leader with crash/leader-group-commit-{on,off}.yaml:
# crash.py names the leader's file in ${VTOP_LEADER_CONFIG}, which compose.vtop.yml's leader mount reads (the shipped
# leader.yaml when it is unset). The file is the shipped leader.yaml plus a `group_commit:` section and nothing
# else; the followers never get one.
services:
  vtop-1:
    cpus: ${CRASH_NODE_CPUS:-2}

  vtop-2:
    cpus: ${CRASH_NODE_CPUS:-2}
  vtop-3:
    cpus: ${CRASH_NODE_CPUS:-2}
volumes:
  vtop-1-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${CRASH_DATA_ROOT:?set CRASH_DATA_ROOT}/vtop-1" }
  vtop-2-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${CRASH_DATA_ROOT:?set CRASH_DATA_ROOT}/vtop-2" }
  vtop-3-data:
    driver: local
    driver_opts: { type: none, o: bind, device: "${CRASH_DATA_ROOT:?set CRASH_DATA_ROOT}/vtop-3" }
networks:
  bench:
    name: kc-crash-vtop-bench
