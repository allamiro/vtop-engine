# VTOP for the failover comparison (#597): three co-located nodes, each a
# metadata Raft voter plus a CANDIDATE replica of the one range (configs in
# vtop/ha-node-*.yaml), the Helm chart's replicated shape. Leadership follows
# the metadata lease, so killing the leader is a failover, not a stop.
#
# Fairness rule 1: EXACTLY the per-node limits compose.kafka.yml gives each
# Kafka broker (2 CPUs, 2 GiB, no swap, a named volume on the same Docker VM
# disk); failover.py refuses to start when they differ, as run.py does.
#
# VTOP_IMAGE is the image failover.py built from the commit under test;
# VTOP_TLS_DIR is the per-run certificate directory it minted (never
# committed). Each node mounts only the CA certificate and its OWN two key
# pairs, file by file: never another node's key, and the CA key is deleted
# once the leaves are minted. No healthcheck gates `up`: a co-located node is ready only once
# its metadata group is initialised, which failover.py does after `up`.
name: kc-vtop-ha

x-node: &node
  image: ${VTOP_IMAGE:?set VTOP_IMAGE to the vtop-bench image failover.py built}
  entrypoint: ["vtop-node", "node", "--config", "/etc/vtop/node.yaml"]
  cpus: 2
  mem_limit: 2g
  memswap_limit: 2g
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  # The same hardening as compose.kafka.yml's brokers (fairness rule 1): no
  # capabilities (the node listens above 1024 as user vtop), no setuid gain.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [bench]

services:
  vtop-1:
    <<: *node
    hostname: vtop-1
    volumes:
      - "./vtop/ha-node-1.yaml:/etc/vtop/node.yaml:ro"
      - "${VTOP_TLS_DIR:?set VTOP_TLS_DIR to the minted certificate directory}/ca.pem:/etc/vtop/tls/ca.pem:ro"
      - "${VTOP_TLS_DIR}/meta-1.pem:/etc/vtop/tls/meta-1.pem:ro"
      - "${VTOP_TLS_DIR}/meta-1-key.pem:/etc/vtop/tls/meta-1-key.pem:ro"
      - "${VTOP_TLS_DIR}/data-1.pem:/etc/vtop/tls/data-1.pem:ro"
      - "${VTOP_TLS_DIR}/data-1-key.pem:/etc/vtop/tls/data-1-key.pem:ro"
      - "vtop-1-data:/home/vtop"
  vtop-2:
    <<: *node
    hostname: vtop-2
    volumes:
      - "./vtop/ha-node-2.yaml:/etc/vtop/node.yaml:ro"
      - "${VTOP_TLS_DIR:?set VTOP_TLS_DIR to the minted certificate directory}/ca.pem:/etc/vtop/tls/ca.pem:ro"
      - "${VTOP_TLS_DIR}/meta-2.pem:/etc/vtop/tls/meta-2.pem:ro"
      - "${VTOP_TLS_DIR}/meta-2-key.pem:/etc/vtop/tls/meta-2-key.pem:ro"
      - "${VTOP_TLS_DIR}/data-2.pem:/etc/vtop/tls/data-2.pem:ro"
      - "${VTOP_TLS_DIR}/data-2-key.pem:/etc/vtop/tls/data-2-key.pem:ro"
      - "vtop-2-data:/home/vtop"
  vtop-3:
    <<: *node
    hostname: vtop-3
    volumes:
      - "./vtop/ha-node-3.yaml:/etc/vtop/node.yaml:ro"
      - "${VTOP_TLS_DIR:?set VTOP_TLS_DIR to the minted certificate directory}/ca.pem:/etc/vtop/tls/ca.pem:ro"
      - "${VTOP_TLS_DIR}/meta-3.pem:/etc/vtop/tls/meta-3.pem:ro"
      - "${VTOP_TLS_DIR}/meta-3-key.pem:/etc/vtop/tls/meta-3-key.pem:ro"
      - "${VTOP_TLS_DIR}/data-3.pem:/etc/vtop/tls/data-3.pem:ro"
      - "${VTOP_TLS_DIR}/data-3-key.pem:/etc/vtop/tls/data-3-key.pem:ro"
      - "vtop-3-data:/home/vtop"

volumes:
  vtop-1-data:
  vtop-2-data:
  vtop-3-data:

networks:
  bench:
    name: kc-vtop-ha-bench
