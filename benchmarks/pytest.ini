[pytest]
# `lib` is imported as a top-level package by the harness scripts, so tests run
# from the benchmarks/ directory with it on the path.
testpaths = tests
pythonpath = .
addopts = -q
markers =
    real_latency_bound: holds the scrape-latency bound at its production value (the http.server stand-ins elsewhere are given a lenient one)
