# The Kafka Connect worker for the Lenses S3 sink (#746): standalone mode of the apache/kafka 4.3.2 runtime.
# Every setting names the page it comes from: https://kafka.apache.org/documentation/#connectconfigs
# ("Kafka Connect Configs", "Worker Configs" and "Standalone Configs").
#
# The worker's hash is recorded in environment.json (`comparable.worker_sha256`), beside the connector's.

# The source: the lab's one Kafka node.
bootstrap.servers=kafka:9092

# The record's key is not used; the value is JSON, handed to the sink as a schemaless map, which the sink writes
# back as one JSON object per line ("Worker Configs": value.converter, and the JsonConverter's schemas.enable).
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# "Standalone Configs": a sink task's offsets go to its consumer group, not to this file, which holds source
# offsets only; it exists because standalone mode requires one.
offset.storage.file.filename=/data/connect.offsets
# "Worker Configs": the worker default (60 s), stated so it is visible.
offset.flush.interval.ms=60000

# The Lenses connector's directory (tools/connect-lenses/Dockerfile).
plugin.path=/opt/connectors

# "Worker Configs": the REST interface is left on its default port, inside the lab network only.
listeners=http://0.0.0.0:8083
