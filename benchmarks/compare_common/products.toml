# The product registry of the cross-product comparisons (#744 section 2.2).
#
# One entry per product: its licence, whether a result may be published, the
# evidence that decision rests on (URL, retrieval date, the quoted clause and
# its sha256), the pinned version and image (by digest) or archive (by sha256),
# and the use cases it may appear in. `registry.py` loads and checks this file;
# every harness refuses a product with `publish_ok = false` unless `--private`
# is given, refuses one with `private_ok = false` outright, and the report
# refuses to draw either. The licence readings are not legal advice: the
# maintainer confirms them before any run for publication (#744 section 9).
#
# Use cases (#744 section 1): a Kafka topic to object storage, b files or a
# syslog spool to object storage, c upload over a long, lossy or policed link,
# d crash safety, e verification.

schema = 1

# The chart order of each family is the registry's, never rank (#744 section
# 4.3): slot 1 blue, slot 2 orange (VTOP, always), slot 3 aqua, slot 4 yellow.
[families.archive]
order = ["connect-lenses", "vtop", "vector", "redpanda-connect"]

[families.link]
order = ["aws-cli", "vtop", "rclone", "s5cmd"]

[families.spool]
order = ["fluent-bit", "vtop", "vector", "otel-collector"]

