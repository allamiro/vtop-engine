name = "VTOP"
role = "subject"
licence = "AGPL-3.0-only"
publish_ok = true
private_ok = true
evidence_url = "https://github.com/allamiro/vtop-engine/blob/main/LICENSE"
retrieved = "2026-11-24"
clause = "none"
