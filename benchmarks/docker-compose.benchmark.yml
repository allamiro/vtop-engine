# MinIO backend for the `backend: minio` benchmark scenarios.
# The benchmark runner invokes the LOCAL vtopctl binary against this endpoint.
#
#   docker compose -f benchmarks/docker-compose.benchmark.yml up -d
#   python3 benchmarks/run_benchmark.py benchmarks/scenarios/07-backend-minio-jsonl.yaml
#   docker compose -f benchmarks/docker-compose.benchmark.yml down
#
# SECURITY (issue #81): same baseline as the lab compose. Ports bind to
# LOOPBACK by default (the runner talks to 127.0.0.1:9000, so nothing off-box
# ever needed them); credentials are lab-grade and overridable via the same
# MINIO_ROOT_USER / MINIO_ROOT_PASSWORD variables the lab uses. Re-expose
# deliberately, only on a network you trust:
#   VTOP_BIND_ADDR=0.0.0.0 docker compose -f benchmarks/docker-compose.benchmark.yml up -d
#
# Override CHANNELS, precisely: exported shell variables, or a .env file in
# THIS directory — compose resolves a -f file's project directory here, so
# the repository root's .env is NOT read for this stack. The benchmark
# runner (benchmarks/lib/engine.py) reads the same two channels, so the
# client it launches always authenticates with the credentials this server
# was started with.
services:
  minio:
    # quay.io, and PINNED (#507): MinIO withdrew both repositories from Docker
    # Hub between 2026-09-11 and 2026-09-14, and every `compose up` then failed
    # in its pull phase before creating a container. quay.io serves the same
    # images bit-for-bit. The tag is explicit rather than `latest` because
    # Dependabot's docker-compose ecosystem cannot bump a floating tag — a
    # pinned one turns the next withdrawal into a failed bump instead of a
    # broken lab, which is the whole point of the ecosystem entry.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vtop-bench-minio
    command: server /data --console-address ":9001"
    ports:
      - "${VTOP_BIND_ADDR:-127.0.0.1}:9000:9000"
      - "${VTOP_BIND_ADDR:-127.0.0.1}:9001:9001"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1g
    read_only: true
    tmpfs: [/tmp]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bench-minio-data:/data
    # The default lab network, plus the store side of the netem middlebox's
    # path (#477). A FIXED address on that side because the middlebox DNATs
    # to it: resolving `minio` from a host that shares two networks with it
    # would be answerable two ways, and a middlebox that forwards to the
    # wrong one measures the wrong hop. The engine, which is on the default
    # network only, still resolves `minio` to the default-network address.
    networks:
      default:
      netem-store:
        ipv4_address: 10.77.0.10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # The image's /root has no owner write bit; root only ever wrote its
      # config there through CAP_DAC_OVERRIDE, which cap_drop removes. Point
      # mc at a directory whose write bit is real instead of restoring the
      # capability.
      HOME: /tmp
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        for b in telemetry-data telemetry-cef telemetry-leef telemetry-json telemetry-jsonl telemetry-syslog telemetry-raw vtop-bench-soak; do
          mc mb --ignore-existing "local/$$b"
        done
        echo "benchmark buckets ready"

  # The shaped path (#403): toxiproxy between the engine and MinIO, on the
  # `shaped` profile so the unshaped scenarios never pay for it. The engine
  # talks to 127.0.0.1:9100 instead of :9000; the runner installs the toxics
  # a scenario names through the API on :8474 for the run, and removes them
  # afterwards. The proxy itself is registered from toxiproxy.json at start.
  #   docker compose -f benchmarks/docker-compose.benchmark.yml --profile shaped up -d
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: vtop-bench-toxiproxy
    profiles: ["shaped"]
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/proxies.json"]
    ports:
      - "${VTOP_BIND_ADDR:-127.0.0.1}:9100:9100"
      - "${VTOP_BIND_ADDR:-127.0.0.1}:8474:8474"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 256m
    read_only: true
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy/proxies.json:ro
    depends_on:
      minio:
        condition: service_healthy

  # The containerized sender (#476): the SAME release binary the host runner
  # builds, mounted read-only — never rebuilt in an image, so host and
  # container runs measure an identical artifact — parked in the lab's
  # network where a middlebox can later sit in its L3 path. `sleep infinity`
  # plus per-cycle `exec` rather than a per-run container: a soak's cycles
  # must share one network namespace, or the pipe being shaped changes
  # identity mid-measurement.
  #
  # The run root is mounted at the SAME path it has on the host, because the
  # runner's generated config names absolute paths (state db, work dir, seed
  # glob) and rewriting them per mode would make the config another thing
  # that differs between the modes. Default /tmp, overridable via
  # VTOP_BENCH_RUN_ROOT for a runner that keeps its temp dirs elsewhere
  # (export TMPDIR to match).
  #
  # Linux-only for shaping purposes: on macOS the host-to-VM hop that
  # carries this traffic is outside tc, and the profile the engine
  # experiences is not the profile a middlebox installs.
  #   docker compose -f benchmarks/docker-compose.benchmark.yml --profile containerized up -d
  vtop-engine:
    image: ubuntu:24.04
    container_name: vtop-bench-engine
    profiles: ["containerized"]
    command: ["sleep", "infinity"]
    init: true
    # The BUILDING user's uid, not root: cargo writes the binary 0700, and
    # root with CAP_DAC_OVERRIDE dropped (cap_drop ALL, below) cannot
    # execute another user's 0700 file — found the hard way on first exec.
    # Non-root is also simply the container baseline (SECURITY_MODEL §12).
    # Override when the host uid is not 1000.
    user: "${VTOP_BENCH_UID:-1000}:${VTOP_BENCH_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 2g
    read_only: true
    tmpfs: [/scratch]
    environment:
      # The engine writes nothing outside the mounted run root; HOME points
      # at scratch so nothing in the image is asked to be writable.
      HOME: /scratch
    volumes:
      # VTOPCTL_BIN follows the runner's own selection knob (review): a
      # custom build must be the binary BOTH modes measure, or the modes
      # compare different artifacts under one name. The preflight verifies
      # the mounted bytes match the selected file by hash.
      #
      # Long syntax with create_host_path:false ON PURPOSE: the short
      # `src:dst` form makes Compose MKDIR a missing source, so a clean
      # checkout with no target/release/vtopctl yet would get a *directory*
      # bind-mounted where the binary belongs, and `vtopctl_path()` would
      # then see it exist and skip its build (review). Refusing to create the
      # path makes `up` fail loudly on a missing binary instead — build it
      # first (`cargo build --release --bin vtopctl`, or let a host-mode run
      # do it once).
      - type: bind
        source: ${VTOPCTL_BIN:-../target/release/vtopctl}
        target: /usr/local/bin/vtopctl
        read_only: true
        bind:
          create_host_path: false
      - ${VTOP_BENCH_RUN_ROOT:-/tmp}:${VTOP_BENCH_RUN_ROOT:-/tmp}
    depends_on:
      minio:
        condition: service_healthy

  # The netem middlebox (#477): the link that BITES.
  #
  # toxiproxy above can make the pipe thin and long; it terminates TCP, so it
  # cannot drop a packet, cannot police a rate, and cannot give two flows a
  # queue to share — which are exactly the conditions that separate one
  # transport from another. This container forwards at L3 between the engine
  # and the store and shapes itself with tc, so netem and tbf run HERE and
  # never on the sender, where the transmit-side queue and the local qdisc
  # would reshape the very traffic being measured.
  #
  # It is the ONLY service in this file holding CAP_NET_ADMIN, and a compose
  # lint test asserts that; the engine and the store keep cap_drop: [ALL].
  #
  # The port is deliberately NOT published. Docker's userland proxy for a
  # published port terminates TCP, which would put a second TCP-terminating
  # hop in a path whose whole purpose is to be L3 — the same defect that
  # makes toxiproxy unable to answer this question. A netem scenario is
  # therefore container-mode only, and lib/netem.py refuses a host-mode one.
  #
  #   docker compose -f benchmarks/docker-compose.benchmark.yml \
  #     --profile netem --profile containerized up -d
  netem:
    image: nicolaka/netshoot:v0.16
    container_name: vtop-bench-netem
    profiles: ["netem"]
    # tc, ifb and the forwarding rules need NET_ADMIN; iptables additionally
    # needs NET_RAW. Everything else is dropped, and nothing else in the lab
    # gains a capability because this service exists.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    sysctls:
      # Namespaced, so this forwards packets in THIS container only.
      net.ipv4.ip_forward: "1"
    # Two networks: the lab's default one, where the engine is, and the
    # store-side one it forwards onto. `priority` orders the attachment, but
    # it does NOT determine device names — Compose's reference says so
    # explicitly (review) — so lib/netem.py never assumes `eth0`. It DISCOVERS
    # the engine-facing interface by elimination: the middlebox's addressed
    # interfaces minus the one on this store subnet. That is why the subnet is
    # pinned here rather than left to Docker's pool; the driver reads it as the
    # thing to exclude, and refuses if the answer is not exactly one interface.
    networks:
      default:
        priority: 100
      netem-store:
        priority: 10
        ipv4_address: 10.77.0.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # The store, reached through this box: an engine dialling
        # netem:9200 has its packets forwarded to MinIO's store-side
        # address, so every byte crosses the qdiscs.
        iptables -t nat -A PREROUTING -p tcp --dport 9200 \
          -j DNAT --to-destination 10.77.0.10:9000
        iptables -t nat -A POSTROUTING -d 10.77.0.10 -j MASQUERADE
        # The calibration target (#477): iperf3 traffic to this box arrives
        # on the same ingress hook the upload does, so a probe run alone
        # measures the emulator rather than the engine.
        iperf3 -s -p 5201 -D
        exec sleep infinity
    depends_on:
      minio:
        condition: service_healthy

  # The calibration probe: iperf3 ALONE through the shaped path, so a run
  # whose emulator is not producing the link it was configured for is refused
  # rather than recorded. Separate from the engine container on purpose — the
  # number must not be measured beside VTOP's own traffic.
  netem-probe:
    image: nicolaka/netshoot:v0.16
    container_name: vtop-bench-netem-probe
    profiles: ["netem"]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    command: ["sleep", "infinity"]
    depends_on:
      netem:
        condition: service_started

networks:
  # The store side of the middlebox's path (#477). Its own subnet so the
  # middlebox's two interfaces are unambiguous and the DNAT target is a fixed
  # address rather than whichever answer DNS gives.
  netem-store:
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  bench-minio-data:
