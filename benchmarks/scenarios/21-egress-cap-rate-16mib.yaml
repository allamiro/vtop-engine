name: egress-cap-rate-16mib
description: >-
  The operator egress ceiling's rate criterion (#481) at R = 16 MiB/s. One
  long-lived engine (engine_mode run) uploads to the lab's MinIO through
  s3_native with upload.max_egress_bytes_per_second set, and its own
  vtop_upload_egress_bytes_total is scraped once a second. Pass: every
  one-second bucket at or below R, and the 60 s total within 10% of R x 60
  (the shaper's design predicts about 31/32 of R). The workload exists only
  to keep the shaper saturated, and is sized to offer more than R on average;
  it does not guarantee it every second. The dataset is reproducible (the
  up-front volume by initial_seed, the concurrent rounds by seed 10000 +
  round number; the recorded runs predate initial_seed and drew the up-front
  volume from OS entropy), but the engine has its own gaps (startup, cycle
  boundaries), so a run can hold zero-byte or
  under-cap buckets: the recorded passing runs of scenarios 19, 20 and 21
  hold 1, 2 and 0. The 10% tolerance on the total is what absorbs them.
  Judged by benchmarks/egress_cap_check.py on the run directory.
  Scenarios 19 and 20 are this file at 1 and 4 MiB/s, except for the
  seeding: they start from 2 files and add one per round, while this one
  pre-seeds 60 and, because the runner adds round(volume x
  backlog_multiplier) files per round, adds 30 per round. Requires the
  containerized profile, docker compose -f
  benchmarks/docker-compose.benchmark.yml --profile containerized up -d.
# WHY A CONCURRENT SEEDER, measured rather than reasoned about: a long-lived
# engine commits a cycle's sources only once EVERY batch of that cycle has
# verified, and a cycle takes everything it discovered when it began. A first
# trial seeded 300 whole files (1.7 GB) before launch at 1 MiB/s: the shaper ran at
# the cap for the whole minute, eight batches verified, and the cycle - which
# needed about 27 minutes - committed nothing, so the run was refused as having
# measured nothing. Here the first cycle is a few seconds of work, and each
# later one takes what the seeder added during the last, so cycles commit
# inside the window. That keeps an object waiting on the shaper for most of the
# window, not all of it: the engine's own gaps (startup, the seconds between a
# cycle's last verify and the next cycle's first upload) leave the shaper idle,
# and the recorded runs show them as dips and zero-byte buckets in
# egress_buckets.csv.
# A PRE-SEEDED BACKLOG at this R, measured rather than reasoned about. The
# first run of this file started from 8 files and relied on the seeder alone
# (4 files a second, planned at ~22 MB/s): writing through the lab's run-root
# mount it delivered 888 MB in the minute, about 14.6 MB/s, under the 16.8 MB/s
# cap. The shaper sent nearly every byte that existed (egress 0.870 of R x 60,
# three zero buckets where the backlog was empty), so the window measured the
# seeder, not the cap. 60 files (~330 MB) before launch keep an object waiting
# on the shaper for the whole minute; the first cycle is then ~20 s of work.
volume: 60
# THE UP-FRONT DATASET IS PINNED (#481, review), as in scenarios 19 and 20,
# where two up-front files drawn small can starve the first rounds. Here the
# 60-file backlog is large either way; pinning it (348,622,030 bytes at seed
# 481) makes the three rate scenarios reproducible alike. Added AFTER the runs
# recorded in benchmarks/measurements/481-egress-ceiling/, which used OS
# entropy here; they are not re-labelled, and their summary.json carries no
# initial_seed.
initial_seed: 481
file_size: medium
# JSONL, not whole-file binary: the runner refuses a concurrent seeder over
# whole-file input, since the engine could commit a file still being written.
format: jsonl
# Uncompressed: what the engine hands its HTTP client is what was seeded, so
# nothing between the source and the shaper changes the byte count the cap is
# judged on.
compression: none
checksum: sha256
backend: s3_native
bucket: "vtop-bench-soak"
# Container mode: the engine is the same Linux binary the netem scenarios run,
# and its /metrics is published on the host's loopback (#510). Unshaped - the
# cap is the only limit on the path.
runner_mode: container
endpoint_url: http://localhost:9000
engine_mode: run
engine_scrape_interval_seconds: 1.0
# 2 MiB batches that seal on size, so objects wait on the shaper and not on a
# batch threshold; a file's sub-2 MiB tail seals on the one-second age.
batch_max_records: 1000000
batch_max_bytes: 2097152
batch_max_age_seconds: 1
max_concurrent_batches: 4
# round(60 x 0.5) = 30 files of ~5.5 MB a round (the runner's reseed_count),
# about 165 MB asked for every second against 16.78 MB/s of cap. The seed
# directory cannot be written that fast, so each round takes as long as the
# disk needs, plus the one-second wait between rounds: the recorded passing run seeded 360 files, 2,097,715,195
# bytes in all, the 60 pre-seeded ones included (its summary.json). An earlier
# draft of this comment said 4 files a second; that was the first run's
# seeding (8 files x 0.5), not this file's.
seed_concurrently: true
backlog_multiplier: 0.5
seed_interval_seconds: 1.0
# THE CAP: 16 MiB/s of request-body bytes, process-wide.
upload_max_egress_bytes_per_second: 16777216
duration_seconds: 60
fault: none
sys_sample_interval: 1.0
