name: backpressure-soak
description: >-
  Sustained backpressure at small scale (#98): the seeder outruns the engine so
  a real backlog accumulates, and small batches make the ledger grow fast in
  ROWS rather than bytes. Replaces the 1M rec/s soak, which needed a rig and
  45 GB to reach the same condition — backpressure is a ratio, not a volume.
volume: 400
file_size: small
format: jsonl
compression: gzip
checksum: sha256
backend: mock
# SMALL BATCHES ON PURPOSE. Every batch writes its own state transitions, so
# ledger rows scale with batch count, not record count — 50 records per batch
# produces two orders of magnitude more ledger growth per byte archived than
# the default 10,000 does. Hypotheses 2 and 3 (#98) are about that growth.
batch_max_records: 50
batch_max_bytes: 1048576
batch_max_age_seconds: 5
# ABOVE ONE: the seeder adds more work per cycle than the engine drained, so
# the deficit climbs instead of clearing. This is the whole point — at the
# default 0.25 the engine is caught up by construction and none of the
# sustained-backpressure hypotheses can be observed at any scale.
backlog_multiplier: 1.5
# THE KNOB THAT MAKES THE DEFICIT REAL. Without it the seeder waits for the
# engine to drain each cycle, so the backlog is zero at the end of every one
# of them and no amount of volume changes that — which is why the original
# 1M rec/s framing would not have measured this either. Kafka's producers do
# not wait; this thread does not either.
seed_concurrently: true
seed_interval_seconds: 1.0
duration_seconds: 300
fault: none
sys_sample_interval: 2.0
