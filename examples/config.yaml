# VTOP Engine configuration (prototype / reference implementation).
#
# Explain the static per-stream settings, origins and preferred verification:
#   vtopctl validate --config examples/config.yaml --print-effective
# Add --json for effective_version: 1. No service is contacted or secret resolved.
#
# Secrets (access keys, passwords) are NEVER placed in this file. They are read
# from environment variables or mounted secrets. See docs/SECURITY_MODEL.md.

engine:
  name: vtop-engine
  tenant: default
  # SQLite paths may be inline. For PostgreSQL, replace this line with one of:
  #   state_store: { env: VTOP_STATE_STORE }
  #   state_store: { file: /run/secrets/vtop-state-store }
  # The resolved remote URL must include sslmode=verify-full (and sslrootcert
  # for a private CA that is not in the bundled public trust roots). Inline
  # PostgreSQL URLs are rejected so credentials never enter serializable config.
  state_store: "sqlite:///data/state/vtop-state.db"
  # Wall-clock limit for one state-store request (#556); whole-ledger scans such
  # as startup recovery get ten times it. A blackholed Postgres then fails the
  # request instead of hanging the engine.
  # state_store_timeout_seconds: 30
  work_dir: /data/work
  # Successful batches remove staging files immediately. These limits clean up
  # artifacts left by a crash and cap their aggregate disk use on restart.
  work_retention_seconds: 86400
  work_max_bytes: 10737418240
  log_level: INFO

batching:
  max_records: 10000
  max_bytes: 104857600
  max_batch_age_seconds: 60
  # Polling. Both are optional; these are the defaults.
  #
  # source_poll_wait_ms is the longest a read pass waits for data.
  #
  # It is paid ONCE PER PASS on the Kafka plane, not once per topic. That
  # changed in #96: the adapter assigns every topic-partition to one consumer
  # and polls them together, so a hundred idle topics cost one window rather
  # than a hundred. This comment used to say the opposite — "paid PER SOURCE,
  # serially […] a cycle over N idle Kafka topics costs up to N * this" — which
  # described the pre-#96 loop and survived the fix that removed it. An
  # operator reading it would have tuned this value down to buy back a cost
  # that no longer exists, and concluded the engine was ignoring them.
  #
  # File and syslog-spool sources do not wait on this at all: a read there
  # either finds bytes or does not.
  #
  # Raise it if a broker is slow enough that a pass comes back empty while data
  # is in fact available. Lowering it shortens the idle pass, which matters
  # only when the engine is otherwise idle — a backlogged assignment returns
  # immediately because Kafka prefetches.
  source_poll_wait_ms: 250
  # Pause between cycles ONLY when the previous cycle read nothing. A cycle
  # that read data loops straight into the next one, so a backlog drains at
  # read speed rather than being throttled by this timer.
  idle_poll_interval_ms: 2000
  # How many batches may be compressed, uploaded and verified AT ONCE (#87).
  #
  # A batch is roughly 163 ms of work and almost none of it is the same KIND of
  # work: compression is CPU, the two uploads are network round-trips, and one
  # batch running alone leaves whichever resource it is not using idle. Running
  # several overlaps them — the measured engine sat at 5.67% CPU while doing
  # this strictly one batch at a time.
  #
  # Concurrency is ACROSS batches only. Each one still reaches
  # SOURCE_COMMITTED off the back of its own verification, never another's, so
  # raising this cannot let an unverified batch commit; it only decides how
  # many verifications are in flight.
  #
  # Raise it when uploads dominate (high latency to the object store, small
  # batches). Zero is refused at startup — it would flush nothing.
  #
  # NOT A MEMORY CEILING, and worth being exact about because lowering it to
  # prevent an OOM would not work (review). A cycle drains EVERY flushable
  # buffer into a work queue first, and this setting bounds how many of those
  # are compressed, uploaded and verified AT ONCE — not how many are resident.
  # Fifty sources flushing in one cycle hold fifty payloads whatever this is
  # set to. Resident bytes are a SET OF FACTORS, not a formula (#411): each
  # buffer can exceed `max_bytes` by up to one read, because a whole read is
  # appended before the seal threshold is consulted; the buffer count is per
  # KAFKA TOPIC-PARTITION, not per configured source, so one busy topic
  # multiplies it; and a flush holds transient compressed and upload copies
  # alongside the raw payload while it runs. Sizing memory means bounding
  # those factors — source count, partition count, `max_bytes`, seal cadence
  # — not this knob.
  max_concurrent_batches: 8

compression:
  # zstd, not gzip. Measured on 13 MB of this lab's own CEF traffic:
  #
  #   gzip -6 (the code default)    32 MB/s    3.48x
  #   gzip -1                      114 MB/s    2.90x
  #   zstd -1                      417 MB/s    ~3.1x
  #   zstd -9                         -        3.68x
  #
  # zstd level 3 sits in the middle: a better ratio than gzip -1 at several
  # times gzip -6's throughput. Compression was the largest CPU cost in the
  # pipeline, so this is the cheapest available win.
  #
  # The CODE default is still gzip/6 — deliberately. Changing it would change
  # the output format for every config that omits these fields, and existing
  # objects/manifests record the codec they were written with. Set it here
  # explicitly instead, so the choice is visible and opt-in.
  type: zstd          # gzip | zstd | none
  level: 3

# Optional manifest authentication. The config stores only this environment
# variable NAME; its value must be a 32-byte key encoded as 64 hex characters.
# A configured-but-missing/malformed key is a startup error. Enabling it
# deliberately rejects unsigned pre-cutover manifests during verification and
# recovery, so verify any backlog before the cutover. This is one key with no
# key id; to rotate keys, use manifest.mac below instead (not both).
# manifest_mac_key_env: VTOP_MANIFEST_MAC_KEY

# Manifest format (#671). "0.3" (the default) is readable by every release.
# "0.4" adds verification_plan (the configured verification method and
# require_strong) and is hashed over the stored document. Enable it only once
# every engine, `vtopctl scrub` and auditor reading this archive runs v0.8.0 or
# later: v0.7.0 and earlier report 0.4 manifests as tampered. Engines before
# this release ignore the section and keep writing 0.3. Quote the value.
# manifest:
#   write_version: "0.4"
#   # The manifest MAC keyring (#685), version 0.4 only. The active key signs
#   # and its id is written in manifest.mac_key_id; every key verifies the
#   # manifests that name it; the legacy key verifies manifests with no id.
#   # A rotated-out key stays in keys (verify-only); only a withdrawn key goes
#   # in retired. Every reader must run the keyring release before the active
#   # key changes: docs/operate/manifest-key-rotation.md.
#   mac:
#     active: q4-2026
#     keys:
#       - {id: q3-2026, env: VTOP_MANIFEST_MAC_KEY, legacy: true}
#       - {id: q4-2026, file: /run/secrets/vtop-manifest-mac-q4}
#     retired: []

# Global algorithm; streams.yaml may override it per stream via checksum.algorithm.
# Keep this strong during rolling upgrades: older engines ignore the stream key.
checksum:
  algorithm: sha256

sources:
  kafka:
    enabled: true
    bootstrap_servers:
      - kafka:9092
    consumer_group: vtop-engine
    topic_include_regex: ".*"
    topic_exclude_regex: "^__.*"
    auto_offset_reset: earliest
    enable_auto_commit: false   # MUST be false — offsets commit only after VERIFIED

  file:
    enabled: true
    paths:
      - /data/input/*.log
      - /data/input/*-cef

  syslog_spool:
    enabled: true
    paths:
      - /data/spool/*.log

upload:
  backend: s3_native            # s3_native | s3cmd | awscli | minio | mock
  # The egress TRANSPORT that carries objects to the store (#479). tcp_tls (the
  # default) is the shipping path: kernel TCP inside TLS through the AWS SDK.
  # A transport is a choice made here, not a branch in the upload path; an
  # unknown name is refused at config load. VTOP_S3_TRANSPORT overrides it.
  transport: tcp_tls            # tcp_tls (default)
  # OPERATOR CEILINGS (#481). Both are unset by default, and unset is exactly
  # the pipeline without them. SETTING EITHER IS AN AGGRESSIVENESS DECISION:
  # it decides how much of a shared uplink this process may take from whatever
  # else is on it (a backfill from an edge site will otherwise take all of it).
  #
  # max_egress_bytes_per_second: a ceiling on this PROCESS's total upload body
  # bytes per second, across every object and part in flight — not per object.
  # Enforced by one token bucket per process in front of each object, manifest
  # and multipart-part body the s3_native backend sends (headers and the small
  # multipart create/complete bodies are not shaped); it is application-layer
  # rate policy over kernel TCP, and it infers nothing about the network. No
  # one-second window admits more than the cap. 97% of the cap is the shaper's
  # own sustained rate under continuous load; an engine run lands lower,
  # because startup and the gaps between cycles leave the bucket idle (the
  # recorded runs sustained 93-94%). Minimum 1024. Any backend
  # other than s3_native refuses it at startup (a CLI backend's bytes never pass
  # through VTOP). Counted in vtop_upload_egress_bytes_total, which is exported
  # only when a cap is set. Retries pass the bucket again.
  #
  # max_concurrency_ceiling: an operator maximum ABOVE the concurrency knobs.
  # batching.max_concurrent_batches, batching.adaptive_width.min_width and every
  # transports.*.max_concurrency must be at or below it or the config is refused
  # naming both numbers, and the adaptive width controller is clamped to it —
  # ceiling and floor both. Pin it in a deployment template; tuning cannot
  # raise the width past it.
  #
  # max_egress_bytes_per_second: 12500000     # e.g. 100 Mbit/s of body bytes
  # max_concurrency_ceiling: 8
  # Per-transport egress TUNING (#480): ONE shape, keyed by transport name, so
  # both paths are tuned with the IDENTICAL set of keys — a comparison between
  # them is not tuned-vs-untuned. Only the active `transport` may carry a
  # non-empty block; a knob a transport cannot honour is refused at startup,
  # never ignored. Default is empty (all-unset). Shown here for both paths so
  # the symmetry is visible; leave it out unless you are tuning. The datagram
  # path is not yet a registered transport — its block is illustrative only.
  # transports:
  #   tcp_tls:                        # the active, shipping path
  #     target_rate_bytes_per_second: # intended rate; tcp_tls refuses it — the enforced cap is max_egress_bytes_per_second
  #     max_concurrency:              # objects in flight; min() with batching.max_concurrent_batches
  #     part_size_bytes:              # part size (maps onto multipart_part_size_bytes)
  #     parts_in_flight:              # parts per object (maps onto multipart_max_parallelism)
  #     redundancy: none              # only 'none' is implemented on either path
  #   datagram:                       # the second path — same keys, illustrative
  #     target_rate_bytes_per_second: #
  #     max_concurrency:              #
  #     part_size_bytes:              #
  #     parts_in_flight:              #
  #     redundancy: none              #
  # One bucket per data format: "{format}" resolves to cef/leef/json/jsonl/
  # syslog/raw. Use a plain name (e.g. "telemetry-data") for a single bucket.
  bucket: "telemetry-{format}"
  prefix: ""
  endpoint_url: http://minio:9000
  region: us-east-1
  force_path_style: true
  # verify_tls: true (the default) REQUIRES an https:// endpoint — a plaintext
  # endpoint is then a startup error. false is the explicit lab opt-out that
  # permits plaintext (this lab's MinIO). It does NOT disable certificate
  # verification on https endpoints; private CAs go in the system trust store.
  verify_tls: false
  # Required only for the awscli/s3cmd/minio compatibility backends. PATH is
  # never searched. The binary is identity-checked with --version at startup;
  # every invocation has bounded time/output and an otherwise empty environment.
  # command_binary: /usr/local/bin/aws
  # command_timeout_seconds: 300
  # Wall-clock limit for ONE attempt of ONE request on the native S3 backend
  # (#556). Without it a store that accepts a connection and never answers
  # blocks the engine forever.
  # request_timeout_seconds: 300
  # A request that carries a body (an object, a part, a manifest) is allowed
  # request_timeout_seconds PLUS its size at this rate, per attempt (#663):
  # the slowest rate one request's body may cross the link at and still be
  # waited for. Every upload in flight shares the uplink, so this is a
  # per-request rate: at the default width (8 batches x 4 parts) 4 KiB/s each
  # is about 1 Mbit/s for the whole link. Lower it for a slower uplink or a
  # wider configuration. Must be > 0.
  # request_min_bytes_per_second: 4096
  # command_max_output_bytes: 1048576
  # command_env_allowlist:
  #   - AWS_CONFIG_FILE
  #   - AWS_SHARED_CREDENTIALS_FILE
  create_bucket: true           # auto-create per-format buckets on first use
  # Default true: VERIFIED requires a digest derived from stored content (or a
  # storage-service-computed digest). Set false only for explicit size-only
  # compatibility/lab operation: it accepts same-size corruption, and the
  # engine says so at startup and in `vtopctl validate`.
  require_strong_verification: true

partitioning:
  template: "tenant={tenant}/source={source}/format={format}/year={yyyy}/month={mm}/day={dd}/hour={hh}/"
  # Which clock fills {yyyy}..{hh} (#559): seal (default) = when the batch was
  # sealed, before upload; event = the earliest record time the source
  # reported (Kafka message timestamps), falling back to the seal time.
  # time_source: seal
