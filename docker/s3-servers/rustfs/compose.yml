# The S3 compatibility matrix's RustFS leg (#722). RustFS 1.0.5, single
# node, one local volume. Apache-2.0. The two services every server's compose
# file has: `server` and the bucket-creating `init` (see
# docker/s3-servers/minio/compose.yml). LAB-ONLY credentials; the loopback
# bind is the boundary.
name: vtop-s3-rustfs

services:
  server:
    # rustfs/rustfs:1.0.5 (amd64 and arm64), pinned by digest (D7).
    image: rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    ports:
      - "127.0.0.1:9000:9000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1g
    environment:
      RUSTFS_ACCESS_KEY: vtoplab
      RUSTFS_SECRET_KEY: vtoplab-secret-key
      RUSTFS_REGION: us-east-1
      RUSTFS_VOLUMES: /data
    volumes:
      - data:/data
      - logs:/logs

  init:
    # amazon/aws-cli 2.40.3, pinned by digest (D7, D8).
    image: amazon/aws-cli:2.40.3@sha256:33a16c53ea442e918b58df67301ad76a8fb57082c39f7e78753b898c3f3e87c2
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      HOME: /tmp
      S3_ENDPOINT: http://server:9000
      AWS_ACCESS_KEY_ID: vtoplab
      AWS_SECRET_ACCESS_KEY: vtoplab-secret-key
      CREATE_LOCKED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ../init/bootstrap.sh:/bootstrap.sh:ro
    depends_on: [server]

volumes:
  data:
  logs:
