# The S3 compatibility matrix's Versity S3 Gateway leg (#722, second wave).
# versitygw v1.11.0 over a POSIX directory, with object versions kept in a
# second directory (--versioning-dir). Apache-2.0. A gateway over a file
# tree: a different architecture from the other servers, which is the
# diversity the matrix wants. The two services every server's compose file
# has (see docker/s3-servers/minio/compose.yml). LAB-ONLY credentials; the
# loopback bind is the boundary.
name: vtop-s3-versity

services:
  server:
    # versity/versitygw:v1.11.0 (amd64), pinned by digest (D7).
    image: versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
    command:
      - --access=vtoplab
      - --secret=vtoplab-secret-key
      - --port=:7070
      - posix
      - --versioning-dir=/versions
      - /data
    ports:
      - "127.0.0.1:7070:7070"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1g
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - data:/data
      - versions:/versions

  init:
    # amazon/aws-cli 2.40.3, pinned by digest (D7, D8).
    image: amazon/aws-cli:2.40.3@sha256:33a16c53ea442e918b58df67301ad76a8fb57082c39f7e78753b898c3f3e87c2
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      HOME: /tmp
      S3_ENDPOINT: http://server:7070
      AWS_ACCESS_KEY_ID: vtoplab
      AWS_SECRET_ACCESS_KEY: vtoplab-secret-key
      CREATE_LOCKED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ../init/bootstrap.sh:/bootstrap.sh:ro
    depends_on: [server]

volumes:
  data:
  versions:
